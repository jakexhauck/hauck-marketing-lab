<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hauck Marketing — Tasks (Kanban)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #eef0f4; --card: #ffffff; --ink: #14161c; --muted: #6b7280; --faint: #9aa1ad;
    --line: #eceef2; --line-2: #e3e6ec;
    --indigo: #6366f1; --indigo-tint: #eef0ff;
    --green: #10b981; --green-tint: #e7f7f0;
    --sky: #0ea5e9; --sky-tint: #e6f5fd;
    --amber: #f59e0b; --amber-tint: #fdf3e2; --rose: #ef4444;
    --radius: 22px;
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); display: flex; height: 100dvh; overflow: hidden; -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums lining-nums; }
  .disp { font-family: "Poppins", sans-serif; }

  .spine { width: 74px; flex-shrink: 0; background: #0c1020; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 6px; }
  .brand { width: 42px; height: 42px; border-radius: 13px; margin-bottom: 14px; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: grid; place-items: center; font-family: "Poppins"; font-weight: 700; font-size: 19px; box-shadow: 0 8px 20px -6px rgba(99,102,241,.7); }
  .snav { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
  .sbtn { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #8891a8; cursor: pointer; border: 0; background: transparent; transition: .15s; position: relative; }
  .sbtn:hover { color: #fff; background: rgba(255,255,255,.06); }
  .sbtn.on { color: #fff; background: linear-gradient(135deg, #6366f1, #8b5cf6); box-shadow: 0 8px 18px -6px rgba(99,102,241,.75); }
  .sbtn svg { width: 21px; height: 21px; }
  .savatar { width: 40px; height: 40px; border-radius: 50%; margin-top: 8px; background: linear-gradient(135deg, #10b981, #0ea5e9); display: grid; place-items: center; font-family: "Poppins"; font-weight: 600; font-size: 13px; color: #fff; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 26px 30px 0; overflow: hidden; }
  .kicker { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--indigo); }
  h1.title { font-family: "Poppins"; font-weight: 700; font-size: 34px; letter-spacing: -.02em; margin-top: 4px; }
  .tagline { color: var(--muted); font-size: 14.5px; margin-top: 4px; }

  .controls { display: flex; align-items: center; gap: 16px; margin-top: 18px; flex-wrap: wrap; }
  .tabs { display: inline-flex; gap: 4px; background: #e5e8ef; padding: 5px; border-radius: 15px; }
  .tab { border: 0; background: transparent; cursor: pointer; font-family: inherit; font-size: 13.5px; font-weight: 600; color: var(--muted); padding: 8px 16px; border-radius: 11px; transition: .15s; }
  .tab:hover { color: var(--ink); }
  .tab.on { background: #fff; color: var(--ink); box-shadow: 0 2px 8px -2px rgba(20,22,28,.14); }

  .add-btn { margin-left: auto; border: 0; background: var(--indigo); color: #fff; font-family: inherit; font-weight: 600; font-size: 13px; padding: 10px 16px; border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; box-shadow: 0 8px 18px -8px rgba(99,102,241,.8); transition: .15s; }
  .add-btn:hover { background: #5457e6; }
  .add-btn svg { width: 16px; height: 16px; }

  /* board */
  .board { flex: 1; min-height: 0; margin-top: 16px; margin-bottom: 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; overflow-x: auto; }
  .col { background: var(--card); border-radius: var(--radius); box-shadow: 0 2px 16px -8px rgba(20,22,28,.18); display: flex; flex-direction: column; min-height: 0; min-width: 240px; transition: box-shadow .15s, background .15s; }
  .col.dragover { background: #f8f9fc; box-shadow: 0 0 0 2px var(--indigo), 0 2px 16px -8px rgba(20,22,28,.18); }
  .col-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; }
  .col-dot { width: 11px; height: 11px; border-radius: 4px; }
  .col.todo .col-dot { background: var(--amber); }
  .col.doing .col-dot { background: var(--sky); }
  .col.done .col-dot { background: var(--green); }
  .col-title { font-family: "Poppins"; font-weight: 600; font-size: 15px; }
  .col-count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); background: #f0f2f6; border-radius: 999px; padding: 3px 10px; min-width: 26px; text-align: center; }
  .col.todo .col-count { background: var(--amber-tint); color: #b57608; }
  .col.doing .col-count { background: var(--sky-tint); color: #0a7bb3; }
  .col.done .col-count { background: var(--green-tint); color: #0a7d58; }

  .col-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 10px; }

  .taskcard { background: #fbfbfd; border: 1px solid var(--line-2); border-radius: 16px; padding: 12px 13px; cursor: grab; transition: box-shadow .14s, transform .1s, opacity .14s; }
  .taskcard:hover { box-shadow: 0 4px 14px -8px rgba(20,22,28,.28); border-color: #d7dbe4; }
  .taskcard.dragging { opacity: .45; }
  .tc-top { display: flex; align-items: flex-start; gap: 10px; }
  .chk { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line-2); background: #fff; cursor: pointer; display: grid; place-items: center; transition: .14s; flex-shrink: 0; margin-top: 1px; }
  .chk svg { width: 13px; height: 13px; color: #fff; opacity: 0; transform: scale(.6); transition: .14s; }
  .chk.on { background: var(--green); border-color: var(--green); }
  .chk.on svg { opacity: 1; transform: scale(1); }

  input.card-task { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-weight: 600; font-size: 14px; color: var(--ink); padding: 3px 5px; border-radius: 8px; transition: background .12s, box-shadow .12s; }
  input.card-note { width: 100%; border: 0; background: transparent; font: inherit; font-weight: 400; font-size: 12.5px; color: var(--muted); padding: 3px 5px; margin-top: 6px; border-radius: 8px; transition: background .12s, box-shadow .12s; }
  input.card-upd { width: 100%; border: 0; background: transparent; font: inherit; font-weight: 400; font-size: 12px; color: var(--faint); padding: 3px 5px; margin-top: 2px; border-radius: 8px; transition: background .12s, box-shadow .12s; }
  .taskcard input::placeholder { color: #cfd4de; }
  .taskcard input:hover { background: #eef0f5; }
  .taskcard input:focus { outline: 0; background: #fff; box-shadow: 0 0 0 2px var(--indigo); }

  .notewrap { display: flex; align-items: center; margin-top: 6px; }
  .notewrap input.card-note { margin-top: 0; }
  .fileicon { color: var(--sky); width: 14px; height: 14px; flex-shrink: 0; margin-right: 3px; opacity: .8; }

  .card-done { opacity: .66; }
  .card-done input.card-task { text-decoration: line-through; color: var(--faint); }

  .col-add { margin: 0 12px 12px; border: 1px dashed var(--line-2); background: transparent; color: var(--muted); font: inherit; font-weight: 600; font-size: 12.5px; padding: 9px; border-radius: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: .14s; }
  .col-add:hover { border-color: var(--indigo); color: var(--indigo); background: var(--indigo-tint); }
  .col-add svg { width: 14px; height: 14px; }

  .footnote { font-size: 11px; color: var(--faint); padding: 0 2px 14px; }

  @media (max-width: 860px) { .board { grid-template-columns: 1fr; overflow-y: auto; } .col { min-height: 220px; } }
  @media (max-width: 720px) { .main { padding: 18px 14px 0; } .add-btn { margin-left: 0; } }
</style>
</head>
<body>
  <aside class="spine">
    <div class="brand">H</div>
    <nav class="snav">
      <button class="sbtn" title="Command"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
      <button class="sbtn" title="Acquisition"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></button>
      <button class="sbtn" title="Sales"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17a4 4 0 0 1-8 0V7a4 4 0 0 1 8 0"/><path d="M13 7a4 4 0 0 1 8 0v10a4 4 0 0 1-8 0"/><path d="M11 7H3M21 17h-8"/></svg></button>
      <button class="sbtn" title="Fulfillment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg></button>
      <button class="sbtn on" title="Operations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76Z"/></svg></button>
    </nav>
    <button class="sbtn" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></button>
    <div class="savatar">JH</div>
  </aside>

  <main class="main">
    <div class="kicker">Operations</div>
    <h1 class="title">Tasks</h1>
    <p class="tagline">Your working checklist.</p>

    <div class="controls">
      <div class="tabs">
        <button class="tab">Calculator</button>
        <button class="tab">Time Audit</button>
        <button class="tab on">Tasks</button>
      </div>
      <button class="add-btn" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Add task</button>
    </div>

    <div class="board" id="board">
      <div class="col todo" data-status="todo">
        <div class="col-head"><span class="col-dot"></span><span class="col-title">To do</span><span class="col-count" id="ct-todo">0</span></div>
        <div class="col-body" id="col-todo"></div>
        <button class="col-add" data-status="todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Add task</button>
      </div>
      <div class="col doing" data-status="doing">
        <div class="col-head"><span class="col-dot"></span><span class="col-title">Doing</span><span class="col-count" id="ct-doing">0</span></div>
        <div class="col-body" id="col-doing"></div>
        <button class="col-add" data-status="doing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Add task</button>
      </div>
      <div class="col done" data-status="done">
        <div class="col-head"><span class="col-dot"></span><span class="col-title">Done</span><span class="col-count" id="ct-done">0</span></div>
        <div class="col-body" id="col-done"></div>
        <button class="col-add" data-status="done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Add task</button>
      </div>
    </div>
    <div class="footnote">Editable demo. Drag a card between columns, check it off, or add one. Sample data for design review.</div>
  </main>

<script>
  let idc = 0;
  const SEED = [
    { task:"Make 100 cold calls",         note:"Dialer list ready",         file:false, status:"doing", upd:"62 done by noon" },
    { task:"40 min sales training",        note:"Objection handling module", file:false, status:"todo",  upd:"" },
    { task:"Scrape 50 leads",              note:"leads-batch-07.csv",        file:true,  status:"done",  upd:"54 pulled" },
    { task:"Send 25 follow-up SMS",        note:"GHL templates",             file:false, status:"doing", upd:"11 replies" },
    { task:"Review Willis ad creatives",   note:"3 videos to approve",       file:false, status:"todo",  upd:"" },
    { task:"Post 2 client reels",          note:"reels-queue.mov",           file:true,  status:"done",  upd:"scheduled 9am" },
    { task:"Update Sales pipeline stages", note:"Board cleanup",             file:false, status:"todo",  upd:"" },
    { task:"Log yesterday's numbers",      note:"cold-call tracker",         file:false, status:"done",  upd:"synced" }
  ];
  let rows = SEED.map(r => ({ ...r, id: ++idc }));

  const FILE_SVG = '<svg class="fileicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
  const CHK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  const esc = (s) => (s||"").replace(/"/g,"&quot;");

  function cardHTML(r) {
    const done = r.status === "done";
    return '<div class="taskcard'+(done?" card-done":"")+'" draggable="true" data-id="'+r.id+'">'+
      '<div class="tc-top">'+
        '<div class="chk'+(done?" on":"")+'" data-id="'+r.id+'" role="checkbox" tabindex="0" aria-checked="'+done+'">'+CHK_SVG+'</div>'+
        '<input class="card-task" data-id="'+r.id+'" data-f="task" value="'+esc(r.task)+'" placeholder="New task" />'+
      '</div>'+
      '<div class="notewrap">'+(r.file?FILE_SVG:"")+'<input class="card-note" data-id="'+r.id+'" data-f="note" value="'+esc(r.note)+'" placeholder="Notes or file" /></div>'+
      '<input class="card-upd" data-id="'+r.id+'" data-f="upd" value="'+esc(r.upd)+'" placeholder="Add an update" />'+
    '</div>';
  }

  function render() {
    ["todo","doing","done"].forEach(st => {
      const body = document.getElementById("col-" + st);
      const list = rows.filter(r => r.status === st);
      body.innerHTML = list.map(cardHTML).join("");
      document.getElementById("ct-" + st).textContent = list.length;
    });
  }

  const byId = (id) => rows.find(r => r.id === +id);

  // checkbox toggle: on = move to Done, off = move to To do
  document.getElementById("board").addEventListener("click", (e) => {
    const chk = e.target.closest(".chk");
    if (!chk) return;
    const r = byId(chk.dataset.id);
    r.status = (r.status === "done") ? "todo" : "done";
    render();
  });
  document.getElementById("board").addEventListener("keydown", (e) => {
    const chk = e.target.closest(".chk");
    if (chk && (e.key === " " || e.key === "Enter")) {
      e.preventDefault();
      const r = byId(chk.dataset.id);
      r.status = (r.status === "done") ? "todo" : "done";
      render();
    }
  });

  document.getElementById("board").addEventListener("input", (e) => {
    const el = e.target;
    if (!el.dataset || el.dataset.id === undefined || !el.dataset.f) return;
    byId(el.dataset.id)[el.dataset.f] = el.value;
  });

  // add row into a column
  document.querySelectorAll(".col-add").forEach(btn => {
    btn.addEventListener("click", () => {
      const st = btn.dataset.status;
      const nr = { id: ++idc, task:"", note:"", file:false, status:st, upd:"" };
      rows.push(nr);
      render();
      const inp = document.querySelector('.taskcard[data-id="'+nr.id+'"] input.card-task');
      if (inp) inp.focus();
    });
  });
  document.getElementById("addBtn").onclick = () => document.querySelector('.col-add[data-status="todo"]').click();

  // drag and drop between columns
  let dragId = null;
  document.getElementById("board").addEventListener("dragstart", (e) => {
    const card = e.target.closest(".taskcard");
    if (!card) return;
    dragId = card.dataset.id;
    card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", dragId); } catch (_) {}
  });
  document.getElementById("board").addEventListener("dragend", (e) => {
    const card = e.target.closest(".taskcard");
    if (card) card.classList.remove("dragging");
    document.querySelectorAll(".col").forEach(c => c.classList.remove("dragover"));
    dragId = null;
  });
  document.querySelectorAll(".col").forEach(col => {
    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("dragover"); });
    col.addEventListener("dragleave", (e) => { if (!col.contains(e.relatedTarget)) col.classList.remove("dragover"); });
    col.addEventListener("drop", (e) => {
      e.preventDefault();
      col.classList.remove("dragover");
      if (dragId == null) return;
      const r = byId(dragId);
      if (r) { r.status = col.dataset.status; render(); }
    });
  });

  render();
</script>
</body>
</html>
