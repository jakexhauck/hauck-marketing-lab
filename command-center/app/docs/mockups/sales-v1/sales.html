<!doctype html><html lang="en" data-theme="light"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales — Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   Sales mockup — faithful extract of the command-center "Console / Modern
   Motion" tokens + components. Built for a contractor owner: money first,
   one-tap actions, no pipeline jargon. The GHL Sales pipeline stages run
   underneath; the owner only sees New Leads -> Booked Visits -> Waiting on a
   Yes -> Won.
   ========================================================================= */
:root{
  --brand-fg:#fff; --bg:#f6f7fb; --surface:#fff; --surface-2:#f1f3f9; --surface-3:#e9ebf3; --rail:#fbfcfe;
  --text:#14161f; --text-muted:#555a6b; --text-faint:#8a90a3;
  --border:#e7e9f1; --border-strong:#d4d8e6; --divider:#f1f3f9;
  --brand:#4f46e5; --brand-2:#7c73f0; --brand-strong:#4338ca; --brand-text:#4f46e5;
  --brand-tint:color-mix(in srgb,var(--brand) 10%,transparent);
  --brand-tint-strong:color-mix(in srgb,var(--brand) 18%,transparent);
  --grad-brand:linear-gradient(135deg,#4f46e5 0%,#7c73f0 100%);
  --money:#16a34a; --money-tint:color-mix(in srgb,#16a34a 12%,transparent);
  --money-grad:linear-gradient(135deg,#15803d 0%,#22c55e 100%);
  --sms:#0ea5e9; --sms-tint:color-mix(in srgb,#0ea5e9 12%,transparent);
  --positive:#16a34a; --positive-tint:color-mix(in srgb,#16a34a 12%,transparent);
  --warning:#d97706; --warning-tint:color-mix(in srgb,#d97706 14%,transparent);
  --danger:#dc2626; --danger-tint:color-mix(in srgb,#dc2626 12%,transparent);
  --shadow-sm:0 1px 2px rgba(20,22,31,.04),0 1px 3px rgba(20,22,31,.05);
  --shadow-md:0 6px 18px rgba(40,42,70,.07),0 2px 6px rgba(40,42,70,.05);
  --shadow-lg:0 18px 40px rgba(40,42,70,.12),0 6px 14px rgba(40,42,70,.07);
  --shadow-brand:0 8px 22px rgba(79,70,229,.28);
  --shadow-money:0 8px 22px rgba(22,163,74,.26);
  --ease:cubic-bezier(.22,1,.36,1);
  --font-display:"Poppins","Inter",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",monospace;
  --radius-sm:8px; --radius:10px; --radius-lg:14px;
}
[data-theme="dark"]{
  --bg:#0c0d14; --surface:#15161f; --surface-2:#1c1d28; --surface-3:#232536; --rail:#11121b;
  --text:#f4f4fb; --text-muted:#a8adc0; --text-faint:#6b7088;
  --border:#262837; --border-strong:#34374a; --divider:#20222e;
  --brand-text:color-mix(in srgb,var(--brand) 70%,white);
  --money:#4ade80; --money-tint:color-mix(in srgb,#22c55e 16%,transparent);
  --positive:#4ade80; --warning:#fbbf24; --danger:#f87171; --sms:#38bdf8;
  --shadow-brand:0 8px 22px rgba(79,70,229,.45);
  --shadow-money:0 8px 22px rgba(34,197,94,.34);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-body);-webkit-font-smoothing:antialiased;color:var(--text);background-color:var(--bg);
  background-image:
    radial-gradient(60rem 40rem at 12% -8%,rgba(124,115,240,.16),transparent 60%),
    radial-gradient(50rem 38rem at 100% 0%,rgba(79,70,229,.12),transparent 55%),
    radial-gradient(46rem 36rem at 50% 120%,rgba(99,102,241,.1),transparent 60%);
  background-attachment:fixed;
}
[data-theme="dark"] body{background-image:
  radial-gradient(60rem 40rem at 12% -8%,rgba(124,115,240,.1),transparent 60%),
  radial-gradient(50rem 38rem at 100% 0%,rgba(79,70,229,.08),transparent 55%),
  radial-gradient(46rem 36rem at 50% 120%,rgba(99,102,241,.07),transparent 60%);}

.font-display{font-family:var(--font-display);letter-spacing:-.025em}
.font-data{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.label-cap{text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:10.5px;color:var(--text-muted)}
.muted{color:var(--text-muted)} .faint{color:var(--text-faint)} .brand-text{color:var(--brand-text)}

/* ---- shell ---- */
.glass{background:color-mix(in srgb,var(--surface) 62%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
.app{display:flex;min-height:100dvh}
.sidebar{width:244px;flex-shrink:0;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.5);overflow-y:auto}
[data-theme="dark"] .sidebar{border-right-color:rgba(255,255,255,.1)}
.brandmark{height:34px;width:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;background-image:var(--grad-brand);box-shadow:var(--shadow-brand)}
.nav-row{display:flex;align-items:center;gap:12px;width:100%;border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:500;color:var(--text-muted);background:none;border:none;cursor:pointer;text-decoration:none;transition:color .2s,background .2s,transform .2s;text-align:left;margin-bottom:2px}
.nav-row:hover{background:rgba(255,255,255,.6);color:var(--text);transform:translateX(2px)}
[data-theme="dark"] .nav-row:hover{background:rgba(255,255,255,.05)}
.nav-row.active{background-image:var(--grad-brand);color:#fff;box-shadow:var(--shadow-brand)}
.nav-row.open{background:rgba(255,255,255,.7);color:var(--brand-text)}
[data-theme="dark"] .nav-row.open{background:rgba(255,255,255,.06)}
.nav-row svg{width:17px;height:17px;flex-shrink:0;opacity:.8}
.nav-row .count{margin-left:auto;font-family:var(--font-mono);font-size:11px;font-weight:600;background:var(--brand-tint);color:var(--brand-text);border-radius:999px;padding:1px 7px;opacity:1}
.nav-row.active .count{background:rgba(255,255,255,.22);color:#fff}
.nav-children{margin-left:22px;margin-top:2px;padding-left:10px;border-left:1px solid var(--divider);display:flex;flex-direction:column}
.nav-children .nav-row{font-size:13px;padding:8px 12px}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 22px;border-bottom:1px solid var(--border)}
.container{width:100%;max-width:72rem;margin:0 auto;flex:1 1 auto;padding:20px 32px 64px}

/* ---- page header ---- */
.page-header{margin-bottom:18px}
.page-title{font-family:var(--font-display);font-size:22px;line-height:1;color:var(--text);letter-spacing:-.025em;margin:0;font-weight:600}
.page-desc{margin:6px 0 0;font-size:14px;color:var(--text-muted)}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}

/* ---- panel ---- */
.panel{border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-sm)}
.panel-header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--divider);padding:12px 16px}
.panel-header h3{font-family:var(--font-display);font-size:15px;color:var(--text);margin:0;font-weight:600}
.see-all{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--brand-text);text-decoration:none;cursor:pointer}
.see-all:hover{text-decoration:underline}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-body);font-weight:600;white-space:nowrap;cursor:pointer;height:38px;padding:0 16px;font-size:14px;border-radius:var(--radius);border:1px solid transparent;transition:background-color .12s,transform .1s,filter .12s}
.btn:active{transform:scale(.97)} .btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand);color:var(--brand-fg);box-shadow:var(--shadow-sm)}
.btn-primary:hover{background:var(--brand-strong)}
.btn-money{background-image:var(--money-grad);color:#fff;box-shadow:var(--shadow-money)}
.btn-money:hover{filter:brightness(1.05)}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--text);font-weight:500}
.btn-secondary:hover{background:var(--surface-2)}
.btn-sm{height:32px;padding:0 12px;font-size:13px;border-radius:var(--radius-sm);gap:6px}
.btn-ghost{background:transparent;color:var(--text-muted);border-color:transparent;font-weight:500}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn[disabled]:active{transform:none}

/* ---- badge / tones ---- */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600;letter-spacing:.01em}
.badge .dot{width:6px;height:6px;border-radius:999px;background:currentColor}
.tone-brand{background:var(--brand-tint);color:var(--brand-text)}
.tone-warning{background:var(--warning-tint);color:var(--warning)}
.tone-positive{background:var(--positive-tint);color:var(--positive)}
.tone-money{background:var(--money-tint);color:var(--money)}
.tone-neutral{background:var(--surface-2);color:var(--text-muted)}
.tone-danger{background:var(--danger-tint);color:var(--danger)}
.tone-sms{background:var(--sms-tint);color:var(--sms)}
.src{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px 2px 7px;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--text-muted)}
.src svg{width:12px;height:12px}
.src.ads{background:var(--brand-tint);color:var(--brand-text)}
.src.review{background:var(--warning-tint);color:var(--warning)}
.src.web{background:var(--sms-tint);color:var(--sms)}

/* ---- money hero ---- */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:16px}
@media (max-width:980px){.hero{grid-template-columns:1fr}}
.hero-money{border-radius:var(--radius-lg);padding:20px 22px;color:#fff;background-image:var(--money-grad);box-shadow:var(--shadow-money);position:relative;overflow:hidden}
.hero-money::after{content:"";position:absolute;right:-30px;top:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero-money .hm-label{font-size:13px;font-weight:600;opacity:.9;display:flex;align-items:center;gap:7px}
.hero-money .hm-value{font-family:var(--font-display);font-weight:800;letter-spacing:-.04em;font-size:46px;line-height:1;margin-top:10px;font-variant-numeric:tabular-nums}
.hero-money .hm-sub{margin-top:8px;font-size:13.5px;opacity:.92}
.hero-money .hm-foot{margin-top:16px;display:flex;gap:18px;position:relative;z-index:1}
.hero-money .hm-foot .hf{font-size:12px;opacity:.85}
.hero-money .hm-foot .hf b{display:block;font-family:var(--font-mono);font-size:18px;font-weight:700;margin-top:2px}
.hero-side{border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-sm);padding:18px 20px;display:flex;flex-direction:column;justify-content:center}
.hero-side .hs-label{font-size:13px;color:var(--text-muted);font-weight:600;display:flex;align-items:center;gap:7px}
.hero-side .hs-value{font-family:var(--font-display);font-weight:800;letter-spacing:-.04em;font-size:40px;line-height:1;margin-top:10px;color:var(--money);font-variant-numeric:tabular-nums}
.hero-side .hs-sub{margin-top:7px;font-size:13px;color:var(--text-faint)}
.hero-side .hs-cta{margin-top:14px}

/* ---- mini stat row ---- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media (max-width:980px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:14px 16px}
.stat .s-label{font-size:12.5px;color:var(--text-muted)}
.stat .s-value{margin-top:6px;font-family:var(--font-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}
.stat .s-sub{margin-top:3px;font-size:11.5px;color:var(--text-faint)}

/* ---- list rows ---- */
.list-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--divider)}
.list-row:last-child{border-bottom:none}
.avatar{width:38px;height:38px;border-radius:999px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--text-muted);flex-shrink:0}
.avatar.warm{background:var(--warning-tint);color:var(--warning)}
.row-main{flex:1 1 auto;min-width:0}
.row-title{font-family:var(--font-display);font-size:14.5px;font-weight:600;letter-spacing:-.015em;color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row-meta{font-size:12.5px;color:var(--text-faint);margin-top:3px}
.row-money{font-family:var(--font-mono);font-weight:700;font-size:15px;color:var(--money);font-variant-numeric:tabular-nums}
.row-actions{display:flex;align-items:center;gap:7px;flex-shrink:0}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.14s}
.icon-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-strong)}
.icon-btn.call:hover{background:var(--money-tint);color:var(--money);border-color:var(--money)}
.icon-btn.text:hover{background:var(--sms-tint);color:var(--sms);border-color:var(--sms)}
.icon-btn svg{width:16px;height:16px}

/* ---- lead cards ---- */
.lead-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:980px){.lead-grid{grid-template-columns:1fr}}
.lead-card{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s,border-color .15s}
.lead-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--border-strong)}
.lead-card.fresh{border-color:var(--money);box-shadow:0 0 0 1px var(--money-tint),var(--shadow-sm)}
.lead-top{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 12px}
.lead-name{font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:-.02em}
.lead-need{font-size:13.5px;color:var(--text-muted);margin-top:4px;line-height:1.4}
.lead-chips{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:0 16px 14px}
.lead-foot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--divider);border-top:1px solid var(--divider);margin-top:auto}
.lead-act{background:var(--surface);border:none;cursor:pointer;font-family:var(--font-body);font-size:12.5px;font-weight:600;color:var(--text-muted);padding:11px 0;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.14s}
.lead-act svg{width:15px;height:15px}
.lead-act:hover{background:var(--surface-2);color:var(--text)}
.lead-act.book{color:var(--brand-text)}
.lead-act.book:hover{background:var(--brand-tint)}
.fresh-flag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--money);text-transform:uppercase;letter-spacing:.05em}
.fresh-flag .pulse{width:7px;height:7px;border-radius:999px;background:var(--money);box-shadow:0 0 0 0 var(--money);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--money) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* ---- waiting / quote rows ---- */
.q-aged{color:var(--warning)}
.q-cold{color:var(--danger)}

/* ---- callout ---- */
.callout{display:flex;align-items:flex-start;gap:12px;border-radius:var(--radius-lg);padding:15px 16px;border:1px solid var(--brand);background:var(--brand-tint);margin-top:16px}
.callout.money{border-color:var(--money);background:var(--money-tint)}
.callout svg{width:20px;height:20px;flex-shrink:0;color:var(--brand-text)}
.callout.money svg{color:var(--money)}
.callout .txt{font-size:13.5px;line-height:1.45;color:var(--text)}

.lower{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:980px){.lower{grid-template-columns:1fr}}

/* ---- filter chips ---- */
.filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:999px;height:30px;padding:0 14px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:var(--font-body);transition:.15s}
.chip:hover{color:var(--text);border-color:var(--border-strong)}
.chip.on{background:var(--brand-tint);border-color:var(--brand);color:var(--brand-text)}

/* ---- progress / funnel ---- */
.funnel{display:flex;flex-direction:column;gap:11px;padding:16px}
.fl{display:flex;align-items:center;gap:12px}
.fl .fl-name{font-size:13px;color:var(--text-muted);width:120px;flex-shrink:0}
.fl .fl-track{flex:1;height:26px;border-radius:8px;background:var(--surface-2);overflow:hidden;position:relative}
.fl .fl-fill{height:100%;border-radius:8px;background-image:var(--grad-brand);display:flex;align-items:center;padding-left:10px}
.fl .fl-fill.money{background-image:var(--money-grad)}
.fl .fl-num{font-family:var(--font-mono);font-size:12px;font-weight:700;color:#fff}
.fl .fl-val{font-family:var(--font-mono);font-size:12.5px;font-weight:600;color:var(--text-muted);width:64px;text-align:right;flex-shrink:0}

/* ---- visits / calendar-ish list ---- */
.day-head{font-family:var(--font-display);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);padding:14px 16px 6px}
.visit{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--divider)}
.visit:last-child{border-bottom:none}
.vtime{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text);width:74px;flex-shrink:0;text-align:center;line-height:1.3}
.vtime small{display:block;font-size:10px;color:var(--text-faint);font-weight:500;letter-spacing:.04em}
.vbar{width:3px;align-self:stretch;border-radius:999px;background-image:var(--grad-brand);flex-shrink:0}

/* ---- dialog ---- */
.scrim{position:fixed;inset:0;background:rgba(15,16,28,.5);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:60;padding:24px}
.scrim.show{display:flex}
.dialog{width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--divider)}
.dlg-head h3{font-family:var(--font-display);font-size:17px;font-weight:600;margin:0}
.dlg-x{width:32px;height:32px;border-radius:8px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.dlg-x:hover{background:var(--surface-2);color:var(--text)}
.dlg-body{padding:20px;overflow-y:auto}
.dlg-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--divider);background:var(--rail)}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:6px}
.input,.textarea,select.input{width:100%;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:var(--font-body);font-size:14px;padding:10px 12px}
.input:focus,.textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
.textarea{resize:vertical;min-height:80px;line-height:1.5}
.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1px solid var(--border-strong);border-radius:var(--radius);padding:9px 0;text-align:center;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-mono);color:var(--text);transition:.14s}
.slot:hover{border-color:var(--brand)}
.slot.sel{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-text);box-shadow:0 0 0 1px var(--brand) inset}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;transition:.25s var(--ease);z-index:80;pointer-events:none;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px;color:var(--money)}

function pageTop(title,desc,actions){return '<div class="head"><div class="page-header"><h2 class="page-title">'+esc(title)+'</h2><p class="page-desc">'+esc(desc)+'</p></div>'+(actions?'<div class="head-actions">'+actions+'</div>':'')+'</div>';}

function stat(label,value,sub,goto){return '<div class="panel stat'+(goto?' ':'')+'" '+(goto?'style="cursor:pointer" data-goto="'+goto+'"':'')+'><div class="s-label">'+esc(label)+'</div><div class="s-value">'+esc(value)+'</div><div class="s-sub">'+esc(sub)+'</div></div>';}
function leadRowMini(l){return '<div class="list-row"><div class="avatar">'+esc(l.init)+'</div><div class="row-main"><div class="row-title">'+esc(l.name)+(l.fresh?' <span class="badge tone-money"><span class="dot"></span>New</span>':'')+'</div><div class="row-meta">'+esc(l.need)+'</div></div><div class="row-actions"><button class="icon-btn call" title="Call" data-toast="Calling '+esc(l.name)+'…">'+icon('phone',16)+'</button><button class="icon-btn" title="Book visit" data-book="'+esc(l.name)+'">'+icon('calendar',16)+'</button></div></div>';}

/* ============================ router ============================ */
const state={page:'overview'};
function render(){
  const el=document.getElementById('page');
  el.innerHTML=(PAGES[state.page]||PAGES.overview)();
  fillIcons(el);
  document.querySelectorAll('.nav-children .nav-row').forEach(n=>n.classList.toggle('active',n.dataset.page===state.page));
  el.scrollIntoView({block:'start'});
}
function goto(p){state.page=p;render();}

/* ============================ book dialog ============================ */
const SLOTS=['Today 2:30','Today 4:00','Tmrw 9:00','Tmrw 11:00','Tmrw 1:00','Fri 10:00'];
function openBook(name){
  document.getElementById('bookTitle').textContent='Book a visit'+(name&&name!=='a customer'&&name!=='a new lead'?' — '+name:'');
  document.getElementById('bookBody').innerHTML=
    '<div class="field"><label>Pick a time</label><div class="slot-grid">'+SLOTS.map((s,i)=>'<div class="slot'+(i===2?' sel':'')+'" data-slot>'+esc(s)+'</div>').join('')+'</div></div>'+
    '<div class="field"><label>What&rsquo;s the job?</label><input class="input" value="'+(name==='a new lead'||name==='a customer'?'':'Estimate visit')+'" placeholder="e.g. Water heater estimate"></div>'+
    '<div class="field" style="margin-bottom:0;"><label>Note for your tech (optional)</label><textarea class="textarea" placeholder="Gate code, parking, what to bring…"></textarea></div>';
  document.querySelectorAll('#bookBody [data-slot]').forEach(s=>s.onclick=()=>{document.querySelectorAll('#bookBody [data-slot]').forEach(x=>x.classList.remove('sel'));s.classList.add('sel');});
  document.getElementById('bookDlg').classList.add('show');
}

/* ============================ toast ============================ */
let toastT;
function toast(msg,money){const t=document.getElementById('toast');t.innerHTML=(money?icon('checkc',16):'')+esc(msg);t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}

/* ============================ events ============================ */
document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-page]'); if(nav){e.preventDefault();goto(nav.dataset.page);return;}
  const go=e.target.closest('[data-goto]'); if(go){e.preventDefault();goto(go.dataset.goto);return;}
  const bk=e.target.closest('[data-book]'); if(bk){e.preventDefault();openBook(bk.dataset.book);return;}
  const tt=e.target.closest('[data-toast]'); if(tt){e.preventDefault();toast(tt.dataset.toast);return;}
  if(e.target.closest('[data-close]')){document.getElementById('bookDlg').classList.remove('show');return;}
  if(e.target.id==='bookConfirm'){document.getElementById('bookDlg').classList.remove('show');toast('Visit booked. Customer got a confirmation text.',true);return;}
  if(e.target===document.getElementById('bookDlg')){document.getElementById('bookDlg').classList.remove('show');}
});

/* theme */
const themeBtn=document.getElementById('themeBtn');
function setTheme(t){document.documentElement.dataset.theme=t;themeBtn.innerHTML=icon(t==='dark'?'sun':'moon',16);}
themeBtn.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* init */
fillIcons(document);
setTheme('light');
render();
</script>
</body></html>
