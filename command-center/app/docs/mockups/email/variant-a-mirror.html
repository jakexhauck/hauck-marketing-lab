<!doctype html><html lang="en" data-theme="light"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email Campaigns — Variant A (Mirror)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./kit.css">
<style>
  /* Variant-A-only layout helpers (grid scaffolding only; everything visual comes from kit.css) */
  .va-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .va-header .page-header { margin-bottom: 0; }
  .va-header-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .va-filter { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 18px 0 16px; }
  .va-audience { font-size: 13px; color: var(--text-muted); }

  .va-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }

  .va-lower { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }
  .va-left, .va-right { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  .va-glyph {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--brand-tint); color: var(--brand-text);
  }
  .va-row-main { flex: 1 1 auto; min-width: 0; }
  .va-row-title { font-family: var(--font-display); font-size: 14px; font-weight: 600; letter-spacing: -0.015em; color: var(--text); }
  .va-row-meta { font-size: 12.5px; color: var(--text-faint); margin-top: 2px; }
  .va-row-right { text-align: right; flex-shrink: 0; }
  .va-metric { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--positive); font-variant-numeric: tabular-nums; }
  .va-sub { font-size: 11px; color: var(--text-faint); margin-top: 2px; }

  .va-ideas { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
  .va-idea {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 12px 12px 16px; background: var(--surface);
    transition: border-color .15s, transform .15s, box-shadow .15s;
  }
  .va-idea:hover { border-color: var(--border-strong); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .va-idea-title { font-size: 13.5px; font-weight: 600; color: var(--text); margin-top: 5px; line-height: 1.35; }
  .va-idea-cta { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--brand-text); margin-top: 8px; }
  .va-idea-cta svg { width: 14px; height: 14px; }

  .va-callout {
    display: flex; align-items: flex-start; gap: 12px;
    border-radius: var(--radius-lg); padding: 16px;
    border: 1px solid var(--warning); background: var(--warning-tint);
  }
  .va-callout.tone-brand { border-color: var(--brand); background: var(--brand-tint); }
  .va-callout-icon { flex-shrink: 0; display: inline-flex; }
  .va-callout-icon svg { width: 20px; height: 20px; }
  .va-callout-text { font-size: 13.5px; line-height: 1.45; color: var(--text); }
  .va-callout-text strong { font-weight: 700; }

  /* Ideas page: responsive 2-up card grid */
  .va-grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .va-idea-card {
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
    padding: 14px 16px 14px 18px; transition: border-color .15s, transform .15s, box-shadow .15s;
  }
  .va-idea-card:hover { border-color: var(--border-strong); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .va-idea-card .t { font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: -0.015em; margin-top: 6px; line-height: 1.35; color: var(--text); }
  .va-idea-card .why { font-size: 13px; color: var(--text-muted); margin-top: 6px; line-height: 1.45; }

  /* Filter chips (Campaigns) */
  .va-chip {
    border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
    border-radius: 999px; height: 30px; padding: 0 14px; font-size: 12.5px; font-weight: 500;
    cursor: pointer; font-family: var(--font-body); transition: color .15s, background .15s, border-color .15s;
  }
  .va-chip:hover { color: var(--text); border-color: var(--border-strong); }
  .va-chip.on { background: var(--brand-tint); border-color: var(--brand); color: var(--brand-text); }

  /* Calendar */
  .va-cal-head, .va-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .va-cal-head { margin-bottom: 6px; }
  .va-cal-cell { min-height: 92px; border: 1px solid var(--border); border-radius: 8px; padding: 6px; background: var(--surface); overflow: hidden; }
  .va-cal-empty { background: transparent; border-color: transparent; }
  .va-cal-dom { font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .va-cal-today { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; background: var(--brand-tint); }
  .va-cal-today .va-cal-dom { color: var(--brand-text); }
  .va-cal-chip {
    display: block; margin-top: 4px; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-size: 10px; padding: 2px 6px;
  }

  /* Insights bars */
  .va-bar-row { display: block; }
  .va-bar-track { margin-top: 9px; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .va-bar-fill { height: 100%; border-radius: 999px; background-image: var(--grad-brand); }

  @media (max-width: 880px) {
    .va-lower { grid-template-columns: 1fr; }
    .va-kpis { grid-template-columns: repeat(2, 1fr); }
    .va-grid2 { grid-template-columns: 1fr; }
  }
  @media (max-width: 620px) {
    .va-cal-cell { min-height: 64px; }
  }
</style>
</head><body>
<div class="app">
  <aside class="sidebar glass">
    <!-- brand mark -->
    <div style="display:flex;align-items:center;gap:10px;padding:16px 16px 16px;">
      <span class="brandmark">WP</span>
      <div style="min-width:0;">
        <div class="font-display" style="font-size:15px;font-weight:600;line-height:1.1;">Willis Plumbing</div>
        <div class="faint" style="font-size:11px;">Plumbing &amp; HVAC</div>
      </div>
    </div>

    <!-- top zone: Home + section buttons -->
    <nav style="padding:4px 12px;">
      <a class="nav-row" href="#" data-icon="home">Home</a>
      <button class="nav-row open" data-icon="megaphone">Marketing</button>
      <button class="nav-row" data-icon="trending">Sales</button>
      <button class="nav-row" data-icon="users">Customers</button>
      <button class="nav-row" data-icon="building">Operations</button>
    </nav>

    <!-- lower zone: the open section's (Marketing) pages -->
    <div style="padding:6px 12px;border-top:1px solid var(--divider);margin-top:6px;">
      <a class="nav-row" href="#" data-icon="megaphone">Paid Ads</a>
      <a class="nav-row" href="#" data-icon="star">Google Reviews</a>

      <!-- Email Campaigns: expandable group (expanded) -->
      <button class="nav-row open" data-icon="mail" style="justify-content:flex-start;">
        <span style="flex:1;text-align:left;">Email Campaigns</span>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.6;transform:rotate(180deg);"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="nav-children">
        <a class="nav-row active" href="#" data-page="overview" data-icon="layout">Overview</a>
        <a class="nav-row" href="#" data-page="ideas" data-icon="sparkles">Ideas</a>
        <a class="nav-row" href="#" data-page="calendar" data-icon="calendar">Calendar</a>
        <a class="nav-row" href="#" data-page="campaigns" data-icon="mail">Campaigns</a>
        <a class="nav-row" href="#" data-page="insights" data-icon="bar">What's working</a>
      </div>

      <a class="nav-row" href="#" data-icon="globe">Website</a>

      <!-- Social Media: expandable group (collapsed) -->
      <button class="nav-row" data-icon="share" style="justify-content:flex-start;">
        <span style="flex:1;text-align:left;">Social Media</span>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.6;"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button id="themeBtn" class="btn btn-ghost btn-sm" title="Toggle theme"></button>
      <span class="brandmark" style="width:30px;height:30px;font-size:11px;">JW</span>
    </div>
    <div class="container" id="page"></div>
  </main>
</div>

<script src="./data.js"></script>
<script>
function fillIcons(root){ (root||document).querySelectorAll('[data-icon]').forEach(el=>{ if(!el.dataset.done){ el.insertAdjacentHTML('afterbegin', window.icon(el.dataset.icon, el.dataset.isz?+el.dataset.isz:17)); el.dataset.done=1; }});}
function initSegmented(seg,onChange){const pill=seg.querySelector('.pill');const btns=[...seg.querySelectorAll('button')];function move(b){pill.style.left=b.offsetLeft+'px';pill.style.width=b.offsetWidth+'px';}btns.forEach(b=>b.addEventListener('click',()=>{btns.forEach(x=>x.classList.remove('active'));b.classList.add('active');move(b);onChange(b.dataset.track);}));requestAnimationFrame(()=>move(seg.querySelector('button.active')));}
function initTheme(){const b=document.getElementById('themeBtn');const set=t=>{document.documentElement.dataset.theme=t;b.innerHTML=window.icon('sun',16)+'<span style="margin-left:2px">'+(t==='dark'?'Light':'Dark')+'</span>';};b.onclick=()=>set(document.documentElement.dataset.theme==='dark'?'light':'dark');set('light');}

var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };

/* ---------- shared building blocks ---------- */
function trackToggleHTML(){
  return '<div class="segmented" id="trackToggle"><span class="pill"></span>' +
    '<button data-track="customers" class="' + (state.track==='customers'?'active':'') + '">Customers</button>' +
    '<button data-track="commercial" class="' + (state.track==='commercial'?'active':'') + '">Commercial Outreach</button></div>';
}
function pageTop(title, desc, actionsHTML, d){
  var commercial = state.track === 'commercial';
  var chip = '<span class="audience-chip' + (commercial?' commercial':'') + '">' +
    window.icon(commercial?'building':'users', 13) + '<span>' + esc(d.audienceChip) + '</span></span>';
  return '<div class="va-header"><div class="page-header">' +
      '<h2 class="page-title">' + esc(title) + '</h2>' +
      '<p class="page-desc">' + esc(desc) + '</p></div>' +
      (actionsHTML ? '<div class="va-header-actions">' + actionsHTML + '</div>' : '') +
    '</div>' +
    '<div class="va-filter">' + trackToggleHTML() +
      '<span class="va-audience">' + esc(d.audience) + '</span>' + chip +
    '</div>';
}
function newEmailBtn(){ return '<button class="btn btn-primary btn-sm" data-icon="plus" data-isz="16">New email</button>'; }
function rowGlyph(){ return '<span class="va-glyph">' + window.icon('mail', 15) + '</span>'; }
function kpiGrid(kpis){
  return '<div class="va-kpis">' + kpis.map(function(k){
    return '<div class="panel kpi"><div class="k-label">' + esc(k.label) + '</div>' +
      '<div class="k-value' + (k.brand?' brand':'') + '">' + esc(k.value) + '</div></div>';
  }).join('') + '</div>';
}

/* ---------- the 5 pages ---------- */
var PAGES = {
  overview: { render: function(d){
    var upNext = d.upNext.map(function(r){
      return '<div class="list-row">' + rowGlyph() +
        '<div class="va-row-main"><div class="va-row-title">' + esc(r.title) + '</div>' +
        '<div class="va-row-meta">' + esc(r.meta) + '</div></div>' +
        '<span class="badge tone-' + esc(r.tone) + '"><span class="dot"></span>' + esc(r.status) + '</span></div>';
    }).join('');
    var recent = d.recent.map(function(r){
      return '<div class="list-row">' + rowGlyph() +
        '<div class="va-row-main"><div class="va-row-title">' + esc(r.title) + '</div>' +
        '<div class="va-row-meta">' + esc(r.meta) + '</div></div>' +
        '<div class="va-row-right"><div class="va-metric">' + esc(r.metric) + '</div>' +
        '<div class="va-sub">' + esc(r.sub) + '</div></div></div>';
    }).join('');
    var ideas = d.ideas.map(function(i){
      return '<div class="va-idea accent-l"><div class="label-cap brand-text">' + esc(i.kind) + '</div>' +
        '<div class="va-idea-title">' + esc(i.title) + '</div>' +
        '<div class="va-idea-cta">Write it ' + window.icon('arrowsm', 14) + '</div></div>';
    }).join('');
    var c = d.callout;
    var callout = '<div class="va-callout' + (c.tone==='brand'?' tone-brand':'') + '">' +
      '<span class="va-callout-icon" style="color:var(--' + (c.tone==='brand'?'brand-text':'warning') + ')">' + window.icon('zap', 20) + '</span>' +
      '<div class="va-callout-text">' + esc(c.text) + ' <strong>' + esc(c.strong) + '</strong></div></div>';
    var lower = '<div class="va-lower"><div class="va-left">' +
      '<div class="panel"><div class="panel-header"><h3>Up next</h3>' +
        '<a class="see-all" href="#" data-goto="calendar">Calendar <span data-icon="arrowsm" data-isz="13"></span></a></div>' + upNext + '</div>' +
      '<div class="panel"><div class="panel-header"><h3>Recently sent</h3>' +
        '<a class="see-all" href="#" data-goto="insights">What\'s working <span data-icon="arrowsm" data-isz="13"></span></a></div>' + recent + '</div>' +
      '</div><div class="va-right">' +
      '<div class="panel"><div class="panel-header"><h3>Ideas for you</h3>' +
        '<a class="see-all" href="#" data-goto="ideas">See all</a></div><div class="va-ideas">' + ideas + '</div></div>' +
      callout + '</div></div>';
    return pageTop('Email Campaigns', "Your email at a glance. Here's what's going out, and what's working.",
      '<button class="btn btn-secondary btn-sm" data-icon="calendar" data-isz="16">Plan my month</button>' + newEmailBtn(), d) +
      kpiGrid(d.kpis) + lower;
  }},

  ideas: { render: function(d){
    var cards = d.ideasFull.map(function(i){
      return '<div class="va-idea-card accent-l">' +
        '<div class="label-cap brand-text">' + esc(i.kind) + '</div>' +
        '<div class="t">' + esc(i.title) + '</div>' +
        '<div class="why">' + esc(i.why) + '</div>' +
        '<div class="va-idea-cta">Write it ' + window.icon('arrowsm', 14) + '</div></div>';
    }).join('');
    return pageTop('Ideas', 'Emails worth sending, picked for you.', newEmailBtn(), d) +
      '<div class="va-grid2">' + cards + '</div>';
  }},

  calendar: { render: function(d){
    var cal = d.calendar;
    var byDom = {};
    cal.events.forEach(function(e){ (byDom[e.dom] = byDom[e.dom] || []).push(e); });
    var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var head = days.map(function(x){ return '<div class="label-cap" style="text-align:center;">' + x + '</div>'; }).join('');
    var lead = 1; // June 1, 2026 is a Monday -> one empty leading cell
    var cells = '';
    for (var i = 0; i < lead; i++) cells += '<div class="va-cal-cell va-cal-empty"></div>';
    for (var dom = 1; dom <= 30; dom++){
      var isToday = dom === 29;
      var evs = (byDom[dom] || []).map(function(e){
        return '<div class="badge tone-' + esc(e.tone) + ' va-cal-chip">' + esc(e.title) + ' · ' + esc(e.time) + '</div>';
      }).join('');
      cells += '<div class="va-cal-cell' + (isToday?' va-cal-today':'') + '">' +
        '<div class="va-cal-dom">' + dom + '</div>' + evs + '</div>';
    }
    var agenda = cal.events.map(function(e){
      return '<div class="list-row"><div class="va-row-main">' +
        '<div class="va-row-title">' + esc(e.title) + '</div>' +
        '<div class="va-row-meta">June ' + e.dom + ' · ' + esc(e.time) + '</div></div>' +
        '<span class="badge tone-' + esc(e.tone) + '"><span class="dot"></span>' + esc(e.status) + '</span></div>';
    }).join('');
    return pageTop('Calendar', "What's going out, and when.", newEmailBtn(), d) +
      '<div class="panel" style="padding:14px;">' +
        '<div style="font-family:var(--font-display);font-weight:600;font-size:15px;margin:2px 4px 12px;">' + esc(cal.month) + '</div>' +
        '<div class="va-cal-head">' + head + '</div>' +
        '<div class="va-cal-grid">' + cells + '</div></div>' +
      '<div class="panel" style="margin-top:16px;"><div class="panel-header"><h3>Agenda</h3></div>' + agenda + '</div>';
  }},

  campaigns: { render: function(d){
    var filt = state.campFilter || 'all';
    var chips = [['all','All'],['Scheduled','Scheduled'],['Sent','Sent']].map(function(p){
      return '<button class="va-chip' + (filt===p[0]?' on':'') + '" data-filter="' + p[0] + '">' + p[1] + '</button>';
    }).join('');
    var rows = d.campaigns.filter(function(c){ return filt === 'all' || c.status === filt; }).map(function(c){
      var right = c.status === 'Sent'
        ? '<div class="va-row-right"><div class="va-metric">' + esc(c.result) + '</div>' +
          '<div class="va-sub">' + esc(c.opened) + ' opened · ' + esc(c.sent) + ' sent</div></div>'
        : '<span class="badge tone-' + esc(c.tone) + '"><span class="dot"></span>' + esc(c.status) + '</span>';
      return '<div class="list-row">' + rowGlyph() +
        '<div class="va-row-main"><div class="va-row-title">' + esc(c.title) + '</div>' +
        '<div class="va-row-meta">' + esc(d.audienceWord) + ' · ' + esc(c.when) + '</div></div>' + right + '</div>';
    }).join('');
    if (!rows) rows = '<div style="padding:24px 16px;color:var(--text-faint);font-size:13px;">No campaigns here yet.</div>';
    return pageTop('Campaigns', "Every email you've sent.", newEmailBtn(), d) +
      '<div class="va-filter" style="margin-top:0;">' + chips + '</div>' +
      '<div class="panel"><div class="panel-header"><h3>All campaigns</h3></div>' + rows + '</div>';
  }},

  insights: { render: function(d){
    var ins = d.insights;
    var n = ins.topPerformers.length;
    var bars = ins.topPerformers.map(function(p, idx){
      var w = Math.round((n - idx) / n * 100);
      return '<div class="list-row va-bar-row">' +
        '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;">' +
          '<div class="va-row-title">' + esc(p.title) + '</div>' +
          '<div class="va-metric">' + esc(p.metric) + '</div></div>' +
        '<div class="va-row-meta">' + esc(p.sub) + '</div>' +
        '<div class="va-bar-track"><div class="va-bar-fill" style="width:' + w + '%;"></div></div></div>';
    }).join('');
    var callout = '<div class="va-callout tone-brand" style="margin-top:16px;">' +
      '<span class="va-callout-icon" style="color:var(--brand-text)">' + window.icon('zap', 20) + '</span>' +
      '<div class="va-callout-text">' + esc(ins.takeaway) + '</div></div>';
    return pageTop("What's working", 'Which emails turned into real work.', '', d) +
      kpiGrid(ins.summary) +
      '<div class="panel"><div class="panel-header"><h3>Top performers</h3></div>' + bars + '</div>' +
      callout;
  }}
};

/* ---------- router ---------- */
const state = { page: 'overview', track: 'customers', campFilter: 'all' };

function mount(){
  const d = window.EMAIL_DATA[state.track];
  document.getElementById('page').innerHTML = PAGES[state.page].render(d);
  document.querySelectorAll('[data-page]').forEach(a => a.classList.toggle('active', a.dataset.page === state.page));
  fillIcons(document);
  const seg = document.getElementById('trackToggle');
  if (seg) initSegmented(seg, t => { state.track = t; mount(); });
}
function go(p){ if (p !== state.page) state.campFilter = 'all'; state.page = p; mount(); }

// sidebar child links
document.querySelectorAll('[data-page]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); go(a.dataset.page); }));
// in-page navigation (see-all links) + campaign filter chips, via delegation on the stable host
document.getElementById('page').addEventListener('click', function(e){
  var g = e.target.closest('[data-goto]'); if (g){ e.preventDefault(); go(g.dataset.goto); return; }
  var f = e.target.closest('[data-filter]'); if (f){ e.preventDefault(); state.campFilter = f.dataset.filter; mount(); return; }
});

initTheme();
fillIcons(document);
mount();
</script>
</body></html>
