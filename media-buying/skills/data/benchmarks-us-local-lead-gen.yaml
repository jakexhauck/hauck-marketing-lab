# Benchmarks US - Local Service Lead-Gen (Meta Ads)
# Reference for analyzing performance of US-based home/local-service advertisers
# running Meta Ads for lead generation (calls, form fills, quote requests).
# Tuned for the kind of accounts Hauck Marketing actually runs — small-to-mid
# local businesses, $1k-$5k/mo budgets, single-state or single-metro targeting.
# Updated: 2026-05
title: US Local Service Lead-Gen

# KPI strip targets — these are the exact ranges the dashboard's KPI cards
# read for the "bench" sub-label. Keep these in sync with Kpis.tsx defaults.
kpi_strip:
  spend_cap: "of $2,500 cap"
  cpm_band: "bench $24–30"
  ctr_band: "bench 1.2–2.0"
  cvr_band: "bench 3–5%"
  cpa_band: "target $35"
  roas_band: "scale floor 2.0×"

meta_ads:
  # General metrics by objective — local lead-gen leans on "leads" and
  # "conversions" objectives; "traffic" is mostly diagnostic.
  by_objective:
    conversions:
      ctr:
        poor: "< 0.6%"
        acceptable: "0.6% - 1.2%"
        good: "1.2% - 2.0%"
        excellent: "> 2.0%"

      cpm:
        very_high: "> $45"
        high: "$30 - $45"
        normal: "$24 - $30"
        low: "< $24"

      cpc:
        high: "> $3.00"
        normal: "$1.50 - $3.00"
        good: "$0.80 - $1.50"
        excellent: "< $0.80"

    leads:
      cpl:
        high: "> $50"
        normal: "$25 - $50"
        good: "$12 - $25"
        excellent: "< $12"

      lp_conversion_rate:
        poor: "< 5%"
        acceptable: "5% - 10%"
        good: "10% - 18%"
        excellent: "> 18%"

      cpa:
        high: "> $70"
        normal: "$35 - $70"
        good: "$20 - $35"
        excellent: "< $20"
      cpa_target: "$35"

    traffic:
      cpc_link:
        high: "> $1.50"
        normal: "$0.60 - $1.50"
        good: "$0.30 - $0.60"
        excellent: "< $0.30"

  # Per local-service niche — average ranges seen in agency books across
  # similar US metros (population 100k-2M). Single-state, English audiences.
  by_niche:
    home_services:
      window_cleaning:
        cpl_expected: "$15 - $35"
        ctr_expected: "1.3% - 2.2%"
        booked_rate: "25% - 45%"     # of leads that become a quoted job
        avg_ticket: "$180 - $400"

      pressure_washing:
        cpl_expected: "$18 - $40"
        ctr_expected: "1.2% - 2.0%"
        booked_rate: "20% - 40%"
        avg_ticket: "$250 - $600"

      gutter_cleaning:
        cpl_expected: "$15 - $32"
        ctr_expected: "1.1% - 1.8%"
        booked_rate: "30% - 50%"
        avg_ticket: "$150 - $350"

      lawn_care:
        cpl_expected: "$12 - $30"
        ctr_expected: "1.2% - 2.0%"
        booked_rate: "20% - 35%"
        avg_ticket: "$80 - $250 / visit"

    contractors:
      roofing:
        cpl_expected: "$30 - $90"
        ctr_expected: "0.9% - 1.6%"
        booked_rate: "10% - 25%"
        avg_ticket: "$6,000 - $14,000"

      hvac:
        cpl_expected: "$25 - $70"
        ctr_expected: "1.0% - 1.7%"
        booked_rate: "20% - 40%"
        avg_ticket: "$300 - $9,000"

      plumbing:
        cpl_expected: "$20 - $55"
        ctr_expected: "1.1% - 1.8%"
        booked_rate: "30% - 55%"
        avg_ticket: "$200 - $1,200"

      remodeling:
        cpl_expected: "$50 - $150"
        ctr_expected: "0.8% - 1.4%"
        booked_rate: "5% - 15%"
        avg_ticket: "$15,000 - $60,000"

    professional_services:
      dental:
        cpl_expected: "$25 - $60"
        ctr_expected: "1.0% - 1.8%"
        booked_rate: "30% - 50%"

      legal:
        cpl_expected: "$40 - $120"
        ctr_expected: "0.9% - 1.6%"
        booked_rate: "15% - 30%"

      insurance:
        cpl_expected: "$15 - $45"
        ctr_expected: "1.0% - 1.7%"
        booked_rate: "10% - 25%"

  # By audience temperature — same logic as the brasil file; values shift
  # because local lead-gen rarely has rich retargeting pools.
  by_temperature:
    hot:           # past customers, form abandoners, recent site visitors
      cpa_relative: "0.4x - 0.7x average"
      roas_relative: "1.6x - 2.5x average"
      volume: "5% - 15% of total"
      ideal_frequency: "< 5"

    warm:          # engagers, video viewers, page fans
      cpa_relative: "0.7x - 1.1x average"
      roas_relative: "1.1x - 1.6x average"
      volume: "20% - 35% of total"
      ideal_frequency: "< 3"

    cold:          # geo-only, lookalikes, broad
      cpa_relative: "1.0x - 1.6x average"
      roas_relative: "0.7x - 1.1x average"
      volume: "50% - 75% of total"
      ideal_frequency: "< 2.5"

  # Fatigue indicators — the same patterns the diagnostic agents look for.
  fatigue:
    creative:
      signals:
        - "CTR dropping 25%+ over 7 days"
        - "Frequency above 3.0"
        - "CPM trending up without bid change"
      action: "Refresh hooks/thumbnails. Pause clearly fatigued ads."

    audience:
      signals:
        - "Frequency above 4.0"
        - "Reach plateaued for 5+ days"
        - "CPA climbing while CTR stable"
      action: "Expand geo radius, layer new lookalikes, or broaden interests."

  # US local lead-gen seasonality. Window cleaning and most outdoor home
  # services peak Apr-Sep; Q4 has high CPMs everywhere because of retail.
  seasonality:
    cost_peaks:    # CPM spikes
      - month: "November"
        reason: "Black Friday / Cyber Monday auction competition"
        expected_increase: "+25% to +60%"

      - month: "December"
        reason: "Holiday retail saturation"
        expected_increase: "+15% to +40%"

      - month: "May - August"
        reason: "Home-services peak demand; auction heats up"
        expected_increase: "+10% to +25%"

    low_season:    # CPM dips
      - month: "January"
        reason: "Post-holiday reset; retail pulls back"
        expected_decrease: "-15% to -25%"

      - month: "February"
        reason: "Slow ramp; tax-refund-anticipation buyers"
        expected_decrease: "-5% to -15%"

    demand_curves:
      window_cleaning:
        peak_months: ["April", "May", "June", "September", "October"]
        slow_months: ["December", "January", "February"]
        notes: "Spring-cleaning + pre-holiday windows drive double-peak demand."

      hvac:
        peak_months: ["June", "July", "August", "January"]
        slow_months: ["April", "May", "October"]
        notes: "Heat waves and cold snaps create emergency-call spikes."

      roofing:
        peak_months: ["March", "April", "September", "October"]
        slow_months: ["December", "January", "February"]
        notes: "Storm-damage windows boost demand outside normal peak."

# Pixel funnel — for local lead-gen the relevant events are Lead and
# (optionally) Schedule / Contact. AddToCart/Purchase rarely apply.
pixel_funnel:
  view_content:
    rate_of_click: "55% - 80%"
    problem_signs:
      - "< 45%: Slow LP load or pixel firing before render"
      - "< 25%: Pixel mis-installed (ad-blocker not the issue at this volume)"

  lead:
    rate_of_vc: "5% - 15%"
    problem_signs:
      - "< 3%: Form too long or offer not compelling"
      - "< 1%: Form broken or thank-you redirect missing"

  schedule:
    rate_of_lead: "20% - 50%"
    problem_signs:
      - "< 15%: Lead quality issue or follow-up cadence too slow"

# Optimization rules.
optimization_rules:
  when_to_pause:
    - criterion: "CPA > 2x target after 1,000 impressions"
      action: "Pause and investigate creative + LP."

    - criterion: "CTR < 0.4% after 500 impressions"
      action: "Pause and rewrite hook / swap thumbnail."

    - criterion: "0 leads after 2x daily budget spent"
      action: "Pause; audit pixel and form flow before relaunching."

  when_to_scale:
    - criterion: "CPA at or below target for 3 consecutive days"
      action: "Increase budget 20-30% per 48 hours."

    - criterion: "Stable CPA with growing reach"
      action: "Duplicate adset, broaden geo or add lookalike."

    - criterion: "Winner creative with 50+ leads"
      action: "Promote to CBO and seed two variants."

  when_to_optimize:
    - criterion: "CPA between 1x and 2x target"
      action: "Test new hooks; tighten audience if frequency >2.5."

    - criterion: "Good CTR but high CPA"
      action: "Check LP speed, form length, lead routing."

    - criterion: "Frequency rising but CPA still ok"
      action: "Expand audience before fatigue locks in."

# CAPI / EMQ references — same Meta standards apply regardless of geo.
capi:
  match_rate:
    excellent: "> 90%"
    good: "80% - 90%"
    acceptable: "60% - 80%"
    poor: "< 60%"

  event_match_quality:
    excellent: "> 8"
    good: "6 - 8"
    acceptable: "4 - 6"
    poor: "< 4"

  recommended_parameters:
    required:
      - "external_id (or fbp)"
      - "client_ip_address"
      - "client_user_agent"

    high_priority:
      - "em (hashed email)"
      - "ph (hashed phone)"
      - "fn (hashed first name)"

    medium_priority:
      - "ln (hashed last name)"
      - "ct (hashed city)"
      - "zp (hashed zip)"
      - "st (hashed state)"

# Diagnostic decision tree.
diagnostic:
  decision_tree:
    low_ctr:
      probable_cause: "Hook / creative not stopping the scroll"
      check:
        - "First 3 seconds of video or first line of static"
        - "Thumbnail readable on mobile"
        - "Ad copy lead — problem-first, not brand-first"
      solution: "Test 3-5 new hooks, vary format (UGC, before/after, founder talking head)."

    good_ctr_high_cpa:
      probable_cause: "Landing page or offer is the leak"
      check:
        - "LP conversion rate (target 10%+)"
        - "Page load time on 4G (< 3s)"
        - "Ad-to-LP message match"
        - "Form length — 4 fields max for cold traffic"
      solution: "Shorten form, sharpen offer, add social proof above the fold."

    high_cpm:
      probable_cause: "Audience saturated or competing in a hot auction"
      check:
        - "Frequency of the audience"
        - "Audience size vs. spend"
        - "Creative relevance / quality ranking"
      solution: "Expand geo radius, layer LAL, refresh creative."

    low_volume:
      probable_cause: "Budget or audience too tight"
      check:
        - "Daily budget vs. audience size (aim for 1% reach/day)"
        - "Bid caps active"
        - "Placement restrictions"
      solution: "Raise budget incrementally, open placements, broaden targeting."

    leads_not_closing:
      probable_cause: "Lead quality or follow-up cadence"
      check:
        - "Speed-to-lead (target < 5 minutes)"
        - "Form field used to qualify"
        - "Geo and service-area match"
      solution: "Add qualifying question to form, route leads to SMS auto-reply."

---
# Source: aggregated US local-service Meta Ads data 2024-2026.
# Note: Benchmarks are references, not promises. Individual accounts vary
# with seasonality, brand strength, and creative quality.
# Review: Refresh quarterly, especially after Meta auction changes.
