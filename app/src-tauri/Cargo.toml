[package]
name = "app"
version = "0.1.1"
description = "Hauck Marketing Lab — desktop assistant for media buying"
authors = ["Jake Hauck"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
which = "6"
regex = "1"
