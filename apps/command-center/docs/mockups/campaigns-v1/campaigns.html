<!doctype html><html lang="en" data-theme="light"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campaigns — Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   Campaigns mockup — faithful extract of the command-center "Console /
   Modern Motion" tokens + components, so this reads as a drop-in. SMS + email
   campaigns the client sends to their customers. Demo + not-connected states.
   ========================================================================= */
:root{
  --brand-fg:#fff; --bg:#f6f7fb; --surface:#fff; --surface-2:#f1f3f9; --surface-3:#e9ebf3; --rail:#fbfcfe;
  --text:#14161f; --text-muted:#555a6b; --text-faint:#8a90a3;
  --border:#e7e9f1; --border-strong:#d4d8e6; --divider:#f1f3f9;
  --brand:#4f46e5; --brand-2:#7c73f0; --brand-strong:#4338ca; --brand-text:#4f46e5;
  --brand-tint:color-mix(in srgb,var(--brand) 10%,transparent);
  --brand-tint-strong:color-mix(in srgb,var(--brand) 18%,transparent);
  --grad-brand:linear-gradient(135deg,#4f46e5 0%,#7c73f0 100%);
  --sms:#0ea5e9; --sms-tint:color-mix(in srgb,#0ea5e9 12%,transparent);
  --positive:#16a34a; --positive-tint:color-mix(in srgb,#16a34a 12%,transparent);
  --warning:#d97706; --warning-tint:color-mix(in srgb,#d97706 14%,transparent);
  --danger:#dc2626; --danger-tint:color-mix(in srgb,#dc2626 12%,transparent);
  --shadow-sm:0 1px 2px rgba(20,22,31,.04),0 1px 3px rgba(20,22,31,.05);
  --shadow-md:0 6px 18px rgba(40,42,70,.07),0 2px 6px rgba(40,42,70,.05);
  --shadow-lg:0 18px 40px rgba(40,42,70,.12),0 6px 14px rgba(40,42,70,.07);
  --shadow-brand:0 8px 22px rgba(79,70,229,.28);
  --ease:cubic-bezier(.22,1,.36,1);
  --font-display:"Poppins","Inter",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",monospace;
  --radius-sm:8px; --radius:10px; --radius-lg:14px;
}
[data-theme="dark"]{
  --bg:#0c0d14; --surface:#15161f; --surface-2:#1c1d28; --surface-3:#232536; --rail:#11121b;
  --text:#f4f4fb; --text-muted:#a8adc0; --text-faint:#6b7088;
  --border:#262837; --border-strong:#34374a; --divider:#20222e;
  --brand-text:color-mix(in srgb,var(--brand) 70%,white);
  --positive:#4ade80; --warning:#fbbf24; --danger:#f87171; --sms:#38bdf8;
  --shadow-brand:0 8px 22px rgba(79,70,229,.45);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-body);-webkit-font-smoothing:antialiased;color:var(--text);background-color:var(--bg);
  background-image:
    radial-gradient(60rem 40rem at 12% -8%,rgba(124,115,240,.16),transparent 60%),
    radial-gradient(50rem 38rem at 100% 0%,rgba(79,70,229,.12),transparent 55%),
    radial-gradient(46rem 36rem at 50% 120%,rgba(99,102,241,.1),transparent 60%);
  background-attachment:fixed;
}
[data-theme="dark"] body{background-image:
  radial-gradient(60rem 40rem at 12% -8%,rgba(124,115,240,.1),transparent 60%),
  radial-gradient(50rem 38rem at 100% 0%,rgba(79,70,229,.08),transparent 55%),
  radial-gradient(46rem 36rem at 50% 120%,rgba(99,102,241,.07),transparent 60%);}

.font-display{font-family:var(--font-display);letter-spacing:-.025em}
.font-data{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.label-cap{text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:10.5px;color:var(--text-muted)}
.muted{color:var(--text-muted)} .faint{color:var(--text-faint)} .brand-text{color:var(--brand-text)}

/* ---- shell ---- */
.glass{background:color-mix(in srgb,var(--surface) 62%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
.app{display:flex;min-height:100dvh}
.sidebar{width:244px;flex-shrink:0;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.5)}
[data-theme="dark"] .sidebar{border-right-color:rgba(255,255,255,.1)}
.brandmark{height:34px;width:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;background-image:var(--grad-brand);box-shadow:var(--shadow-brand)}
.nav-row{display:flex;align-items:center;gap:12px;width:100%;border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:500;color:var(--text-muted);background:none;border:none;cursor:pointer;text-decoration:none;transition:color .2s,background .2s,transform .2s;text-align:left;margin-bottom:2px}
.nav-row:hover{background:rgba(255,255,255,.6);color:var(--text);transform:translateX(2px)}
[data-theme="dark"] .nav-row:hover{background:rgba(255,255,255,.05)}
.nav-row.active{background-image:var(--grad-brand);color:#fff;box-shadow:var(--shadow-brand)}
.nav-row.open{background:rgba(255,255,255,.7);color:var(--brand-text)}
[data-theme="dark"] .nav-row.open{background:rgba(255,255,255,.06)}
.nav-row svg{width:17px;height:17px;flex-shrink:0;opacity:.8}
.nav-children{margin-left:22px;margin-top:2px;padding-left:10px;border-left:1px solid var(--divider);display:flex;flex-direction:column}
.nav-children .nav-row{font-size:13px;padding:8px 12px}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 22px;border-bottom:1px solid var(--border)}
.container{width:100%;max-width:72rem;margin:0 auto;flex:1 1 auto;padding:20px 32px 64px}

/* ---- page header ---- */
.page-header{margin-bottom:20px}
.page-title{font-family:var(--font-display);font-size:22px;line-height:1;color:var(--text);letter-spacing:-.025em;margin:0;font-weight:600}
.page-desc{margin:6px 0 0;font-size:14px;color:var(--text-muted)}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}

/* ---- panel ---- */
.panel{border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-sm)}
.panel-header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--divider);padding:12px 16px}
.panel-header h3{font-family:var(--font-display);font-size:15px;color:var(--text);margin:0;font-weight:600}
.see-all{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--brand-text);text-decoration:none;cursor:pointer}
.see-all:hover{text-decoration:underline}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-body);font-weight:500;white-space:nowrap;cursor:pointer;height:38px;padding:0 16px;font-size:14px;border-radius:var(--radius);border:1px solid transparent;transition:background-color .12s,transform .1s,filter .12s}
.btn:active{transform:scale(.97)} .btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand);color:var(--brand-fg);box-shadow:var(--shadow-sm)}
.btn-primary:hover{background:var(--brand-strong)}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-sm{height:32px;padding:0 12px;font-size:13px;border-radius:var(--radius-sm);gap:6px}
.btn-ghost{background:transparent;color:var(--text-muted);border-color:transparent}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn[disabled]:active{transform:none}

/* ---- badge / tones ---- */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600;letter-spacing:.01em}
.badge .dot{width:6px;height:6px;border-radius:999px;background:currentColor}
.tone-brand{background:var(--brand-tint);color:var(--brand-text)}
.tone-warning{background:var(--warning-tint);color:var(--warning)}
.tone-positive{background:var(--positive-tint);color:var(--positive)}
.tone-neutral{background:var(--surface-2);color:var(--text-muted)}
.tone-danger{background:var(--danger-tint);color:var(--danger)}
.tone-sms{background:var(--sms-tint);color:var(--sms)}

/* ---- channel chip (Email / SMS) ---- */
.chan{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px 2px 7px;font-size:11px;font-weight:600}
.chan svg{width:13px;height:13px}
.chan.email{background:var(--brand-tint);color:var(--brand-text)}
.chan.sms{background:var(--sms-tint);color:var(--sms)}

/* ---- kpi card ---- */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{padding:16px}
.kpi .k-label{font-size:13px;color:var(--text-muted)}
.kpi .k-value{margin-top:8px;font-family:var(--font-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}
.kpi .k-value.brand{color:var(--brand-text)}
.kpi .k-sub{margin-top:4px;font-size:11.5px;color:var(--text-faint)}

/* ---- list rows ---- */
.list-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--divider)}
.list-row:last-child{border-bottom:none}
.glyph{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.glyph.email{background:var(--brand-tint);color:var(--brand-text)}
.glyph.sms{background:var(--sms-tint);color:var(--sms)}
.row-main{flex:1 1 auto;min-width:0}
.row-title{font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:-.015em;color:var(--text);display:flex;align-items:center;gap:8px}
.row-meta{font-size:12.5px;color:var(--text-faint);margin-top:3px}
.row-right{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.metric{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--positive);font-variant-numeric:tabular-nums}
.sub{font-size:11px;color:var(--text-faint)}
.clickable{cursor:pointer;transition:background .15s}
.clickable:hover{background:var(--surface-2)}

.lower{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:980px){.lower{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}

/* ---- ideas / callout ---- */
.idea{border:1px solid var(--border);border-radius:var(--radius);padding:12px 12px 12px 16px;background:var(--surface);position:relative;transition:border-color .15s,transform .15s,box-shadow .15s}
.idea::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;border-radius:var(--radius) 0 0 var(--radius);background-image:var(--grad-brand)}
.idea:hover{border-color:var(--border-strong);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.idea-title{font-size:13.5px;font-weight:600;color:var(--text);margin-top:5px;line-height:1.35}
.idea-cta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--brand-text);margin-top:8px;cursor:pointer}
.idea-cta svg{width:14px;height:14px}
.callout{display:flex;align-items:flex-start;gap:12px;border-radius:var(--radius-lg);padding:16px;border:1px solid var(--brand);background:var(--brand-tint)}
.callout.warn{border-color:var(--warning);background:var(--warning-tint)}
.callout svg{width:20px;height:20px;flex-shrink:0}
.callout .txt{font-size:13.5px;line-height:1.45;color:var(--text)}

/* ---- chips / filters ---- */
.filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:999px;height:30px;padding:0 14px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:var(--font-body);transition:color .15s,background .15s,border-color .15s}
.chip:hover{color:var(--text);border-color:var(--border-strong)}
.chip.on{background:var(--brand-tint);border-color:var(--brand);color:var(--brand-text)}

/* ---- audiences / templates grids ---- */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:980px){.grid2,.grid3{grid-template-columns:1fr}}
.aud-card{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);padding:16px;box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s,border-color .15s;cursor:pointer}
.aud-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--border-strong)}
.aud-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.aud-num{font-family:var(--font-display);font-weight:800;letter-spacing:-.04em;font-size:30px;line-height:1;color:var(--text);margin-top:12px;font-variant-numeric:tabular-nums}
.aud-name{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--text)}
.aud-desc{font-size:13px;color:var(--text-muted);margin-top:6px;line-height:1.45}
.tpl-card{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);padding:0;box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column}
.tpl-body{padding:14px 16px;flex:1}
.tpl-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-top:1px solid var(--divider);background:var(--rail)}
.tpl-text{font-size:13px;color:var(--text-muted);line-height:1.5;margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ---- insights bars ---- */
.bar-track{margin-top:9px;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background-image:var(--grad-brand)}
.bar-fill.sms{background-image:linear-gradient(135deg,#0ea5e9,#38bdf8)}

/* ---- empty / not connected ---- */
.notice{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--warning);background:var(--warning-tint);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:18px}
.notice svg{width:20px;height:20px;color:var(--warning);flex-shrink:0;margin-top:1px}
.notice .t{font-size:13.5px;line-height:1.45;color:var(--text)}
.notice .t strong{font-weight:700}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 24px;color:var(--text-faint)}
.empty .ei{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--text-faint);margin-bottom:14px}
.empty h4{font-family:var(--font-display);font-size:16px;color:var(--text);margin:0 0 4px;font-weight:600}
.empty p{margin:0;font-size:13.5px;max-width:340px}

/* ---- dialog ---- */
.scrim{position:fixed;inset:0;background:rgba(15,16,28,.5);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:60;padding:24px}
.scrim.show{display:flex}
.dialog{width:100%;max-width:680px;max-height:88vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden}
.dialog.wide{max-width:760px}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--divider)}
.dlg-head h3{font-family:var(--font-display);font-size:17px;font-weight:600;margin:0}
.dlg-x{width:32px;height:32px;border-radius:8px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.dlg-x:hover{background:var(--surface-2);color:var(--text)}
.dlg-body{padding:20px;overflow-y:auto}
.dlg-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-top:1px solid var(--divider);background:var(--rail)}
.steps{display:flex;align-items:center;gap:6px}
.step{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text-faint)}
.step .n{width:20px;height:20px;border-radius:999px;background:var(--surface-2);color:var(--text-faint);display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.step.on .n{background-image:var(--grad-brand);color:#fff}
.step.on{color:var(--text)}
.step.done .n{background:var(--positive-tint);color:var(--positive)}
.step-sep{width:14px;height:1px;background:var(--border-strong)}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:6px}
.input,.textarea{width:100%;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:var(--font-body);font-size:14px;padding:10px 12px}
.input:focus,.textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
.textarea{resize:vertical;min-height:96px;line-height:1.5}
.pick{display:grid;gap:12px}
.pick.two{grid-template-columns:1fr 1fr}
.opt{border:1px solid var(--border-strong);border-radius:var(--radius-lg);padding:16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--brand-tint);box-shadow:0 0 0 1px var(--brand) inset}
.opt .oi{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt .ot{font-family:var(--font-display);font-weight:600;font-size:14.5px}
.opt .od{font-size:12.5px;color:var(--text-muted);margin-top:3px;line-height:1.4}
.opt .chk{margin-left:auto;color:var(--brand);opacity:0}
.opt.sel .chk{opacity:1}
.compose-grid{display:grid;grid-template-columns:1fr 240px;gap:18px}
@media (max-width:680px){.compose-grid{grid-template-columns:1fr}}
.charbar{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:11.5px;color:var(--text-faint)}
/* phone + email preview */
.preview-wrap{display:flex;flex-direction:column;gap:8px}
.preview-cap{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint)}
.phone{border:8px solid #1b1d29;border-radius:26px;background:#0c0d14;padding:10px 8px 14px;box-shadow:var(--shadow-md)}
.phone .pstatus{display:flex;justify-content:center;margin-bottom:8px}
.phone .pstatus span{width:46px;height:5px;border-radius:999px;background:#2a2c3a}
.bubble{background:#26283a;color:#fff;border-radius:14px 14px 14px 4px;padding:9px 11px;font-size:12.5px;line-height:1.45;max-width:88%}
.bubble .from{font-size:10px;color:#9aa0b8;margin-bottom:4px}
.email-prev{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.email-prev .ep-head{padding:10px 12px;border-bottom:1px solid var(--divider);background:var(--rail)}
.email-prev .ep-subj{font-family:var(--font-display);font-weight:600;font-size:13px}
.email-prev .ep-from{font-size:11px;color:var(--text-faint);margin-top:2px}
.email-prev .ep-body{padding:12px;font-size:12px;color:var(--text-muted);line-height:1.5}
.summary-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--divider);font-size:13px}
.summary-row:last-child{border-bottom:none}
.summary-row .sl{color:var(--text-muted)}
.summary-row .sv{font-weight:600;color:var(--text)}
.seg-row{display:flex;gap:10px;margin-bottom:16px}
.seg-row label{flex:1;border:1px solid var(--border-strong);border-radius:var(--radius);padding:12px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;transition:border-color .15s,background .15s}
.seg-row input{accent-color:var(--brand)}
.seg-row label:has(input:checked){border-color:var(--brand);background:var(--brand-tint)}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;transition:.25s var(--ease);z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* report detail */
.report-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
@media (max-width:680px){.report-kpis{grid-template-columns:repeat(2,1fr)}}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;margin-bottom:14px;background:none;border:none;padding:0}
.back:hover{color:var(--text)}

/* ============================ small builders ============================ */
const chanChip=ch=>'<span class="chan '+ch+'">'+icon(ch==='sms'?'msg':'mail',13)+(ch==='sms'?'SMS':'Email')+'</span>';
const rowGlyph=ch=>'<span class="glyph '+ch+'">'+icon(ch==='sms'?'msg':'mail',16)+'</span>';
function kpiGrid(kpis){return '<div class="kpis">'+kpis.map(k=>'<div class="panel kpi"><div class="k-label">'+esc(k.label)+'</div><div class="k-value'+(k.brand?' brand':'')+'">'+esc(k.value)+'</div>'+(k.sub?'<div class="k-sub">'+esc(k.sub)+'</div>':'')+'</div>').join('')+'</div>';}
function pageTop(title,desc,actions){return '<div class="head"><div class="page-header"><h2 class="page-title">'+esc(title)+'</h2><p class="page-desc">'+esc(desc)+'</p></div>'+(actions?'<div class="head-actions">'+actions+'</div>':'')+'</div>';}
const newBtn='<button class="btn btn-primary btn-sm" data-icon="plus" data-isz="16" data-new>New campaign</button>';
function notice(){return '<div class="notice">'+icon('plug',20)+'<div class="t"><strong>Your messaging isn\'t connected yet.</strong> Once we link your customer list and texting/email number, your campaigns, audiences and results show up here. Sending stays switched off until then.</div></div>';}
function emptyState(ico,h,p){return '<div class="panel"><div class="empty"><span class="ei">'+icon(ico,22)+'</span><h4>'+esc(h)+'</h4><p>'+esc(p)+'</p></div></div>';}

/* ============================ pages ============================ */
const PAGES={
overview(empty){

campaigns(empty){
  if(empty) return pageTop('Campaigns',"Every text and email you've sent.",newBtn)+notice()+emptyState('send','No campaigns yet',"Create your first campaign and it'll show up here with delivery and results once it sends.");
  const filt=state.filt||'all';
  const chips=[['all','All'],['Scheduled','Scheduled'],['Draft','Drafts'],['Sent','Sent']].map(p=>'<button class="chip'+(filt===p[0]?' on':'')+'" data-filter="'+p[0]+'">'+p[1]+'</button>').join('');
  const rows=DATA.campaigns.map((c,i)=>({c,i})).filter(({c})=>filt==='all'||c.status===filt).map(({c,i})=>{
    const right=c.status==='Sent'
      ?'<div class="row-right"><div class="metric">'+esc(c.result)+'</div><div class="sub">'+esc(c.rate)+' · '+esc(c.sent)+' sent</div></div>'
      :'<span class="badge tone-'+c.tone+'"><span class="dot"></span>'+esc(c.status)+'</span>';
    const clk=c.status==='Sent'?' clickable" data-report="r'+i:'';
    return '<div class="list-row'+clk+'">'+rowGlyph(c.ch)+'<div class="row-main"><div class="row-title">'+esc(c.title)+' '+chanChip(c.ch)+'</div><div class="row-meta">'+esc(c.aud)+' · '+esc(c.when)+'</div></div>'+right+'</div>';
  }).join('')||'<div style="padding:24px 16px;color:var(--text-faint);font-size:13px;">No campaigns here yet.</div>';
  return pageTop('Campaigns',"Every text and email you've sent.",newBtn)+
    '<div class="filter">'+chips+'</div>'+
    '<div class="panel"><div class="panel-header"><h3>All campaigns</h3></div>'+rows+'</div>';
},

audiences(empty){

insights(empty){

  const callout='<div class="callout" style="margin-top:16px;">'+icon('zap',20)+'<div class="txt">'+esc(DATA.insights.takeaway)+'</div></div>';
  return pageTop("What's working","Which messages turned into real, booked work.","")+
    kpiGrid(DATA.insights.summary)+
    '<div class="panel"><div class="panel-header"><h3>Top campaigns</h3></div>'+bars+'</div>'+callout;
},

/* report drilldown (rendered into the page, with a back button) */
report(idx){
  let c;
  if(typeof idx==='string'&&idx[0]==='r') c=DATA.campaigns[+idx.slice(1)];
  else c=DATA.recent[+idx]&&DATA.campaigns.find(x=>x.title===DATA.recent[+idx].title);
  c=c||DATA.campaigns[3];
  const rep=[
    {label:"Delivered",value:c.sent||"1,380"},
    {label:c.ch==='sms'?"Replies":"Opened",value:c.ch==='sms'?"31":"43%"},
    {label:"Link clicks",value:c.ch==='sms'?"54":"96"},
    {label:"Jobs booked",value:(c.result||"7 jobs").replace(' jobs',''),brand:true},
  ];
  const preview=c.ch==='sms'
    ?'<div class="phone"><div class="pstatus"><span></span></div><div class="bubble"><div class="from">Willis Plumbing</div>Hi Mark, beat the summer rush, book your AC tune-up and we\'ll keep it running cool all season. Reply YES for times.</div></div>'
    :'<div class="email-prev"><div class="ep-head"><div class="ep-subj">'+esc(c.title)+'</div><div class="ep-from">Willis Plumbing &lt;hello@willisplumbing.com&gt;</div></div><div class="ep-body">Hi {{first}}, a quick, clean fix before a small clog becomes a weekend emergency. $25 off drain cleaning this month, book online in under a minute.</div></div>';
  return '<button class="back" data-goto="campaigns">'+icon('back',15)+'Back to campaigns</button>'+
    pageTop(c.title,esc(c.aud)+' · '+esc(c.when),chanChip(c.ch))+
    '<div class="report-kpis">'+rep.map(k=>'<div class="panel kpi"><div class="k-label">'+esc(k.label)+'</div><div class="k-value'+(k.brand?' brand':'')+'">'+esc(k.value)+'</div></div>').join('')+'</div>'+
    '<div class="lower"><div class="col"><div class="panel"><div class="panel-header"><h3>Timeline</h3></div>'+
      ['Delivered to '+(c.sent||'1,380')+' customers','First open within 4 minutes','Peak opens 9–11 AM','14 link clicks in the first hour'].map(t=>'<div class="list-row">'+icon('check',16)+'<div class="row-main"><div class="row-title" style="font-size:13px;font-weight:500;">'+esc(t)+'</div></div></div>').join('')+
    '</div></div><div class="col"><div class="preview-wrap"><div class="preview-cap">What customers saw</div>'+preview+'</div></div></div>';
},
};

/* ============================ wizard (New campaign) ============================ */
const wiz={step:1,ch:null,aud:0,when:'now'};
const WIZ_AUD=DATA.audiences;
function openWiz(){wiz.step=1;wiz.ch=null;wiz.aud=0;wiz.when='now';renderWiz();show('wizard');}
function renderWiz(){
  const steps=['Channel','Audience','Compose','Schedule'];
  const head=steps.map((s,i)=>{const n=i+1;const cls=wiz.step===n?'on':(wiz.step>n?'done':'');return '<div class="step '+cls+'"><span class="n">'+(wiz.step>n?icon('check',12):n)+'</span>'+s+'</div>';}).join('<span class="step-sep"></span>');
  let body='';
  if(wiz.step===1){
    body='<div class="field"><label>How do you want to reach them?</label><div class="pick two">'+
      '<div class="opt'+(wiz.ch==='sms'?' sel':'')+'" data-ch="sms"><span class="oi" style="background:var(--sms-tint);color:var(--sms)">'+icon('msg',18)+'</span><div><div class="ot">Text message</div><div class="od">Lands instantly, best reply rate. Great for reminders and time-sensitive offers.</div></div><span class="chk">'+icon('check',18)+'</span></div>'+
      '<div class="opt'+(wiz.ch==='email'?' sel':'')+'" data-ch="email"><span class="oi" style="background:var(--brand-tint);color:var(--brand-text)">'+icon('mail',18)+'</span><div><div class="ot">Email</div><div class="od">Room for detail and images. Best for newsletters, specials and longer updates.</div></div><span class="chk">'+icon('check',18)+'</span></div>'+
    '</div></div>';
  } else if(wiz.step===2){
    body='<div class="field"><label>Who should get this?</label><div class="pick">'+WIZ_AUD.map((a,i)=>'<div class="opt'+(wiz.aud===i?' sel':'')+'" data-aud="'+i+'"><span class="oi" style="background:var(--brand-tint);color:var(--brand-text)">'+icon('users',16)+'</span><div><div class="ot">'+esc(a.name)+' <span class="faint" style="font-weight:500;">· '+esc(a.count)+'</span></div><div class="od">'+esc(a.desc)+'</div></div><span class="chk">'+icon('check',18)+'</span></div>').join('')+'</div></div>';
  } else if(wiz.step===3){
    const sms=wiz.ch==='sms';
    body='<div class="compose-grid"><div>'+
      '<div style="display:flex;justify-content:flex-end;margin-bottom:10px;"><button class="btn btn-secondary btn-sm" data-icon="sparkles" data-isz="15" data-ai>Write it for me</button></div>'+
      (sms?'':'<div class="field"><label>Subject line</label><input class="input" id="f-subj" placeholder="e.g. $25 off drain cleaning this month" value="$25 off drain cleaning this month"></div>')+
      '<div class="field"><label>Message</label><textarea class="textarea" id="f-body" '+(sms?'maxlength="320"':'')+'>'+(sms?"Hi {{first}}, it's Willis Plumbing. Beat the summer rush, book your AC tune-up and we'll keep it cool all season. Reply YES for times.":"Hi {{first}}, a quick, clean fix before a small clog becomes a weekend emergency. $25 off drain cleaning this month, book online in under a minute.")+'</textarea>'+
        (sms?'<div class="charbar"><span id="charc">0 characters</span><span id="segc">1 text per recipient</span></div>':'<div class="charbar"><span>{{first}} fills in each customer\'s name.</span><a class="see-all" data-tpl>Use a template</a></div>')+
      '</div></div>'+
      '<div class="preview-wrap"><div class="preview-cap">Live preview</div><div id="prev"></div></div>'+
    '</div>';
  } else {
    const a=WIZ_AUD[wiz.aud];
    body='<div class="field"><label>When should it go out?</label><div class="seg-row">'+
      '<label><input type="radio" name="when" value="now" '+(wiz.when==='now'?'checked':'')+'> Send now</label>'+
      '<label><input type="radio" name="when" value="later" '+(wiz.when==='later'?'checked':'')+'> Schedule</label></div>'+
      (wiz.when==='later'?'<div class="field" style="display:flex;gap:10px;"><input class="input" type="date" value="2026-07-03"><input class="input" type="time" value="09:00"></div>':'')+
      '<div class="panel" style="margin-top:6px;"><div class="panel-header"><h3>Review</h3></div><div style="padding:6px 16px 12px;">'+
        '<div class="summary-row"><span class="sl">Channel</span><span class="sv">'+(wiz.ch==='sms'?'Text message':'Email')+'</span></div>'+
        '<div class="summary-row"><span class="sl">Audience</span><span class="sv">'+esc(a.name)+' ('+esc(a.count)+')</span></div>'+
        '<div class="summary-row"><span class="sl">Goes to</span><span class="sv">'+esc(a.count)+(wiz.ch==='sms'?' text messages':' inboxes')+'</span></div>'+
        '<div class="summary-row"><span class="sl">Sends</span><span class="sv">'+(wiz.when==='now'?'Right away':'Jul 3, 9:00 AM')+'</span></div>'+
      '</div></div>';
  }
  document.getElementById('wizBody').innerHTML='<div class="steps" style="margin-bottom:20px;">'+head+'</div>'+body;
  // footer
  const canNext=(wiz.step===1&&wiz.ch)||(wiz.step===2)||(wiz.step===3)||(wiz.step===4);
  const back=wiz.step>1?'<button class="btn btn-secondary btn-sm" data-wback>Back</button>':'<span></span>';
  const next=wiz.step<4
    ?'<button class="btn btn-primary btn-sm" data-wnext '+(canNext?'':'disabled')+'>Continue</button>'
    :'<button class="btn btn-primary btn-sm" data-icon="send2" data-isz="15" disabled title="Connect your account to send">Send campaign</button>';
  const note=wiz.step===4?'<span class="faint" style="font-size:12px;display:flex;align-items:center;gap:6px;">'+icon('plug',14)+'Sending turns on once your account is connected.</span>':'<span></span>';
  document.getElementById('wizFoot').innerHTML='<div>'+back+'</div><div style="display:flex;align-items:center;gap:14px;">'+note+next+'</div>';
  fillIcons(document.getElementById('wizard'));
  if(wiz.step===3) updatePreview();
}
function updatePreview(){
  const sms=wiz.ch==='sms';
  const body=(document.getElementById('f-body')||{}).value||'';
  const subj=(document.getElementById('f-subj')||{}).value||'';
  const filled=body.replace(/{{first}}/g,'Mark');
  const prev=document.getElementById('prev');
  if(!prev) return;
  if(sms){
    prev.innerHTML='<div class="phone"><div class="pstatus"><span></span></div><div class="bubble"><div class="from">Willis Plumbing</div>'+esc(filled)+'</div></div>';
    const c=document.getElementById('charc'),s=document.getElementById('segc');
    if(c) c.textContent=body.length+' characters';
    if(s) s.textContent=(Math.max(1,Math.ceil(body.length/160)))+' text'+(Math.ceil(body.length/160)>1?'s':'')+' per recipient';
  } else {
    prev.innerHTML='<div class="email-prev"><div class="ep-head"><div class="ep-subj">'+esc(subj||'(no subject)')+'</div><div class="ep-from">Willis Plumbing</div></div><div class="ep-body">'+esc(filled)+'</div></div>';
  }
}

/* ============================ audience detail dialog ============================ */
function openAud(i){
  const a=DATA.audiences[i];
  document.getElementById('audTitle').textContent=a.name+' · '+a.count;
  document.getElementById('audBody').innerHTML=
    '<div style="padding:14px 16px;border-bottom:1px solid var(--divider);"><div class="muted" style="font-size:13px;line-height:1.5;">'+esc(a.desc)+'</div><div style="margin-top:12px;display:flex;gap:8px;"><button class="btn btn-primary btn-sm" data-icon="plus" data-isz="15" data-new>Send to this list</button></div></div>'+
    '<div class="panel-header" style="border-bottom:none;padding-top:14px;"><h3 style="font-size:13px;">Sample of who\'s in this list</h3></div>'+
    DATA.audienceMembers.map(m=>'<div class="contact-row"><span class="avatar">'+esc(m.init)+'</span><div class="row-main"><div class="row-title" style="font-size:13.5px;">'+esc(m.name)+'</div><div class="row-meta">'+esc(m.sub)+'</div></div></div>').join('')+
    '<div style="padding:12px 16px;text-align:center;font-size:12px;color:var(--text-faint);">Showing 6 of '+a.count+'</div>';
  show('audDlg');
}

/* ============================ router + wiring ============================ */
const state={page:'overview',filt:'all',mode:'demo'};
function render(){
  const empty=state.mode==='empty';
  let html;
  if(state.page==='report') html=PAGES.report(state.reportId);
  else html=PAGES[state.page](empty);
  document.getElementById('page').innerHTML=html;
  document.querySelectorAll('[data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===state.page));
  fillIcons(document);
}
function go(p){if(p!==state.page)state.filt='all';state.page=p;render();window.scrollTo(0,0);}
function show(id){document.getElementById(id).classList.add('show');}
function hide(id){document.getElementById(id).classList.remove('show');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}

// sidebar nav
document.querySelectorAll('[data-page]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();go(a.dataset.page);}));
// mode toggle
document.getElementById('modeToggle').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;state.mode=b.dataset.mode;[...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));render();});
// theme
(function(){const b=document.getElementById('themeBtn');const set=t=>{document.documentElement.dataset.theme=t;b.innerHTML=icon('sun',16)+'<span style="margin-left:2px">'+(t==='dark'?'Light':'Dark')+'</span>';};b.onclick=()=>set(document.documentElement.dataset.theme==='dark'?'light':'dark');set('light');})();

// delegated page clicks
document.getElementById('page').addEventListener('click',e=>{
  const g=e.target.closest('[data-goto]'); if(g){go(g.dataset.goto);return;}
  const f=e.target.closest('[data-filter]'); if(f){state.filt=f.dataset.filter;render();return;}
  const n=e.target.closest('[data-new]'); if(n){openWiz();return;}
  const r=e.target.closest('[data-report]'); if(r){state.reportId=r.dataset.report;go('report');return;}
  const a=e.target.closest('[data-aud]'); if(a){openAud(+a.dataset.aud);return;}
  const t=e.target.closest('[data-toast]'); if(t){toast(t.dataset.toast);return;}
});

// dialogs: close + wizard interactions
document.addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){hide('wizard');hide('audDlg');return;}
  if(e.target.classList&&e.target.classList.contains('scrim')){e.target.classList.remove('show');return;}
  const ch=e.target.closest('[data-ch]'); if(ch){wiz.ch=ch.dataset.ch;renderWiz();return;}
  const au=e.target.closest('#wizBody [data-aud]'); if(au){wiz.aud=+au.dataset.aud;renderWiz();return;}
  if(e.target.closest('[data-wnext]')){wiz.step=Math.min(4,wiz.step+1);renderWiz();return;}
  if(e.target.closest('[data-wback]')){wiz.step=Math.max(1,wiz.step-1);renderWiz();return;}
  if(e.target.closest('[data-ai]')){toast("Drafted with AI from your business + this audience.");return;}
  if(e.target.closest('[data-tpl]')){go('templates');hide('wizard');return;}
});
document.addEventListener('input',e=>{if(e.target.id==='f-body'||e.target.id==='f-subj')updatePreview();});
document.addEventListener('change',e=>{if(e.target.name==='when'){wiz.when=e.target.value;renderWiz();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hide('wizard');hide('audDlg');}});

fillIcons(document);
render();
</script>
</body></html>
