<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hauck Pre-Call Step 1 - The Contractor Growth Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* ===========================================================================
   PRE-CALL STEP 1 - THE DECK
   Built to Will's format (tradecraftdemand.com/thankyou, Step 1 video), which
   Jake asked for almost exactly. What that format is, having watched it:

     8 slides. Everything centred. Near-black ground.
     Small accent-coloured mono eyebrow, uppercase, wide tracking.
     A two-line headline: line one WHITE, line two ACCENT.
     A grey sub of one or two lines.
     Then ONE of three bodies:
       a) a stack of rows with an icon and a right-hand pill  (slide 2)
       b) a stack of rows with an emoji tile and a grey line   (slide 3)
       c) a single rounded card: a pill label, then 3-4 bullets (slides 4-7)
     Close slide: check pills in a row, then a solid accent button.

   His running order is: full picture / never again / one connected system /
   step 1 / step 2 / step 3 / step 4 / bottom line. This deck keeps that
   order beat for beat.

   TWO DELIBERATE DEPARTURES, both on Jake's instruction:
     - No webcam bubble. Will has one bottom-right; Jake said cut it. The
       content is centred and clears that corner anyway, so a bubble can be
       dropped back on in the editor with nothing colliding.
     - The accent is the brand green, not Will's royal blue. It is ONE token,
       --acc below. Swap that single value to #3B6FF5 for Will's blue.

   The words are Jake's own, off his live site. Will's copy sells a different
   offer (AI creatives, covered ad spend, pay-per-lead) and putting his lines
   on these slides would put claims on screen that Jake's business does not
   make. The shapes are his; the sentences are Jake's.

   DRIVE IT: Space or Right advances a beat. Left goes back. Home resets.
   Up/Down jump a whole slide. G shows the progress hairline (off by default,
   so the recorded frame is clean). F is fullscreen. Record at 1920x1080.
   =========================================================================== */
window.DECK = [

  { kind:"title",
    eyebrow:"The full picture",
    h1:"What's Included In",
    h2:"The Contractor Growth Engine"
  },

  { kind:"rows",
    eyebrow:"The outcome",
    h1:"Things You'll",
    h2:"Never Do Again",
    rows:[
      { t:"Film a video, or hire a videographer",        pill:"We handle it" },
      { t:"Write ads, or think about ads at all",        pill:"We build them" },
      { t:"Sit with somebody who was never going to buy", pill:"Filtered out" },
      { t:"Chase a lead by hand, or forget to",          pill:"We chase them" },
      { t:"Guess which ads actually paid for themselves", pill:"You'll see it" }
    ]
  },

  { kind:"system",
    eyebrow:"One connected system",
    h1:"Every Part Works",
    h2:"Together",
    rows:[
      { icon:"&#127919;", t:"Targeting",             d:"We optimise for <b>booked estimates</b>, not tire kicker leads" },
      { icon:"&#127916;", t:"Creative",              d:"Custom branded ads, <b>researched to work in your local market</b>" },
      { icon:"&#128226;", t:"Ads Running",           d:"Optimised 24/7 based off <b>jobs that have been won</b>" },
      { icon:"&#128172;", t:"Automatic Follow Up",   d:"Personalised follow ups, sent <b>the moment the lead comes in</b>" },
      { icon:"&#9889;",   t:"Speed To Lead",         d:"Every single lead that comes in, <b>called within five minutes</b>" },
      { icon:"&#128197;", t:"Booked Estimate",       d:"A time and a date <b>on your calendar</b>" },
      { icon:"&#128202;", t:"Automatic Reporting",   d:"One click, and <b>everything is tracked properly</b>" }
    ]
  },

  { kind:"step",
    eyebrow:"Step 1",
    h1:"Your Ads Reach Homeowners",
    h2:"Who Are Ready To Spend",
    pill:"Traffic",
    bullets:[
      "We optimise for booked estimates, not form fills. Over time that trains Meta's data set to put your ads in front of more people who actually book",
      "Placed in front of real homeowners inside your target market. Not fifteen year olds who are never going to need the work. People with genuine intent",
      "We build creatives from scratch and test them against what is already proven in your market, and we keep testing until we find real winners worth scaling",
      "The point of all of it is to conquer your local market, until you are the name every homeowner in your area calls first"
    ]
  },

  { kind:"step",
    eyebrow:"Step 2",
    h1:"The First Five Minutes",
    h2:"Decide Who Gets The Job",
    pill:"Conversion",
    bullets:[
      "Automatic follow ups start the second the lead comes in, and keep running across a seven day window",
      "Speed to lead dialling. Our team calls, qualifies and books them onto an estimate inside five minutes of them coming in from the ad",
      "The follow up is personalised, not a generic drip. Seven days of it, and anyone who still has not replied goes into a long term nurture sequence",
      "Once the estimate is booked we send them assets that pre sell you, so the job is easier to close by the time you turn up"
    ]
  },

  { kind:"step",
    eyebrow:"Step 3",
    h1:"You Can See Everything",
    h2:"In Your Own Software",
    pill:"Reporting",
    bullets:[
      "Custom software with full transparency on every single ad. What it is spending, how it is performing, and which ads are actually producing jobs",
      "Every lead is tracked inside the software, so you can see exactly where each one sits in your pipeline",
      "Once an estimate is done you tap two buttons to log what happened. That is the whole job. No going back and forth with me to find out how the month went"
    ]
  },

  { kind:"step",
    eyebrow:"Step 4",
    h1:"Every Outcome You Log",
    h2:"Makes Next Month Cheaper",
    pill:"The loop closes",
    bullets:[
      "Over time the budget moves toward the ads producing won jobs and away from the tire kickers, so the whole thing compounds",
      "Leads are not hard to generate. High quality leads are. We judge our ads on the ones that produce jobs, never the ones that produce enquiries",
      "That is how we keep generating results for you, because we know exactly which ads are bringing in real work"
    ]
  },

  /* Jake's screenshot, rebuilt. The inversion is the whole trick and it is
     worth not "fixing": the SHORT list is the loud one (accent header, white
     bold items) and the long list is deliberately quiet grey. The eye reads
     four bright lines against nine dim ones and draws the conclusion before
     anybody says a word.

     Two of Will's lines are not on here, on purpose:
       - "Cover the entire ad spend" -> cut on Jake's instruction. He doesn't.
       - "Call the lead when it comes in" -> that is on Will's YOU side, but
         Jake's Step 2 just promised his team dials in five minutes. Leaving
         it would have the deck contradict itself two slides apart, so it
         moved across to the US side where it belongs.
     "AI ad creative" also became plain "ad creative": Jake's Step 1 says
     built from scratch and tested, which is a different claim. */
  { kind:"close",
    eyebrow:"The division of labour",
    h1:"You vs",
    h2:"Us",
    cols:[
      { t:"You", sub:"Your side of the deal", icon:"&#129309;", tone:"you", items:[
        "Fill in the onboarding form",
        "Show up to two short calls",
        "Show up to the estimate",
        "Close the job",
        "Tap two buttons to log the outcome"
      ]},
      { t:"Us", sub:"Everything else", icon:"&#9889;", tone:"we", items:[
        "Market research and competitor analysis",
        "Ad creative, images, videos and copy",
        "Ad targeting and campaign management",
        "Lead qualification and filtering",
        "Speed to lead calling inside five minutes",
        "Booking and calendar management",
        "Pre-appointment nurture sequences",
        "Seven day follow up on every lead",
        "Ongoing optimisation and reporting"
      ]}
    ],
    cta:"See you on the call"
  }
];
</script>
<style>
/* ---------------------------------------------------------------------------
   TOKENS
   --acc is the single accent. Every eyebrow, second headline line, pill,
   bullet dot, highlight and the CTA read from it. Change this one value to
   restyle the whole deck (Will's blue is #3B6FF5).
   --------------------------------------------------------------------------- */
:root{
  --acc:#4DBB83;
  --acc-soft:rgba(77,187,131,.16);
  --acc-line:rgba(77,187,131,.34);

  --bg:#0E1113;             /* Will's ground is near-black, not brand-dark */
  --card:#14181A;
  --card-2:#171C1E;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.11);

  --text:#FFFFFF;
  --muted:#98A2A8;
  --faint:#6B7780;
  --red:#E2603A;

  --ease:cubic-bezier(.22,.61,.36,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}

/* Fixed 1920x1080 canvas scaled to whatever window it opens in, so what you
   record is pixel-identical to what you designed. */
#stage{
  position:relative;width:1920px;height:1080px;flex:none;
  transform-origin:center center;
  background:
    radial-gradient(1100px 620px at 50% 22%, rgba(77,187,131,.05), transparent 70%),
    var(--bg);
  overflow:hidden;
}

/* --- slides ---------------------------------------------------------------- */
.slide{
  position:absolute;inset:0;
  padding:96px 150px;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
}
.slide.on{display:flex}

.eyebrow{
  font-size:20px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;
  color:var(--acc);
}

/* The two-line headline is the signature of this format: line one white,
   line two accent, both the same weight and size. */
.head{margin-top:26px;font-family:'Poppins',system-ui,sans-serif;font-weight:700;
      font-size:84px;line-height:1.12;letter-spacing:-.035em;max-width:24ch}
.head .l2{color:var(--acc);display:block}

.sub{margin-top:24px;font-size:27px;line-height:1.5;color:var(--muted);
     white-space:pre-line;max-width:52ch}

/* --- body a: the never-again rows ------------------------------------------ */
.rows{margin-top:54px;width:1120px;display:flex;flex-direction:column;gap:15px}
.rrow{
  display:flex;align-items:center;gap:22px;
  background:var(--card);border:1px solid var(--line);
  border-left:3px solid var(--acc);
  border-radius:12px;padding:22px 26px;text-align:left;
}
.rrow .x{flex:none;width:26px;height:26px;color:var(--red)}
.rrow .t{font-size:26px;font-weight:500}
.rrow .pill{
  margin-left:auto;flex:none;
  background:var(--acc-soft);border:1px solid var(--acc-line);border-radius:999px;
  padding:8px 18px;font-size:17px;font-weight:600;color:var(--acc);white-space:nowrap;
}

/* --- body b: the connected-system rows ------------------------------------- */
/* Seven rows plus a two-line headline makes this by far the tallest slide in
   the deck. It steps its own type down rather than shrinking the other seven
   slides to match it. Measured, not guessed: at these sizes the stack lands
   about 60px clear of the bottom edge. */
#sl-2 .head{font-size:66px;margin-top:18px}
#sl-2 .srows{margin-top:34px}

.srows{width:1220px;display:flex;flex-direction:column;gap:9px}
.srow{display:flex;align-items:center;gap:16px;text-align:left}
.srow .tile{
  flex:none;width:52px;height:52px;border-radius:12px;
  background:var(--card-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:24px;line-height:1;
}
.srow .body{
  flex:1;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:13px 22px;
}
.srow .t{font-size:21px;font-weight:600;letter-spacing:-.01em}
.srow .d{margin-top:3px;font-size:18px;color:var(--muted);line-height:1.4}
.srow .d b{color:var(--acc);font-weight:500}

/* --- body c: the step card -------------------------------------------------- */
.card{
  margin-top:48px;width:1180px;
  background:var(--card);border:1px solid var(--line-2);
  border-radius:20px;padding:44px 52px 48px;text-align:left;
}
.card .label{
  display:inline-block;
  background:var(--acc-soft);border:1px solid var(--acc-line);border-radius:999px;
  padding:9px 22px;margin-bottom:30px;
  font-size:18px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acc);
}
.blist{list-style:none;display:flex;flex-direction:column;gap:26px}
.blist li{
  position:relative;padding-left:34px;
  font-size:25px;line-height:1.5;color:#D6DCE0;
}
.blist li::before{
  content:'';position:absolute;left:2px;top:.55em;
  width:10px;height:10px;border-radius:50%;background:var(--acc);
}

/* --- close: You vs Us -------------------------------------------------------- */
/* Two equal cards, each with a tinted header band over a plain body. The cards
   are stretched to a common height, so the empty space under the short list is
   part of the argument rather than a layout accident. */
/* "You vs Us" is one line in the reference, not the stacked two-line headline
   the other seven slides use. It is short enough to stay on one. */
#sl-7 .head{max-width:none}
#sl-7 .head .l2{display:inline;margin-left:.25em}

.cols{margin-top:40px;width:1380px;display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:stretch}
.col{
  background:var(--card);border:1px solid var(--line-2);
  border-radius:14px;overflow:hidden;text-align:left;
  display:flex;flex-direction:column;
}
.col .hd{
  display:flex;align-items:center;gap:16px;
  padding:22px 30px;border-bottom:1px solid var(--line-2);
  background:var(--card-2);
}
.col.you .hd{background:var(--acc-soft)}
.col .hd .em{font-size:30px;line-height:1}
.col .hd h3{font-size:27px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.col.you .hd h3{color:var(--acc)}
.col .hd .st{margin-top:2px;font-size:19px;color:var(--faint);font-weight:400}

.col ul{list-style:none;padding:28px 30px 34px;display:flex;flex-direction:column;gap:19px}
.col li{position:relative;padding-left:40px;font-size:24px;line-height:1.35}
.col li::before{position:absolute;left:2px;top:0;font-size:22px;line-height:1.35}

/* Your side is short and loud. Ours is long and deliberately quiet. */
.col.you li{color:var(--text);font-weight:600}
.col.you li::before{content:'\2713';color:var(--text)}
.col.we li{color:var(--muted);font-weight:400}
.col.we li::before{content:'\2192';color:var(--acc)}

.cta{
  margin-top:46px;display:inline-block;
  background:var(--acc);color:#07130E;
  border-radius:999px;padding:22px 52px;
  font-size:25px;font-weight:600;letter-spacing:-.01em;
}

/* Reveal: items rise in one beat at a time. Invisible in a still frame, so it
   costs the format nothing and gives Jake something to talk over. */
.rv{opacity:0;transform:translateY(14px);
    transition:opacity 320ms var(--ease), transform 320ms var(--ease)}
.rv.in{opacity:1;transform:none}

/* --- chrome ----------------------------------------------------------------- */
/* No step counter, no key hints. Jake wants nothing on the recorded frame but
   the slide, so the only chrome left is the progress hairline along the very
   bottom edge, and even that is off unless you ask for it with G. */
#bar{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);width:0;
     opacity:0;transition:width 380ms var(--ease), opacity 200ms}
body.guides #bar{opacity:.85}

@media (prefers-reduced-motion:reduce){
  .rv{transition-duration:1ms}
}
</style>
</head>
<body>
<div id="stage">
  <div id="slides"></div>
  <div id="bar"></div>
</div>

<script>
(function(){
  var D = window.DECK;

  var XICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';

  function headHTML(s){
    return '<span class="eyebrow">'+s.eyebrow+'</span>'+
           '<h1 class="head">'+s.h1+'<span class="l2">'+s.h2+'</span></h1>'+
           (s.sub ? '<p class="sub">'+s.sub+'</p>' : '');
  }

  /* Build all eight slides up front. */
  var host = document.getElementById('slides');

  D.forEach(function(s, i){
    var sec = document.createElement('section');
    sec.className = 'slide';
    sec.id = 'sl-'+i;
    var html = headHTML(s);

    if(s.kind === 'rows'){
      html += '<div class="rows">' + s.rows.map(function(r){
        return '<div class="rrow rv"><span class="x">'+XICON+'</span>'+
               '<span class="t">'+r.t+'</span>'+
               '<span class="pill">'+r.pill+'</span></div>';
      }).join('') + '</div>';
    }
    else if(s.kind === 'system'){
      html += '<div class="srows">' + s.rows.map(function(r){
        return '<div class="srow rv"><span class="tile">'+r.icon+'</span>'+
               '<div class="body"><div class="t">'+r.t+'</div>'+
               '<div class="d">'+r.d+'</div></div></div>';
      }).join('') + '</div>';
    }
    else if(s.kind === 'step'){
      html += '<div class="card"><span class="label">'+s.pill+'</span>'+
              '<ul class="blist">' + s.bullets.map(function(b){
                return '<li class="rv">'+b+'</li>';
              }).join('') + '</ul></div>';
    }
    else if(s.kind === 'close'){
      html += '<div class="cols">' + s.cols.map(function(c){
                return '<div class="col '+c.tone+' rv">'+
                       '<div class="hd"><span class="em">'+c.icon+'</span>'+
                       '<div><h3>'+c.t+'</h3><div class="st">'+c.sub+'</div></div></div>'+
                       '<ul>' + c.items.map(function(x){ return '<li>'+x+'</li>'; }).join('') +
                       '</ul></div>';
              }).join('') + '</div>' +
              '<div class="cta rv">'+s.cta+'</div>';
    }

    sec.innerHTML = html;
    host.appendChild(sec);
  });

  /* ONE BEAT PER SLIDE. There is no per-item stepping: landing on a slide
     shows everything on it at once. The .rv items still animate, but they all
     fire together, so it reads as the slide arriving rather than as a list
     being assembled while somebody waits. */
  var revealEls = D.map(function(s, i){
    return Array.prototype.slice.call(document.querySelectorAll('#sl-'+i+' .rv'));
  });

  var i = 0;

  function render(){
    D.forEach(function(_, k){
      var on = (k === i);
      document.getElementById('sl-'+k).classList.toggle('on', on);
      /* Cleared on the slides that are not showing, so stepping back into one
         plays its entrance again rather than snapping it on cold. */
      revealEls[k].forEach(function(el){ el.classList.toggle('in', on); });
    });

    document.getElementById('bar').style.width = (i/(D.length-1)*100)+'%';
  }

  function go(n){ i = Math.max(0, Math.min(D.length-1, n)); render(); }

  document.addEventListener('keydown', function(e){
    if(e.key===' '||e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='PageDown'){ e.preventDefault(); go(i+1); }
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'){ e.preventDefault(); go(i-1); }
    else if(e.key==='Home'){ go(0); }
    else if(e.key==='End'){ go(D.length-1); }
    else if(e.key==='g'||e.key==='G'){ document.body.classList.toggle('guides'); }
    else if(e.key==='f'||e.key==='F'){
      if(document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
  });
  document.addEventListener('click', function(){ go(i+1); });

  function fit(){
    var s = Math.min(innerWidth/1920, innerHeight/1080);
    document.getElementById('stage').style.transform = 'scale('+s+')';
  }
  addEventListener('resize', fit);
  fit();
  render();
})();
</script>
</body>
</html>
