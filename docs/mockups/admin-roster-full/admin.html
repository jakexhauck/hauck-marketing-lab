<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hauck Command · Admin (Roster Rail)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d1a; --rail:#0d1122; --surface:#111527; --surface-2:#171c33; --surface-3:#1e2440;
    --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.14);
    --text:#eef1fb; --muted:#9aa3c2; --faint:#697193;
    --brand:#6366f1; --brand-2:#818cf8; --grad:linear-gradient(135deg,#6366f1,#a855f7);
    --pos:#34d399; --warn:#fbbf24; --danger:#fb7185; --info:#38bdf8;
    --font:"Inter",system-ui,sans-serif; --display:"Poppins",var(--font); --mono:"JetBrains Mono",monospace;
    --acc:#6366f1; --acc-bg:rgba(99,102,241,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
  h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  a{color:inherit}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px}::-webkit-scrollbar-track{background:transparent}

  .app{display:grid;grid-template-columns:66px 322px 1fr;height:100vh;transition:grid-template-columns .25s cubic-bezier(.2,.8,.2,1)}
  .app.agency{grid-template-columns:66px 1fr}
  .app.agency .roster{display:none}

  /* ---------- agency spine ---------- */
  .spine{background:var(--rail);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px}
  .spine .logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;font-size:18px;box-shadow:0 6px 18px rgba(99,102,241,.4);margin-bottom:10px}
  .spine button{width:44px;height:44px;border-radius:12px;color:var(--faint);display:grid;place-items:center;transition:.15s;position:relative}
  .spine button:hover{background:var(--surface-2);color:var(--text)}
  .spine button.on{background:var(--surface-3);color:var(--brand-2)}
  .spine button.on::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:22px;border-radius:3px;background:var(--grad)}
  .spine button .tip{position:absolute;left:54px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--surface-3);border:1px solid var(--border-2);padding:5px 10px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:.15s;z-index:200;box-shadow:0 8px 20px rgba(0,0,0,.4)}
  .spine button:hover .tip{opacity:1;left:58px}
  .spine .sp{flex:1}

  /* ---------- roster (master) ---------- */
  .roster{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
  .roster-head{padding:18px 18px 10px}
  .roster-head h2{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
  .roster-head .count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--faint);font-weight:400}
  .search{display:flex;align-items:center;gap:9px;margin-top:12px;padding:9px 12px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border)}
  .search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:13px}
  .search input::placeholder{color:var(--faint)}
  .filters{display:flex;gap:6px;padding:0 18px 12px;flex-wrap:wrap}
  .filters button{padding:5px 11px;border-radius:20px;font-size:11.5px;font-weight:500;color:var(--muted);border:1px solid var(--border);transition:.15s}
  .filters button:hover{border-color:var(--border-2)}
  .filters button.on{background:var(--surface-3);color:var(--text);border-color:var(--border-2)}
  .roster-list{flex:1;overflow:auto;padding:0 10px 14px}
  .rcard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:13px;width:100%;text-align:left;transition:.13s;border:1px solid transparent;margin-bottom:2px}
  .rcard:hover{background:var(--surface-2)}
  .rcard.active{background:var(--surface-2);border-color:var(--border-2);box-shadow:inset 3px 0 0 var(--rc,var(--brand))}
  .rcard .av{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:600;font-size:14px;color:#fff;flex:none}
  .rcard .who{min-width:0;flex:1}
  .rcard .who b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rcard .who span{font-size:11.5px;color:var(--muted)}
  .rcard .side{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .rcard .side .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .rcard .side .row{display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .dot.good{background:var(--pos);box-shadow:0 0 8px rgba(52,211,153,.7)}
  .dot.warn{background:var(--warn);box-shadow:0 0 8px rgba(251,191,36,.6)}
  .dot.paused{background:var(--faint)}
  .badge{background:var(--danger);color:#fff;font-size:10px;font-weight:600;border-radius:9px;min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center}
  .roster-foot{padding:12px 14px;border-top:1px solid var(--border)}
  .roster-foot button{width:100%;padding:10px;border-radius:11px;background:var(--surface-2);border:1px dashed var(--border-2);color:var(--muted);font-weight:500;font-size:12.5px;transition:.15s}
  .roster-foot button:hover{color:var(--text);border-color:var(--brand-2)}

  /* ---------- main ---------- */
  .main{display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .m-head{padding:20px 26px 0;border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--acc-bg),transparent)}
  .mh-top{display:flex;align-items:center;gap:16px;margin-bottom:16px}
  .mh-top .av{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;color:#fff;flex:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .mh-top h1{font-size:22px;font-weight:700}
  .mh-top .sub{color:var(--muted);font-size:13px;margin-top:3px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid var(--border);background:var(--surface-2)}
  .chip.good{color:var(--pos);border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.1)}
  .chip.warn{color:var(--warn);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.1)}
  .chip.paused{color:var(--faint)}
  .mh-actions{margin-left:auto;display:flex;gap:9px}
  .btn{padding:10px 15px;border-radius:11px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;transition:.15s;white-space:nowrap}
  .btn.primary{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(99,102,241,.4)}
  .btn.primary:hover{transform:translateY(-1px)}
  .btn.ghost{border:1px solid var(--border-2);background:var(--surface-2)}
  .btn.ghost:hover{border-color:var(--brand-2)}
  .btn.sm{padding:7px 12px;font-size:12px}
  .tabs{display:flex;gap:2px;overflow-x:auto}
  .tabs button{padding:12px 15px;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;transition:.15s;white-space:nowrap}
  .tabs button:hover{color:var(--text)}
  .tabs button.on{color:var(--text);border-bottom-color:var(--brand)}
  .m-body{flex:1;overflow:auto;padding:22px 26px 44px}

  /* generic building blocks */
  .kpis{display:grid;gap:14px;margin-bottom:20px}
  .kpis.c4{grid-template-columns:repeat(4,1fr)}.kpis.c5{grid-template-columns:repeat(5,1fr)}.kpis.c3{grid-template-columns:repeat(3,1fr)}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
  .kpi .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .kpi .val{font-family:var(--display);font-weight:700;font-size:25px;margin-top:6px;letter-spacing:-.02em}
  .kpi .delta{font-family:var(--mono);font-size:11px;margin-top:3px}
  .kpi .delta.up{color:var(--pos)}.kpi .delta.down{color:var(--danger)}.kpi .delta.flat{color:var(--faint)}
  .cols{display:grid;gap:16px}
  .cols.a{grid-template-columns:1.6fr 1fr}.cols.b{grid-template-columns:1fr 1fr}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px}
  .panel h3{font-size:14.5px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .panel h3 .link{margin-left:auto;color:var(--brand-2);font-size:12px;font-weight:500}
  .sect-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600;margin:4px 0 12px}

  .bars{display:flex;align-items:flex-end;gap:7px;height:130px}
  .bars .b{flex:1;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--brand-2),rgba(99,102,241,.2));transition:height .5s cubic-bezier(.2,.8,.2,1)}
  .bars-x{display:flex;gap:7px;margin-top:8px}.bars-x span{flex:1;text-align:center;font-size:10px;color:var(--faint);font-family:var(--mono)}
  .metrics{display:flex;gap:26px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
  .metrics .k{font-size:11px;color:var(--muted)}.metrics .v{font-family:var(--display);font-weight:600;font-size:18px;margin-top:2px}

  .act{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--border)}.act:last-child{border:0}
  .act .ic{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;flex:none;font-size:14px}
  .act .tx{font-size:12.5px}.act .tx b{font-weight:600}.act .tm{color:var(--faint);font-size:11px;font-family:var(--mono);margin-top:2px}

  /* tables */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600;padding:0 12px 10px}
  td{padding:12px;border-top:1px solid var(--border);font-size:13px;vertical-align:middle}
  tr.row:hover td{background:var(--surface-2)}
  .tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;font-size:11px;font-weight:600}
  .tag.scale{color:var(--pos);background:rgba(52,211,153,.12)}
  .tag.watch{color:var(--info);background:rgba(56,189,248,.12)}
  .tag.kill{color:var(--danger);background:rgba(251,113,133,.12)}
  .tag.refresh{color:var(--warn);background:rgba(251,191,36,.12)}
  .tag.live{color:var(--pos);background:rgba(52,211,153,.1)}
  .tag.paused{color:var(--faint);background:var(--surface-3)}
  .spark{display:inline-flex;align-items:flex-end;gap:2px;height:26px;vertical-align:middle}
  .spark .b{width:4px;border-radius:2px;background:var(--brand-2);opacity:.85}

  /* kanban */
  .kb{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .kcol{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;min-height:200px}
  .kcol .kh{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12.5px;font-weight:600}
  .kcol .kh .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-3);border-radius:20px;padding:1px 8px}
  .lcard{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:11px;margin-bottom:8px;cursor:grab;transition:.13s}
  .lcard:hover{border-color:var(--border-2);transform:translateY(-1px)}
  .lcard .ln{display:flex;align-items:center;gap:9px}
  .lcard .lav{width:28px;height:28px;border-radius:8px;background:var(--surface-3);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
  .lcard .lm{font-size:11px;color:var(--muted);margin-top:7px;display:flex;justify-content:space-between}
  .src{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--surface-3);color:var(--muted);font-weight:500}

  /* inbox */
  .inbox{display:grid;grid-template-columns:320px 1fr;gap:0;border:1px solid var(--border);border-radius:16px;overflow:hidden;height:560px;background:var(--surface)}
  .inbox-list{border-right:1px solid var(--border);overflow:auto}
  .conv{display:flex;gap:11px;padding:13px 15px;border-bottom:1px solid var(--border);cursor:pointer;transition:.12s}
  .conv:hover,.conv.on{background:var(--surface-2)}
  .conv .cav{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;flex:none}
  .conv .cbody{min-width:0;flex:1}
  .conv .cbody .ct{display:flex;align-items:center;gap:6px}.conv .cbody b{font-size:13px;font-weight:600}
  .conv .cbody .sn{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .wait{margin-left:auto;font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:20px}
  .wait.hot{color:var(--danger);background:rgba(251,113,133,.12)}.wait.warm{color:var(--warn);background:rgba(251,191,36,.12)}.wait.cool{color:var(--faint);background:var(--surface-3)}
  .chan{font-size:10px;padding:1px 6px;border-radius:5px;font-weight:600}
  .thread{display:flex;flex-direction:column}
  .thread .th-h{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px}
  .thread .th-b{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
  .msg{max-width:74%;padding:10px 13px;border-radius:13px;font-size:13px}
  .msg.them{background:var(--surface-2);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
  .msg.us{background:var(--grad);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .msg .mt{font-size:10px;opacity:.7;margin-top:4px;font-family:var(--mono)}
  .th-compose{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center}
  .th-compose input{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:11px 14px;color:var(--text);outline:0}

  /* calendar agenda */
  .cal{display:flex;flex-direction:column;gap:14px}
  .day{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .day .dh{padding:11px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px;background:var(--surface-2)}
  .day .dh .dd{color:var(--faint);font-weight:500;font-family:var(--mono);font-size:12px}
  .evt{display:flex;align-items:center;gap:13px;padding:12px 16px;border-bottom:1px solid var(--border)}.evt:last-child{border:0}
  .evt .tm{font-family:var(--mono);font-size:12px;color:var(--muted);width:74px;flex:none}
  .evt .bar{width:3px;height:34px;border-radius:3px;flex:none}
  .evt .en{font-size:13px;font-weight:500}.evt .em{font-size:11.5px;color:var(--muted)}
  .evt .who2{margin-left:auto;font-size:11.5px;color:var(--muted)}

  /* revenue */
  .cust{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}.cust:last-child{border:0}
  .cust .cav{width:34px;height:34px;border-radius:9px;background:var(--surface-3);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
  .cust .cn{font-size:13px;font-weight:500}.cust .cs{font-size:11px;color:var(--faint)}
  .cust .cv{margin-left:auto;font-family:var(--mono);font-weight:600}

  /* team & config */
  .staff{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--border)}.staff:last-child{border:0}
  .staff .sav{width:38px;height:38px;border-radius:11px;background:var(--surface-3);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
  .staff .sn{font-size:13.5px;font-weight:600}.staff .sr{font-size:11.5px;color:var(--muted)}
  .perms{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto;max-width:340px;justify-content:flex-end}
  .perm{font-size:10.5px;padding:2px 8px;border-radius:6px;background:var(--surface-3);color:var(--muted);font-weight:500}
  .perm.on{background:rgba(99,102,241,.16);color:var(--brand-2)}
  .cfg-row{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--border)}.cfg-row:last-child{border:0}
  .cfg-row .cl{font-size:13px;font-weight:500}.cfg-row .cd{font-size:11.5px;color:var(--faint);margin-top:2px}
  .cfg-row .cv{margin-left:auto;display:flex;align-items:center;gap:10px}
  .swatch{width:26px;height:26px;border-radius:8px;border:1px solid var(--border-2)}
  .toggle{width:42px;height:24px;border-radius:20px;background:var(--surface-3);position:relative;transition:.18s;flex:none;cursor:pointer}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.18s}
  .toggle.on{background:var(--brand)}.toggle.on::after{left:21px}
  .field{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 13px;font-size:13px;min-width:200px;color:var(--text)}

  /* leaderboard / attention */
  .lb{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--border)}.lb:last-child{border:0}
  .lb .rank{font-family:var(--mono);font-size:13px;color:var(--faint);width:20px}
  .lb .lav{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;flex:none}
  .lb .ln{font-size:13px;font-weight:600}.lb .ls{font-size:11px;color:var(--muted)}
  .lb .track{width:120px;height:7px;border-radius:6px;background:var(--surface-3);overflow:hidden;margin-left:auto}
  .lb .fill{height:100%;background:var(--grad)}
  .lb .lv{font-family:var(--mono);font-weight:600;width:74px;text-align:right}
  .attn-card{display:flex;align-items:center;gap:13px;padding:14px;border-radius:13px;background:var(--surface);border:1px solid var(--border);margin-bottom:10px}
  .attn-card.warn{border-color:rgba(251,191,36,.3);background:linear-gradient(160deg,rgba(251,191,36,.07),var(--surface))}
  .attn-card .av{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:600;color:#fff;flex:none}
  .attn-card .why{font-size:12.5px;color:var(--warn);font-weight:500}

  /* infra */
  .nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .node{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
  .node .nh{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .node .nn{font-weight:600;font-size:13.5px}
  .node .nm{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--border)}

  /* onboarding board reuse kanban */
  .empty{display:grid;place-items:center;height:340px;color:var(--faint);text-align:center;gap:8px}
  .empty svg{width:42px;height:42px;stroke-width:1.5;opacity:.5}

  .grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .listcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;transition:.15s}
  .listcard:hover{border-color:var(--border-2);transform:translateY(-2px)}
  .listcard h4{font-size:14px;font-weight:600;margin-bottom:5px}
  .listcard p{font-size:12px;color:var(--muted);margin:0}

  /* ---------- pillars / constraints (Theory of Constraints) ---------- */
  .banner{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:16px;margin-bottom:22px;background:linear-gradient(135deg,rgba(251,113,133,.16),rgba(251,191,36,.09));border:1px solid rgba(251,113,133,.32)}
  .banner .bic{width:46px;height:46px;border-radius:12px;background:rgba(251,113,133,.16);display:grid;place-items:center;font-size:22px;flex:none}

  const sevLabel=con.sev==='high'?'BINDING CONSTRAINT':con.sev==='med'?'WATCH — SUBORDINATE TO CONSTRAINT':'HAS SLACK — SUBORDINATE';
  const stateTag=s=>s==='done'?'<span class="tag live">Done</span>':s==='doing'?'<span class="tag watch">In progress</span>':'<span class="tag paused">To do</span>';
  return agHead(p.label,p.sub,'<button class="btn ghost" onclick="goSection(\'command\')">← All pillars</button><button class="btn primary" onclick="goSection(\'command\')">Command</button>')+
  `<div class="m-body">
    <div class="kpis c4">${p.kpis.map(k=>`<div class="kpi"><div class="lbl">${k[0]}</div><div class="val">${k[1]}</div></div>`).join('')}</div>
    <div class="cols a">
      <div class="panel" style="${con.sev==='high'?'border-color:rgba(251,113,133,.4);box-shadow:0 0 0 1px rgba(251,113,133,.2)':''}">
        <h3><span class="sev ${con.sev}">${sevLabel}</span></h3>
        <div style="font-family:var(--display);font-weight:700;font-size:19px;margin:2px 0 8px;letter-spacing:-.01em">${con.title}</div>
        <div style="font-size:13px;color:var(--muted);line-height:1.65">${con.detail}</div>
        <div class="metrics"><div><div class="k">Constraint metric</div><div class="v mono">${con.metric}</div></div><div style="flex:1"><div class="k">Impact on throughput</div><div class="v" style="font-size:13.5px;font-weight:500;line-height:1.4">${con.impact}</div></div></div>
      </div>
      <div class="panel"><h3>Throughput funnel</h3><div class="funnel">${p.funnel.map(f=>`<div class="fstep"><span class="fn">${f[0]}</span><span class="fbar" style="width:${Math.max(f[2],12)}%;background:${p.color}">${f[1]}</span></div>`).join('')}</div>
        <p style="color:var(--faint);font-size:11.5px;margin:14px 0 0">Each step is where volume drops. The widest drop is where to look.</p></div>
    </div>
    <div class="panel" style="margin-top:16px"><h3>⚔️ Attack plan<span style="margin-left:9px;font-size:11px;color:var(--faint);font-weight:400">Theory of Constraints — Identify → Exploit → Subordinate → Elevate → Repeat</span></h3>
      <div class="attack">${p.attack.map((a,i)=>`<div class="astep ${a[1]}"><span class="anum">${i+1}</span><div style="flex:1"><div class="aname">${a[0]}<span style="color:var(--faint);font-weight:400;font-size:11px"> · owner ${a[3]}</span></div><div style="font-size:12.5px;color:var(--muted);margin-top:3px">${a[2]}</div></div><span style="align-self:center">${stateTag(a[1])}</span></div>`).join('')}</div>
    </div>
    ${atRisk.length?`<div class="panel" style="margin-top:16px"><h3>Accounts strained by this constraint<span style="margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:400">pick any account in the roster ←</span></h3>${atRisk.map(c=>`<div class="attn-card warn"><span class="av" style="background:${c.color}">${c.initials}</span><div><div style="font-weight:600">${c.name}</div><div class="why">${c.id==='bluepeak'?'CPL rising, leads down 30% — needs creative refresh':'Spend up, bookings flat — needs optimisation pass'}</div></div><button class="btn ghost sm" style="margin-left:auto" onclick="openClient('${c.id}')">Open →</button></div>`).join('')}</div>`:''}
    ${id==='operations'?`<div class="cols b" style="margin-top:16px">
      <div class="panel"><h3>Team capacity</h3>
        ${[['Jake Hauck','Founder / Operator','—'],['Leo Park','Media Buyer','7 / 5 accounts'],['Ava Mercer','Account Manager','3 clients'],['Nina Ross','Onboarding','2 in flight'],['Hermes','Ops Agent','automation']].map(t=>`<div class="staff"><span class="sav">${t[0].split(' ').map(x=>x[0]).join('')}</span><div><div class="sn">${t[0]}</div><div class="sr">${t[1]}</div></div><span class="perm ${t[2].includes('7 / 5')?'':'on'}" style="margin-left:auto;${t[2].includes('7 / 5')?'background:rgba(251,113,133,.15);color:var(--danger)':''}">${t[2]}</span></div>`).join('')}
      </div>
      <div class="panel"><h3>Systems<a class="link">Run checks</a></h3>
        ${[['Client App · CF Pages','#34d399','Operational'],['Database · Supabase','#34d399','Healthy'],['CRM / Automations','#34d399','Connected'],['Meta Ads API','#fbbf24','Token expires 12d'],['Calendar sync','#fbbf24','Desktop-only']].map(n=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px"><span class="dot" style="background:${n[1]}"></span>${n[0]}<span style="margin-left:auto;color:${n[1]};font-size:11.5px">${n[2]}</span></div>`).join('')}
      </div>
    </div>`:''}
  </div>`;
}
window.goSection=id=>{state.section=id;if(id==='delivery')state.deliveryView='overview';renderAll();};
function agSettings(){
  const row=(l,d,cv)=>`<div class="cfg-row"><div><div class="cl">${l}</div><div class="cd">${d}</div></div><div class="cv">${cv}</div></div>`;
  return agHead('Settings','Agency profile and defaults')+
  `<div class="m-body"><div class="cols b">
    <div class="panel"><h3>Agency profile</h3>
      ${row('Agency name','',`<input class="field" value="Hauck Marketing">`)}
      ${row('Primary domain','White-label app URL','<input class="field" value="app.hauckmarketing.com">')}
      ${row('Default brand color','New subaccount default','<span class="swatch" style="background:#6366f1"></span><input class="field" style="min-width:110px" value="#6366f1">')}
      ${row('Support email','','<input class="field" value="contact@hauckmarketing.com">')}
    </div>
    <div class="panel"><h3>Integrations</h3>
      ${row('CRM / automations','White-label backend','<span class="tag live">● Connected</span>')}
      ${row('Meta Business','Ads insights','<span class="tag live">● Connected</span>')}
      ${row('Google (Calendar/Drive)','OAuth','<span class="tag refresh">Re-auth in 12d</span>')}
      ${row('Stripe','Billing','<span class="tag live">● Connected</span>')}
    </div>
  </div></div>`;
}
window.openClient=id=>{state.client=SUB.find(c=>c.id===id);state.section='delivery';state.deliveryView='client';state.tab='Overview';renderAll();};

/* ============================ WIRE ============================ */
$('#search').oninput=e=>{state.query=e.target.value.toLowerCase();renderList();};
$('#filters').querySelectorAll('button').forEach(el=>el.onclick=()=>{$('#filters').querySelector('.on').classList.remove('on');el.classList.add('on');state.filter=el.dataset.f;renderList();});
function renderAll(){renderSpine();renderList();renderMain();}
renderAll();
</script>
</body>
</html>
