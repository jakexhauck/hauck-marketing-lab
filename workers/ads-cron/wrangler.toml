name = "hauck-ads-cron"
main = "src/index.ts"
compatibility_date = "2026-05-18"

# Why this exists as a separate deploy at all: Cloudflare Pages projects cannot
# carry a cron trigger. The Command Center is a Pages project, so the thing that
# refreshes ad spend every night has to be a Worker sitting beside it.
#
# It is deliberately tiny. It holds no database access, no vendor tokens and no
# business logic: it makes one authenticated POST and logs the outcome.

[triggers]
# Hourly (was 06:00 UTC once a day until 2026-09-22). Once a day meant today's
# spend never showed and one missed firing (it happened, 2026-09-22) left two
# days out. Every run also re-proves each client's whole history against Meta
# and re-pulls any day that disagrees, so older restatements are caught too.
crons = ["7 * * * *"]

[vars]
# ?days=7 on purpose. Meta restates recent spend for several days after the
# fact, so re-pulling a trailing week keeps recent history true. Anything older
# Meta restates is found by the reconciliation at the end of every run.
SYNC_URL = "https://app.hauckmarketing.com/api/admin/ads/sync?days=7"

# Reporting booked appointments back to Meta: OFF (Jake, 2026-08-14).
#
# Willis reports bookings from the BROWSER instead, with a Schedule event on
# williswindows.com/thank-you-quote. Both at once would count every booking
# twice: the browser event and this one carry different ids (a pixel event id
# versus the GHL appointment id) and Meta cannot deduplicate across them.
#
# Unsetting the variable is the whole switch. runCapiSchedule() checks for it
# and skips, so the code, the endpoint and the capi_sent ledger all stay in
# place. Put this line back to return to server-side reporting, and turn the
# browser event off in public/sites/willis/thanks.js at the same time.
#
# CAPI_SCHEDULE_URL = "https://app.hauckmarketing.com/api/admin/ads/capi-schedule"

# ADS_CRON_SECRET is NOT here on purpose: it is a secret, set with
#   wrangler secret put ADS_CRON_SECRET
# and it has to match the value in the Pages project's own environment exactly,
# or every run comes back 401 and spend silently stops updating.
