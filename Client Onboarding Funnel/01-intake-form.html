<!--
  HAUCK MARKETING CLIENT INTAKE FUNNEL — step 1 of 3

  THIS IS THE WHOLE THING. Paste it into the GoHighLevel step and never come
  back. The form itself is served from the Command Center, so every future
  change to a question, a word or a colour ships by deploy.

  It used to be a 700-line block pasted in full, which meant GHL held a COPY:
  editing the repo changed nothing until somebody re-pasted, and the two drifted
  every time. Now GHL holds a pointer.

  The real file:
    command-center/app/public/funnel/intake.js

  HOW TO USE IT IN GHL
  1. Funnel > the step > Custom JS/HTML element.
  2. Paste everything below.
  3. Set the step to full width and remove GHL's own padding, or the card sits
     in a narrower column than it was designed for.
  4. Publish, then open the page and walk all seven steps.

  This is the same pattern step 2 already uses to load GHL's booking widget, so
  it is proven on these pages: a script tag survives the builder, a <link> tag
  does not.

  TESTING WITHOUT CREATING A CLIENT
  Finishing this form now creates a real tenant and a real login on the spot.
  To walk it without saving anything, add ?dry=1 to the page URL:

    https://www.hauckmarketing.com/onboarding-form?dry=1

  The funnel then behaves exactly as normal, keeps progress in the browser and
  hands off to the calendar, but posts nothing.

  WHAT MAKES THE SAVE WORK
  FUNNEL_URL must be set on the Command Center to this page's published address.
  The API derives the allowed CORS origin from it; without it every save fails
  on CORS. It is configuration, not a code change.
-->
