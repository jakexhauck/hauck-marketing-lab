<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SOP Hub — Hauck Marketing</title>
<link rel="icon" href="logo.png" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <a href="/"><img class="brandmark" src="logo.png" alt="Hauck Marketing" /></a>
      <nav class="nav">
        <span class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="q" type="text" placeholder="Search SOPs…" autocomplete="off" />
        </span>
        <button class="btn ghost" id="logout" type="button">Log out</button>
      </nav>
    </header>

    <a class="back" href="/"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg> Internal Hub</a>

    <section class="hero" style="padding-top:24px">
      <h1>SOP Hub</h1>
    </section>

    <section class="index" id="index"></section>

    <footer>Hauck Marketing · Internal use only · internal.hauckmarketing.com</footer>
  </div>

  <script src="data.js"></script>
  <script>
    const ARROW = '<span class="arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';
    const VIDEO = '<span class="tag"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Video</span>';

    function row(cat, s) {
      return `<a class="row" href="sop.html?cat=${cat.key}&slug=${s.slug}">
        <span class="li"><span class="emoji">${s.emoji || '📄'}</span>
          <span class="l"><span class="title">${s.title}</span><span class="desc">${s.desc || ''}</span></span></span>
        <span class="r">${s.video ? VIDEO : ''}${ARROW}</span></a>`;
    }

    function render(filter) {
      const q = (filter || '').trim().toLowerCase();
      const root = document.getElementById('index');
      let html = '';
      let shown = 0;
      for (const cat of window.SOP_DATA.categories) {
        const sops = q
          ? cat.sops.filter(s => (s.title + ' ' + (s.desc||'')).toLowerCase().includes(q))
          : cat.sops;
        if (!sops.length) continue;
        shown += sops.length;
        html += `<div class="cat"><div class="cat-head"><span class="cemoji">${cat.emoji}</span><h2>${cat.name}</h2><span class="count">${sops.length} SOP${sops.length===1?'':'s'}</span></div>${sops.map(s => row(cat, s)).join('')}</div>`;
      }
      root.innerHTML = shown ? html : '<div class="empty">No SOPs match that search.</div>';
    }

    render();
    document.getElementById('q').addEventListener('input', e => render(e.target.value));
    document.getElementById('logout').addEventListener('click', async () => {
      try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (e) {}
      location.href = '/login';
    });
  </script>
</body>
</html>
