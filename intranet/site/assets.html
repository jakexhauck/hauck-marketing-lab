<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hauck Marketing — Assets</title>
<link rel="icon" href="logo.png" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <a href="/"><img class="brandmark" src="logo.png" alt="Hauck Marketing" /></a>
      <nav class="nav">
        <a class="btn ghost" href="/">Hub</a>
        <button class="btn ghost" id="logout" type="button">Log out</button>
      </nav>
    </header>

    <section class="hero">
      <h1>Client <span class="o">Assets</span></h1>
      <p>Every client file, straight from Google Drive. Browse, upload, and download in one place.</p>
    </section>

    <section class="index">
      <div id="banner"></div>

      <div class="assets-bar">
        <div class="crumbs" id="crumbs"></div>
        <div class="assets-actions" id="actions"></div>
      </div>

      <div id="list" style="margin-top: 14px;"></div>
    </section>

    <footer>Hauck Marketing · Internal use only · internal.hauckmarketing.com</footer>
  </div>

  <div id="modal-root"></div>
  <input type="file" id="file-input" multiple style="display:none" />

  <script>
    document.getElementById('logout').addEventListener('click', async () => {
      try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (e) {}
      location.href = '/login';
    });
  </script>
  <script src="assets.js"></script>
</body>
</html>
