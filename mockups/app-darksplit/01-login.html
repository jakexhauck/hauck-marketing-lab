<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  /* Login-specific: full navy phone background */
  .phone.login {
    background: linear-gradient(165deg, #13294a 0%, #0d1f38 100%);
  }
  .login-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 26px;
  }
  .auth-card {
    width: 100%;
    background: #fff;
    border-radius: 26px;
    padding: 30px 26px;
    box-shadow: 0 24px 60px rgba(5, 16, 34, 0.45), 0 2px 8px rgba(5, 16, 34, 0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .brand-mark-lg {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: var(--navy-1);
    color: #fff;
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(19, 41, 74, 0.28);
  }
  .auth-kicker {
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-size: 11px;
    font-weight: 700;
    color: var(--faint);
    margin-top: 22px;
  }
  .auth-title {
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    font-size: 28px;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-top: 6px;
  }
  .auth-sub {
    font-size: 14px;
    color: var(--muted);
    margin-top: 6px;
  }
  .auth-form {
    width: 100%;
    margin-top: 26px;
  }
  .field-label {
    display: block;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .field-input {
    width: 100%;
    height: 50px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #fff;
    padding: 0 16px;
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--ink);
    outline: none;
  }
  .field-input::placeholder {
    letter-spacing: 0.18em;
    color: #cbd3df;
  }
  .btn-primary {
    width: 100%;
    height: 52px;
    margin-top: 18px;
    border: none;
    border-radius: 14px;
    background: var(--brand);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.01em;
    box-shadow: 0 10px 22px rgba(26, 77, 143, 0.32);
    cursor: pointer;
  }
  .auth-divider {
    width: 100%;
    height: 1px;
    background: var(--line);
    margin: 22px 0 16px;
  }
  .auth-link {
    display: block;
    width: 100%;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-decoration: none;
  }
  .auth-footer {
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.42);
    margin-top: 22px;
    letter-spacing: 0.02em;
  }
  .homebar.on-navy { background: transparent; }
  .homebar.on-navy::after { background: rgba(255, 255, 255, 0.85); }
</style>
</head>
<body>
<div class="phone login">

  <div class="statusbar on-dark">
    <span>9:41</span>
    <span class="ios-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="4.5" width="3" height="7.5" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.2c2 0 3.9.8 5.3 2.1l1.2-1.3A9.4 9.4 0 0 0 8.5.5 9.4 9.4 0 0 0 2 3l1.2 1.3A7.4 7.4 0 0 1 8.5 2.2Zm0 3.4c1.1 0 2.1.4 2.9 1.2l1.2-1.3a5.9 5.9 0 0 0-8.2 0l1.2 1.3a4 4 0 0 1 2.9-1.2Zm0 3.3L10.2 10a2.4 2.4 0 0 0-3.4 0l1.7 1.8Z"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="currentColor"/><rect x="24" y="4" width="1.5" height="4" rx="0.75" fill="currentColor" opacity="0.5"/></svg>
    </span>
  </div>

  <div class="login-body">
    <div class="auth-card">
      <div class="brand-mark-lg">WW</div>
      <div class="auth-kicker">Sign in</div>
      <div class="auth-title">Willis Leads</div>
      <div class="auth-sub">Your leads, your pipeline.</div>

      <div class="auth-form">
        <label class="field-label" for="pw">Password</label>
        <input id="pw" class="field-input" type="password" value="••••••••••" readonly>
        <button class="btn-primary">Sign in</button>

        <div class="auth-divider"></div>
        <a class="auth-link" href="#">Log into test account</a>
      </div>
    </div>

    <div class="auth-footer">Secured by Willis Marketing</div>
  </div>

  <div class="homebar on-navy"></div>

</div>
</body>
</html>
