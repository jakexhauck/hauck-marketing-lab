<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base.css">
<title>Home A — Clean list</title>
<style>
  .pl-card { margin: 4px 22px 0; }
  .pl-row { display: flex; align-items: center; gap: 14px; padding: 15px 16px; background: var(--surface); }
  .pl-row + .pl-row { border-top: 1px solid var(--divider); }
  .pl-chip { width: 40px; height: 40px; border-radius: 12px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
  .pl-chip svg { width: 19px; height: 19px; color: #fff; }
  .pl-mid { flex: 1; min-width: 0; }
  .pl-name { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 15px; color: var(--ink); }
  .pl-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .pl-count { font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 21px; color: var(--ink); letter-spacing: -0.02em; }
  .pl-chev { color: var(--faint); display: flex; }
  .pl-chev svg { width: 18px; height: 18px; display: block; }
</style>
</head>
<body>
<div class="phone">

  <div class="hero">
    <div class="statusbar on-dark">
      <span>9:41</span>
      <span class="ios-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="4.5" width="3" height="7.5" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.2c2 0 3.9.8 5.3 2.1l1.2-1.3A9.4 9.4 0 0 0 8.5.5 9.4 9.4 0 0 0 2 3l1.2 1.3A7.4 7.4 0 0 1 8.5 2.2Zm0 3.4c1.1 0 2.1.4 2.9 1.2l1.2-1.3a5.9 5.9 0 0 0-8.2 0l1.2 1.3a4 4 0 0 1 2.9-1.2Zm0 3.3L10.2 10a2.4 2.4 0 0 0-3.4 0l1.7 1.8Z"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="currentColor"/><rect x="24" y="4" width="1.5" height="4" rx="0.75" fill="currentColor" opacity="0.5"/></svg>
      </span>
    </div>

    <div class="brand-head">
      <div class="brand-left">
        <div class="mark">WW</div>
        <div>
          <div class="brand-name">Willis Leads</div>
          <div class="brand-sub">Good morning, Mon Jun 9</div>
        </div>
      </div>
      <button class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>

    <div class="split" style="margin-top:26px">
      <div class="split-primary">
        <div class="cap-light">New leads today</div>
        <div class="hero-num" style="font-size:56px;color:#fff;margin-top:6px">12</div>
      </div>
      <div class="split-div"></div>
      <div class="split-secondary">
        <div class="hero-num" style="font-size:30px">5</div>
        <div class="cap-light" style="margin-top:6px">Unread</div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="sec-head">
      <span class="sec-kicker">Pipelines</span>
      <span class="sec-meta">5 active</span>
    </div>

    <div class="card pl-card">
      <div class="pl-row">
        <div class="pl-chip" style="background:#1a4d8f"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></div>
        <div class="pl-mid">
          <div class="pl-name">Database Reactivation</div>
          <div class="pl-sub">4 responded</div>
        </div>
        <div class="pl-count">4</div>
        <span class="pl-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      </div>

      <div class="pl-row">
        <div class="pl-chip" style="background:#0e7490"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></div>
        <div class="pl-mid">
          <div class="pl-name">Google Reviews</div>
          <div class="pl-sub">6 review requests out</div>
        </div>
        <div class="pl-count">6</div>
        <span class="pl-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      </div>

      <div class="pl-row">
        <div class="pl-chip" style="background:#15803d"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></div>
        <div class="pl-mid">
          <div class="pl-name">Organic</div>
          <div class="pl-sub">3 new leads</div>
        </div>
        <div class="pl-count">3</div>
        <span class="pl-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      </div>

      <div class="pl-row">
        <div class="pl-chip" style="background:#b45309"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></div>
        <div class="pl-mid">
          <div class="pl-name">Paid Ads</div>
          <div class="pl-sub">12 new today</div>
        </div>
        <div class="pl-count">12</div>
        <span class="pl-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      </div>

      <div class="pl-row">
        <div class="pl-chip" style="background:#7c3aed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></div>
        <div class="pl-mid">
          <div class="pl-name">Sales</div>
          <div class="pl-sub">8 open leads</div>
        </div>
        <div class="pl-count">8</div>
        <span class="pl-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="9" y2="18"/></svg><span>Leads</span></div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Chats</span></div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Contacts</span></div>
  </div>
  <div class="homebar"></div>

</div>
</body>
</html>
