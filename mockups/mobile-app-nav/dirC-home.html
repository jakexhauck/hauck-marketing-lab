<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<title>Willis Leads - Home</title>
<style>
  .topbar .greeting { font-size: 11.5px; color: var(--text-faint); font-weight: 600; margin-top: 1px; }
  .topbar .appwrap { display: flex; flex-direction: column; }

  .hero {
    margin: 16px 20px 4px;
    border-radius: 20px;
    padding: 20px 20px 18px;
    background: linear-gradient(150deg, #1a4d8f 0%, #133766 100%);
    box-shadow: 0 8px 22px rgba(19,55,102,0.28);
  }
  .hero .num { font-size: 46px; color: #fff; }
  .hero .num small { font-size: 18px; font-weight: 700; opacity: 0.85; letter-spacing: -0.02em; }
  .hero .sub { margin-top: 2px; }
  .hero .divider { height: 1px; background: rgba(255,255,255,0.16); margin: 14px 0 12px; }
  .hero .second { display: flex; align-items: center; gap: 10px; }
  .hero .msgicon {
    width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto;
    background: rgba(255,255,255,0.14); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .hero .msgicon svg { width: 16px; height: 16px; }
  .hero .msgtxt { color: #fff; font-weight: 600; font-size: 13.5px; }
  .hero .msgtxt b { font-family: var(--font-display); font-weight: 800; }

  .section .t.font-display { font-size: 13.5px; }

  /* tappable card affordance */
  .pcard { box-shadow: 0 1px 2px rgba(15,23,42,0.04); transition: transform .1s ease; }
  .pcard .top { display: flex; align-items: center; justify-content: space-between; }
  .pcard .top .chev { color: var(--text-faint); }
  .pcard .top .chev svg { width: 16px; height: 16px; }
  .pcard .dot svg { width: 16px; height: 16px; }
  .pcard .dot .ini { font-family: var(--font-display); font-weight: 800; font-size: 12px; }
  .pcard .big { color: var(--text); }
  .scroll { padding-bottom: 8px; }
</style>
</head>
<body>
<div class="phone">

  <div class="statusbar">
    <span>9:41</span>
    <span class="ios-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="4.5" width="3" height="7.5" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.2c2 0 3.9.8 5.3 2.1l1.2-1.3A9.4 9.4 0 0 0 8.5.5 9.4 9.4 0 0 0 2 3l1.2 1.3A7.4 7.4 0 0 1 8.5 2.2Zm0 3.4c1.1 0 2.1.4 2.9 1.2l1.2-1.3a5.9 5.9 0 0 0-8.2 0l1.2 1.3a4 4 0 0 1 2.9-1.2Zm0 3.3L10.2 10a2.4 2.4 0 0 0-3.4 0l1.7 1.8Z"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="currentColor"/><rect x="24" y="4" width="1.5" height="4" rx="0.75" fill="currentColor" opacity="0.5"/></svg>
    </span>
  </div>

  <div class="topbar">
    <div class="brandchip">WW</div>
    <div class="appwrap">
      <span class="appname">Willis Leads</span>
      <span class="greeting">Good morning, Monday Jun 8</span>
    </div>
    <span class="spacer"></span>
    <span class="iconbtn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
  </div>

  <div class="screen">
    <div class="scroll">

      <div class="hero">
        <div class="num hero-num">12 <small>new leads today</small></div>
        <div class="sub cap-light">Across all pipelines</div>
        <div class="divider"></div>
        <div class="second">
          <span class="msgicon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          </span>
          <span class="msgtxt"><b>5</b> unread messages</span>
        </div>
      </div>

      <div class="section">
        <span class="t font-display">Pipelines</span>
        <span class="m">5 active</span>
      </div>

      <div class="cardgrid">

        <div class="pcard">
          <div class="top">
            <span class="dot" style="background:#1a4d8f">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="9" y2="18"/></svg>
            </span>
            <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="pname">Sales</div>
          <div class="big stat-num tnum">8</div>
          <div class="foot">3 estimates out</div>
        </div>

        <div class="pcard">
          <div class="top">
            <span class="dot" style="background:#0e7490">
              <span class="ini">PA</span>
            </span>
            <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="pname">Paid Ads</div>
          <div class="big stat-num tnum">12</div>
          <div class="foot">New today</div>
        </div>

        <div class="pcard">
          <div class="top">
            <span class="dot" style="background:#7c3aed">
              <span class="ini">DB</span>
            </span>
            <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="pname">DBR</div>
          <div class="big stat-num tnum">4</div>
          <div class="foot">Responded</div>
        </div>

        <div class="pcard">
          <div class="top">
            <span class="dot" style="background:#b45309">
              <span class="ini">GO</span>
            </span>
            <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="pname">Google</div>
          <div class="big stat-num tnum">6</div>
          <div class="foot">Reviews requested</div>
        </div>

        <div class="pcard">
          <div class="top">
            <span class="dot" style="background:#15803d">
              <span class="ini">OR</span>
            </span>
            <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="pname">Organic</div>
          <div class="big stat-num tnum">3</div>
          <div class="foot">New leads</div>
        </div>

        <div class="pcard">
          <div class="top">
            <span class="dot" style="background:#be123c">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            </span>
            <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="pname">Conversations</div>
          <div class="big stat-num tnum">5</div>
          <div class="foot">Unread</div>
        </div>

      </div>

    </div>
  </div>

  <div class="bottomnav">
    <div class="navitem active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </div>
    <div class="navitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span>Conversations</span>
    </div>
    <div class="navitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Contacts</span>
    </div>
  </div>

  <div class="homebar"></div>

</div>
</body>
</html>
