  WHAT THE PAGE DOES
    One card, five steps, no nav and no footer. Tapping a choice advances on
    its own, so there is no NEXT button to hunt for on a phone.
      1. Do you live in Metro Detroit?   Yes / No
      2. What best describes your home?  one story / two / three+ / condo
      3. What is your timeline?          ASAP / week / month / 3 months+
      4. Address, prefaced with why we want it
      5. Name, phone, email  ->  posted to GHL  ->  thank-you

    "No" on step 1 is an automatic disqualification. The funnel stops on a
    card, NOTHING is posted and no contact is created. Willis covers about 30
    miles of Metro Detroit, and a lead they cannot drive to burns a call slot.

  HOW TO USE IT IN GHL
  1. The funnel > this step > Custom JS/HTML element.
  2. Delete whatever is in there and paste both lines below.
  3. Set the step to full width and remove GHL's own padding.
  4. Publish, then open the page ON A PHONE. Nearly all of this traffic is
     mobile.
