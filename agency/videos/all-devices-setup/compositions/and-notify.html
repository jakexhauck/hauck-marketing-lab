          <div class="step"><div class="hl"></div><div class="num"><div class="nf"></div><span class="d">1</span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#0a1d19" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="txt">Open Hauck Marketing</div></div>
          <div class="step"><div class="hl"></div><div class="num"><div class="nf"></div><span class="d">2</span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#0a1d19" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="txt">Tap Turn on</div></div>
          <div class="step"><div class="hl"></div><div class="num"><div class="nf"></div><span class="d">3</span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#0a1d19" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="txt">Tap Allow</div></div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(s);
          const scr = q("#an-scr");
          function tap(x, y, t) {
            const f = document.createElement("div");
            f.className = "finger";
            f.style.left = x + "px";
            f.style.top = y + "px";
            const r = document.createElement("div");
            r.className = "tap";
            r.style.left = x + "px";
            r.style.top = y + "px";
            scr.appendChild(r);
            scr.appendChild(f);
            tl.fromTo(f, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, t - 0.16);
            tl.to(f, { opacity: 0, scale: 0.9, duration: 0.2, ease: "power2.in" }, t + 0.18);
            tl.fromTo(r, { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.7, duration: 0.55, ease: "power2.out", immediateRender: false }, t);
          }
          const steps = document.querySelectorAll("#an-steps .step");
          function stepOn(i, t) {
            const s = steps[i];
            tl.to(s.querySelector(".hl"), { opacity: 1, duration: 0.3, ease: "power2.out" }, t);
            tl.to(s.querySelector(".txt"), { color: "#eaf5ef", duration: 0.3 }, t);
            tl.to(s.querySelector(".num"), { borderColor: "#4dbb83", duration: 0.3 }, t);
            tl.to(s.querySelector(".d"), { color: "#4dbb83", duration: 0.3 }, t);
            tl.to(s, { x: -10, duration: 0.3, ease: "power2.out" }, t);
          }
          function stepDone(i, t) {
            const s = steps[i];
            tl.to(s.querySelector(".hl"), { opacity: 0, duration: 0.3 }, t);
            tl.to(s, { x: 0, duration: 0.3, ease: "power2.inOut" }, t);
            tl.to(s.querySelector(".nf"), { opacity: 1, duration: 0.2 }, t);
            tl.to(s.querySelector(".d"), { opacity: 0, duration: 0.15 }, t);
            tl.fromTo(s.querySelector(".num svg"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, t + 0.05);
            tl.to(s.querySelector(".txt"), { color: "#b9d3c8", duration: 0.3 }, t);
          }

          // generic round home screen apps, no brands
          const apps = ["#ffffff", "#f5a524", "#8e8e93", "#3b9bff", "#ffd23f", "#34a853", "#ea4335", "#4fb3f6", "#30c48d", "#5f6368"];
          const names = ["Calendar", "Photos", "Camera", "Mail", "Notes", "Phone", "Clock", "Weather", "Maps", "Settings"];
          const cols = [31, 119, 207, 295], rows = [140, 240, 340];
          const grid = q("#an-grid");
          apps.forEach((c, i) => {
            const x = cols[i % 4], y = rows[Math.floor(i / 4)];
            const ic = document.createElement("div");
            ic.className = "an-ic"; ic.style.left = x + "px"; ic.style.top = y + "px"; ic.style.background = c;
            const lb = document.createElement("div");
            lb.className = "icon-l"; lb.style.left = x + "px"; lb.style.top = (y + 66) + "px"; lb.textContent = names[i];
            grid.appendChild(ic); grid.appendChild(lb);
          });

          gsap.set("#an-app", { opacity: 0, scale: 0.16 });

          tl.fromTo("#an-left .hl-block > *", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.1 }, 0.15);
          tl.fromTo("#an-left .rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.4);
          tl.fromTo("#an-steps .step", { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.08 }, 0.35);

          // 1 open
          stepOn(0, 0.7);
          tl.fromTo("#an-hring", { scale: 1, opacity: 0.9 }, { scale: 1.6, opacity: 0, duration: 0.7, ease: "power2.out" }, 1.4);
          tl.fromTo("#an-hring", { scale: 1, opacity: 0.9 }, { scale: 1.6, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, 2.1);
          tap(237, 370, 2.9);
          tl.to("#an-hico", { scale: 0.9, duration: 0.1, yoyo: true, repeat: 1 }, 2.9);
          tl.to("#an-app", { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 3.05);
          tl.set("#an-home", { opacity: 0 }, 3.55);
          stepDone(0, 3.1);

          // 2 turn on
          stepOn(1, 3.7);
          tap(143, 214, 4.3);
          tl.to("#an-on", { scale: 0.96, duration: 0.09, yoyo: true, repeat: 1 }, 4.3);
          stepDone(1, 4.45);
          tl.to("#an-pdim", { opacity: 1, duration: 0.25 }, 4.55);
          tl.fromTo("#an-perm", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 4.55);

          // 3 allow
          stepOn(2, 4.75);
          tap(193, 420, 5.3);
          tl.to("#an-perm", { opacity: 0, y: 20, duration: 0.25, ease: "power2.in" }, 5.4);
          tl.to("#an-pdim", { opacity: 0, duration: 0.25 }, 5.4);
          tl.to("#an-ncard", { opacity: 0, scale: 0.94, duration: 0.3, ease: "power2.in" }, 5.65);
          tl.to(["#an-sk1", "#an-sk2"], { y: -142, duration: 0.5, ease: "power3.inOut" }, 5.8);
          stepDone(2, 5.5);

          tl.fromTo("#an-phone", { y: 0 }, { y: -8, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 6.0);
          tl.to(["#an-left", "#an-steps"], { y: -20, opacity: 0, duration: 0.45, ease: "power2.in", stagger: 0.05 }, 8.4);
          window.__timelines["and-notify"] = tl;
        })();
      </script>
