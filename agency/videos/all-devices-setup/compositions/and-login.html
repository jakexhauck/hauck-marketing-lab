      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(s);
          const scr = q("#al-scr");
          function typed(container, text, t0, dur, mask) {
            const chars = [];
            for (const ch of text) {
              const s = document.createElement("span");
              s.className = "c";
              s.textContent = mask ? "•" : ch;
              container.appendChild(s);
              chars.push(s);
            }
            chars.forEach((s, i) => tl.set(s, { display: "inline" }, t0 + (dur * i) / chars.length));
          }
          function tap(x, y, t) {
            const f = document.createElement("div");
            f.className = "finger"; f.style.left = x + "px"; f.style.top = y + "px";
            const r = document.createElement("div");
            r.className = "tap"; r.style.left = x + "px"; r.style.top = y + "px";
            scr.appendChild(r); scr.appendChild(f);
            tl.fromTo(f, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, t - 0.16);
            tl.to(f, { opacity: 0, scale: 0.9, duration: 0.2, ease: "power2.in" }, t + 0.18);
            tl.fromTo(r, { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.7, duration: 0.55, ease: "power2.out", immediateRender: false }, t);
          }
          const steps = document.querySelectorAll("#al-steps .step");
          function stepOn(i, t) {
            const s = steps[i];
            tl.to(s.querySelector(".hl"), { opacity: 1, duration: 0.3, ease: "power2.out" }, t);
            tl.to(s.querySelector(".txt"), { color: "#eaf5ef", duration: 0.3 }, t);
            tl.to(s.querySelector(".num"), { borderColor: "#4dbb83", duration: 0.3 }, t);
            tl.to(s.querySelector(".d"), { color: "#4dbb83", duration: 0.3 }, t);
            tl.to(s, { x: -10, duration: 0.3, ease: "power2.out" }, t);
          }
          function stepDone(i, t) {
            const s = steps[i];
            tl.to(s.querySelector(".hl"), { opacity: 0, duration: 0.3 }, t);
            tl.to(s, { x: 0, duration: 0.3, ease: "power2.inOut" }, t);
            tl.to(s.querySelector(".nf"), { opacity: 1, duration: 0.2 }, t);
            tl.to(s.querySelector(".d"), { opacity: 0, duration: 0.15 }, t);
            tl.fromTo(s.querySelector(".num svg"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, t + 0.05);
            tl.to(s.querySelector(".txt"), { color: "#b9d3c8", duration: 0.3 }, t);
          }
          // generic round home screen apps, no brands
          const apps = ["#ffffff", "#f5a524", "#8e8e93", "#3b9bff", "#ffd23f", "#34a853", "#ea4335", "#4fb3f6", "#30c48d", "#5f6368"];
          const names = ["Calendar", "Photos", "Camera", "Mail", "Notes", "Phone", "Clock", "Weather", "Maps", "Settings"];
          const cols = [31, 119, 207, 295], rows = [140, 240, 340];
          const grid = q("#al-grid");
          apps.forEach((c, i) => {
            const x = cols[i % 4], y = rows[Math.floor(i / 4)];
            const ic = document.createElement("div");
            ic.className = "al-ic"; ic.style.left = x + "px"; ic.style.top = y + "px"; ic.style.background = c;
            const lb = document.createElement("div");
            lb.className = "icon-l"; lb.style.left = x + "px"; lb.style.top = (y + 66) + "px"; lb.textContent = names[i];
            grid.appendChild(ic); grid.appendChild(lb);
          });
          gsap.set("#al-chrome", { opacity: 0, scale: 0.2 });

          tl.fromTo("#al-phone", { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.75, ease: "power3.out" }, 0);
          tl.fromTo("#al-left .hl-block > *", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.1 }, 0.3);
          tl.fromTo("#al-left .rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.55);
          tl.fromTo("#al-steps .step", { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.08 }, 0.5);

          // 1 open chrome
          stepOn(0, 0.9);
          tl.fromTo("#al-chring", { scale: 1, opacity: 0.9 }, { scale: 1.5, opacity: 0, duration: 0.6, ease: "power2.out" }, 1.0);
          tap(149, 710, 1.5);
          tl.to("#al-chromeic", { scale: 0.9, duration: 0.1, yoyo: true, repeat: 1 }, 1.5);
          tl.to("#al-chrome", { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 1.6);
          tl.set("#al-home", { opacity: 0 }, 2.1);
          stepDone(0, 1.8);

          // 2 type the address
          stepOn(1, 2.3);
          tap(177, 74, 2.9);
          tl.to("#al-pill .ring", { opacity: 1, duration: 0.15 }, 2.9);
          tl.to("#al-pill .ph", { opacity: 0, duration: 0.1 }, 3.0);
          typed(q("#al-pill .val"), "app.hauckmarketing.com", 3.8, 1.5, false);
          tl.fromTo("#al-addr", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 3.8);
          tl.to("#al-pill .ring", { opacity: 0, duration: 0.15 }, 5.6);
          tl.to("#al-ntp", { opacity: 0, duration: 0.3 }, 5.6);
          tl.fromTo("#al-login", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.65);
          stepDone(1, 5.85);

          // 3 sign in
          stepOn(2, 6.6);
          tap(193, 382, 7.4);
          tl.to("#al-em .fr", { opacity: 1, duration: 0.12 }, 7.4);
          tl.to("#al-em .ph", { opacity: 0, duration: 0.1 }, 7.5);
          typed(q("#al-em .val"), "you@yourcompany.com", 7.55, 0.6, false);
          tap(193, 472, 8.35);
          tl.to("#al-em .fr", { opacity: 0, duration: 0.12 }, 8.35);
          tl.to("#al-pw .fr", { opacity: 1, duration: 0.12 }, 8.35);
          tl.to("#al-pw .ph", { opacity: 0, duration: 0.1 }, 8.42);
          typed(q("#al-pw .val"), "xxxxxxxxxx", 8.45, 0.3, true);
          tl.to("#al-btn", { backgroundColor: "#4f46e5", duration: 0.25 }, 8.75);
          tap(193, 536, 9.4);
          tl.to("#al-btn", { scale: 0.96, duration: 0.09, yoyo: true, repeat: 1 }, 9.4);
          tl.to("#al-login", { opacity: 0, duration: 0.3 }, 9.7);
          tl.fromTo("#al-pagewrap", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 9.75);
          stepDone(2, 9.9);

          tl.fromTo("#al-phone", { y: 0 }, { y: -8, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 10.3);
          tl.to(["#al-left", "#al-steps", "#al-addr"], { y: -20, opacity: 0, duration: 0.45, ease: "power2.in", stagger: 0.05 }, 12.6);
          window.__timelines["and-login"] = tl;
        })();
