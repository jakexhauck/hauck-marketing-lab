      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(s);
          const scr = q("#ah-scr");
          function tap(x, y, t) {
            const f = document.createElement("div");
            f.className = "finger";
            f.style.left = x + "px";
            f.style.top = y + "px";
            const r = document.createElement("div");
            r.className = "tap";
            r.style.left = x + "px";
            r.style.top = y + "px";
            scr.appendChild(r);
            scr.appendChild(f);
            tl.fromTo(f, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, t - 0.16);
            tl.to(f, { opacity: 0, scale: 0.9, duration: 0.2, ease: "power2.in" }, t + 0.18);
            tl.fromTo(r, { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.7, duration: 0.55, ease: "power2.out", immediateRender: false }, t);
          }
          const steps = document.querySelectorAll("#ah-steps .step");
          function stepOn(i, t) {
            const s = steps[i];
            tl.to(s.querySelector(".hl"), { opacity: 1, duration: 0.3, ease: "power2.out" }, t);
            tl.to(s.querySelector(".txt"), { color: "#eaf5ef", duration: 0.3 }, t);
            tl.to(s.querySelector(".num"), { borderColor: "#4dbb83", duration: 0.3 }, t);
            tl.to(s.querySelector(".d"), { color: "#4dbb83", duration: 0.3 }, t);
            tl.to(s, { x: -10, duration: 0.3, ease: "power2.out" }, t);
          }
          function stepDone(i, t) {
            const s = steps[i];
            tl.to(s.querySelector(".hl"), { opacity: 0, duration: 0.3 }, t);
            tl.to(s, { x: 0, duration: 0.3, ease: "power2.inOut" }, t);
            tl.to(s.querySelector(".nf"), { opacity: 1, duration: 0.2 }, t);
            tl.to(s.querySelector(".d"), { opacity: 0, duration: 0.15 }, t);
            tl.fromTo(s.querySelector(".num svg"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, t + 0.05);
            tl.to(s.querySelector(".txt"), { color: "#b9d3c8", duration: 0.3 }, t);
          }

          // generic round home screen apps, no brands
          const apps = ["#ffffff", "#f5a524", "#8e8e93", "#3b9bff", "#ffd23f", "#34a853", "#ea4335", "#4fb3f6", "#30c48d", "#5f6368"];
          const names = ["Calendar", "Photos", "Camera", "Mail", "Notes", "Phone", "Clock", "Weather", "Maps", "Settings"];
          const cols = [31, 119, 207, 295], rows = [140, 240, 340];
          const grid = q("#ah-grid");
          apps.forEach((c, i) => {
            const x = cols[i % 4], y = rows[Math.floor(i / 4)];
            const ic = document.createElement("div");
            ic.className = "ah-ic"; ic.style.left = x + "px"; ic.style.top = y + "px"; ic.style.background = c;
            const lb = document.createElement("div");
            lb.className = "icon-l"; lb.style.left = x + "px"; lb.style.top = (y + 66) + "px"; lb.textContent = names[i];
            grid.appendChild(ic); grid.appendChild(lb);
          });

          gsap.set("#ah-home", { opacity: 0 });

          tl.fromTo("#ah-left .hl-block > *", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.1 }, 0.15);
          tl.fromTo("#ah-left .rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.4);
          tl.fromTo("#ah-steps .step", { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.08 }, 0.35);

          // 1 three dots
          stepOn(0, 3.6);
          tl.fromTo("#ah-dots", { scale: 1 }, { scale: 1.3, duration: 0.22, yoyo: true, repeat: 1, ease: "power2.inOut" }, 4.0);
          tap(362, 74, 4.7);
          tl.fromTo("#ah-menu", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 4.8);
          stepDone(0, 5.0);

          // 2 add to home screen
          stepOn(1, 6.3);
          tap(268, 413, 7.3);
          tl.to("#ah-ahs .hi", { opacity: 1, duration: 0.1 }, 7.3);
          tl.to("#ah-menu", { opacity: 0, duration: 0.2 }, 7.55);
          tl.to("#ah-sdim", { opacity: 1, duration: 0.25 }, 7.6);
          tl.fromTo("#ah-inst", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 7.65);
          stepDone(1, 7.6);
          tl.fromTo("#ah-note", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 8.0);

          // 3 install
          stepOn(2, 9.3);
          tap(287, 461, 10.1);
          stepDone(2, 10.3);
          tl.to("#ah-chrome", { opacity: 0, scale: 0.94, duration: 0.4, ease: "power2.in" }, 10.3);
          tl.to("#ah-home", { opacity: 1, duration: 0.4 }, 10.5);
          tl.fromTo("#ah-hico", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(2)" }, 11.0);
          tl.fromTo("#ah-hlab", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 11.3);
          tl.fromTo("#ah-hring", { scale: 1, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.8, ease: "power2.out" }, 11.25);

          tl.to(["#ah-left", "#ah-steps", "#ah-note"], { y: -20, opacity: 0, duration: 0.4, ease: "power2.in", stagger: 0.05 }, 11.9);
          window.__timelines["and-home"] = tl;
        })();
      </script>
