<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #bg-root { position: absolute; inset: 0; overflow: hidden; background: #0a1d19; }
        #bg-dots { position: absolute; left: -60px; top: -60px; width: 2040px; height: 1200px;
          background-image: radial-gradient(rgba(77, 187, 131, 0.16) 2px, transparent 2.5px); background-size: 44px 44px; }
        #bg-ga { position: absolute; width: 1200px; height: 1200px; left: 1100px; top: -620px; border-radius: 50%;
          background: radial-gradient(circle, rgba(77, 187, 131, 0.26) 0%, rgba(77, 187, 131, 0) 62%); }
        #bg-gb { position: absolute; width: 1100px; height: 1100px; left: -520px; top: 520px; border-radius: 50%;
          background: radial-gradient(circle, rgba(77, 187, 131, 0.16) 0%, rgba(77, 187, 131, 0) 62%); }
        #bg-vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(10, 29, 25, 0) 55%, rgba(5, 15, 13, 0.55) 100%); }
      </style>
      <div id="bg-root" data-layout-allow-overflow data-composition-id="bg" data-width="1920" data-height="1080">
        <div id="bg-dots"></div>
        <div id="bg-ga"></div>
        <div id="bg-gb"></div>
        <div id="bg-vig"></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const T = 89;
          // slow drift and breathe across the whole film
          tl.fromTo("#bg-dots", { x: 0, y: 0 }, { x: 44, y: 44, duration: T, ease: "none" }, 0);
          tl.fromTo("#bg-ga", { scale: 1, x: 0 }, { scale: 1.12, x: -60, duration: T / 4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
          tl.fromTo("#bg-gb", { scale: 1.08, y: 0 }, { scale: 0.96, y: -50, duration: T / 6, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);
          window.__timelines["bg"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
