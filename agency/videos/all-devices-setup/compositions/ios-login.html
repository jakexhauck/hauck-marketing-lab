      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(s);
          const scr = q("#il-scr");
          function typed(container, text, t0, dur, mask) {
            const chars = [];
            for (const ch of text) {
              const s = document.createElement("span");
              s.className = "c";
              s.textContent = mask ? "•" : ch;
              container.appendChild(s);
              chars.push(s);
            }
            chars.forEach((s, i) => tl.set(s, { display: "inline" }, t0 + (dur * i) / chars.length));
          }
          function tap(x, y, t) {
            const f = document.createElement("div");
            f.className = "finger"; f.style.left = x + "px"; f.style.top = y + "px";
            const r = document.createElement("div");
            r.className = "tap"; r.style.left = x + "px"; r.style.top = y + "px";
            scr.appendChild(r); scr.appendChild(f);
            tl.fromTo(f, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, t - 0.16);
            tl.to(f, { opacity: 0, scale: 0.9, duration: 0.2, ease: "power2.in" }, t + 0.18);
            tl.fromTo(r, { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.7, duration: 0.55, ease: "power2.out", immediateRender: false }, t);
          }
          const steps = document.querySelectorAll("#il-steps .step");
          function stepOn(i, t) {
            const s = steps[i];
            tl.to(s.querySelector(".hl"), { opacity: 1, duration: 0.3, ease: "power2.out" }, t);
            tl.to(s.querySelector(".txt"), { color: "#eaf5ef", duration: 0.3 }, t);
            tl.to(s.querySelector(".num"), { borderColor: "#4dbb83", duration: 0.3 }, t);
            tl.to(s.querySelector(".d"), { color: "#4dbb83", duration: 0.3 }, t);
            tl.to(s, { x: -10, duration: 0.3, ease: "power2.out" }, t);
          }
          function stepDone(i, t) {
            const s = steps[i];
            tl.to(s.querySelector(".hl"), { opacity: 0, duration: 0.3 }, t);
            tl.to(s, { x: 0, duration: 0.3, ease: "power2.inOut" }, t);
            tl.to(s.querySelector(".nf"), { opacity: 1, duration: 0.2 }, t);
            tl.to(s.querySelector(".d"), { opacity: 0, duration: 0.15 }, t);
            tl.fromTo(s.querySelector(".num svg"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, t + 0.05);
            tl.to(s.querySelector(".txt"), { color: "#b9d3c8", duration: 0.3 }, t);
          }
          // generic home screen apps, no brands
          const apps = [["#ffffff","Calendar"],["#f5a524","Photos"],["#8e8e93","Camera"],["#3b9bff","Mail"],["#ffd23f","Notes"],["#ff9f0a","Reminders"],["#1c1c1e","Clock"],["#4fb3f6","Weather"],["#30c48d","Maps"],["#8e8e93","Settings"]];
          const cols = [30, 117, 204, 291], rows = [80, 180, 280];
          const grid = q("#il-grid");
          apps.forEach(([c, n], i) => {
            const x = cols[i % 4], y = rows[Math.floor(i / 4)];
            const ic = document.createElement("div");
            ic.className = "icon"; ic.style.left = x + "px"; ic.style.top = y + "px"; ic.style.background = c;
            const lb = document.createElement("div");
            lb.className = "icon-l"; lb.style.left = x + "px"; lb.style.top = (y + 68) + "px"; lb.textContent = n;
            grid.appendChild(ic); grid.appendChild(lb);
          });
          gsap.set("#il-safari", { opacity: 0, scale: 0.2 });

          // establish
          tl.fromTo("#il-phone", { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.75, ease: "power3.out" }, 0);
          tl.fromTo("#il-left .hl-block > *", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.1 }, 0.3);
          tl.fromTo("#il-left .rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.55);
          tl.fromTo("#il-steps .step", { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.08 }, 0.5);

          // 1 open safari
          stepOn(0, 0.9);
          tl.fromTo("#il-safring", { scale: 1, opacity: 0.9 }, { scale: 1.5, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.95);
          tap(152, 789, 1.45);
          tl.to("#il-safariic", { scale: 0.9, duration: 0.1, yoyo: true, repeat: 1 }, 1.45);
          tl.to("#il-safari", { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 1.55);
          tl.set("#il-home", { opacity: 0 }, 2.05);
          stepDone(0, 1.75);

          // 2 type the address
          stepOn(1, 2.3);
          tap(193, 750, 3.0);
          tl.to("#il-pill .ring", { opacity: 1, duration: 0.15 }, 3.0);
          tl.to("#il-pill .ph", { opacity: 0, duration: 0.1 }, 3.1);
          typed(q("#il-pill .val"), "app.hauckmarketing.com", 3.9, 1.5, false);
          tl.fromTo("#il-addr", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 3.9);
          tl.to("#il-pill .ring", { opacity: 0, duration: 0.15 }, 5.75);
          tl.to("#il-start", { opacity: 0, duration: 0.3 }, 5.75);
          tl.fromTo("#il-login", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.8);
          stepDone(1, 6.0);

          // 3 sign in
          stepOn(2, 6.7);
          tap(193, 348, 7.6);
          tl.to("#il-em .fr", { opacity: 1, duration: 0.12 }, 7.6);
          tl.to("#il-em .ph", { opacity: 0, duration: 0.1 }, 7.7);
          typed(q("#il-em .val"), "you@yourcompany.com", 7.75, 0.6, false);
          tap(193, 438, 8.55);
          tl.to("#il-em .fr", { opacity: 0, duration: 0.12 }, 8.55);
          tl.to("#il-pw .fr", { opacity: 1, duration: 0.12 }, 8.55);
          tl.to("#il-pw .ph", { opacity: 0, duration: 0.1 }, 8.62);
          typed(q("#il-pw .val"), "xxxxxxxxxx", 8.65, 0.3, true);
          tl.to("#il-btn", { backgroundColor: "#4f46e5", duration: 0.25 }, 8.95);
          tap(193, 502, 9.6);
          tl.to("#il-btn", { scale: 0.96, duration: 0.09, yoyo: true, repeat: 1 }, 9.6);
          tl.to("#il-login", { opacity: 0, duration: 0.3 }, 9.9);
          tl.fromTo("#il-app", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 9.95);
          stepDone(2, 10.1);

          tl.fromTo("#il-phone", { y: 0 }, { y: -8, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 10.5);
          // side copy clears; the phone stays for the next step
          tl.to(["#il-left", "#il-steps", "#il-addr"], { y: -20, opacity: 0, duration: 0.45, ease: "power2.in", stagger: 0.05 }, 12.9);
          window.__timelines["ios-login"] = tl;
        })();
