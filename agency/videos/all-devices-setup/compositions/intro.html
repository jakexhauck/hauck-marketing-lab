<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #in1-root { position: absolute; inset: 0; font-family: Inter, sans-serif; }
        #in1-stack { position: absolute; left: 0; right: 0; top: 150px; display: flex; flex-direction: column; align-items: center; }
        #in1-iconwrap { position: relative; width: 200px; height: 200px; }
        #in1-ring { position: absolute; left: -40px; top: -40px; width: 280px; height: 280px; border-radius: 50%; border: 3px solid #4dbb83; opacity: 0; }
        #in1-icon { position: absolute; inset: 0; border-radius: 46px; overflow: hidden; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45), 0 0 0 2px rgba(77, 187, 131, 0.45); }
        #in1-icon img { width: 100%; height: 100%; display: block; }
        #in1-title { margin-top: 64px; font: 700 104px/1 Poppins, sans-serif; color: #eaf5ef; letter-spacing: -0.015em; display: flex; gap: 28px; }
        #in1-title .w { display: block; }
        #in1-title .g { color: #4dbb83; }
        #in1-sub { margin-top: 22px; font: 700 104px/1 Poppins, sans-serif; color: #eaf5ef; letter-spacing: -0.015em; display: flex; gap: 28px; }
        #in1-sub .g { color: #4dbb83; }
        .in1-dev { display: flex; align-items: center; gap: 14px; height: 64px; padding: 0 26px; border-radius: 32px;
          border: 2px solid rgba(77, 187, 131, 0.4); background: rgba(16, 48, 42, 0.7); font: 700 26px Inter, sans-serif; color: #eaf5ef; }
        .in1-dev svg { width: 30px; height: 30px; }
      </style>
      <div id="in1-root" data-composition-id="intro" data-width="1920" data-height="1080">
        <div id="in1-stack">
          <div id="in1-iconwrap">
            <div id="in1-ring"></div>
            <div id="in1-icon"><img src="assets/hauck-icon.png" alt="" /></div>
          </div>
          <div id="in1-title"><span class="w">Hauck</span><span class="w">Marketing</span><span class="w">software</span></div>
          <div id="in1-sub"><span class="w">on</span><span class="w">every</span><span class="w g">device.</span></div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        // icon lands with a soft spring, a ring blooms out of it
        tl.fromTo("#in1-icon", { scale: 0.55, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.9, ease: "back.out(1.7)" }, 0.15);
        tl.fromTo("#in1-ring", { scale: 0.7, opacity: 0.9 }, { scale: 1.35, opacity: 0, duration: 1.1, ease: "power2.out" }, 0.5);
        // headline words rise in sequence
        tl.fromTo("#in1-title .w", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out", stagger: 0.12 }, 0.75);
        tl.fromTo("#in1-sub .w", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out", stagger: 0.12 }, 1.5);
        // a slow settle so the hold never freezes
        tl.fromTo("#in1-stack", { scale: 1 }, { scale: 1.025, duration: 7.5, ease: "sine.inOut" }, 0.5);
        // exit: lift and clear before the first chapter
        tl.to("#in1-stack", { y: -60, opacity: 0, duration: 0.5, ease: "power2.in" }, 8.0);
        window.__timelines["intro"] = tl;
      </script>
    </template>
  </body>
</html>
