<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s6-root { position: absolute; inset: 0; font-family: Inter, sans-serif; }
        #s6-lock { background: radial-gradient(120% 80% at 30% 0%, #2f6b5f 0%, #163c47 45%, #0c1f2b 100%); }
        #s6-date { position: absolute; left: 0; right: 0; top: 78px; text-align: center; font: 700 19px Inter, sans-serif; color: rgba(255, 255, 255, 0.9); }
        #s6-time { position: absolute; left: 0; right: 0; top: 102px; text-align: center; font: 700 96px/1 Inter, sans-serif; color: #fff; letter-spacing: -0.02em; }
        .s6-n { position: absolute; left: 12px; top: 300px; width: 362px; height: 78px; border-radius: 22px; background: rgba(245, 247, 246, 0.86);
          box-shadow: 0 8px 22px rgba(0, 0, 0, 0.18); opacity: 0; }
        .s6-n .ic { position: absolute; left: 12px; top: 17px; width: 42px; height: 42px; border-radius: 10px; overflow: hidden; }
        .s6-n .ic img { width: 100%; height: 100%; display: block; }
        .s6-n .ti { position: absolute; left: 66px; top: 15px; font: 700 15px Inter, sans-serif; color: #111; }
        .s6-n .bd { position: absolute; left: 66px; top: 40px; right: 14px; font: 400 14px Inter, sans-serif; color: #333; white-space: nowrap; overflow: hidden; }
        .s6-n .tm { position: absolute; right: 16px; top: 16px; font: 400 13px Inter, sans-serif; color: #6c6c72; }
        #s6-lockbar { position: absolute; left: 126px; bottom: 10px; width: 134px; height: 5px; border-radius: 3px; background: #fff; }
        #s6-left .headline { font-size: 76px; }
      </style>
      <div id="s6-root" data-composition-id="s6" data-width="1920" data-height="1080">
        <div class="h-left" id="s6-left">
          <div class="hl-block"><div class="kicker">You're set up</div><div class="headline">Never miss a lead.</div><div class="rule"></div></div>
        </div>
        <div class="phone" id="s6-phone"><div class="screen" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="island"></div>
          <div class="layer" id="s6-lock">
            <div class="statusbar light"><span></span><span class="sb-r"><i class="sig"></i><i class="bat"></i></span></div>
            <div id="s6-date">Friday, October 10</div>
            <div id="s6-time">9:41</div>
            <div class="s6-n" id="s6-n1"><div class="ic"><img src="assets/hauck-icon.png" alt="" /></div><div class="ti">New lead</div><div class="bd">Sarah Miller</div><div class="tm">now</div></div>
            <div class="s6-n" id="s6-n2"><div class="ic"><img src="assets/hauck-icon.png" alt="" /></div><div class="ti">New message</div><div class="bd">Sarah Miller: Is Thursday still open?</div><div class="tm">now</div></div>
            <div class="s6-n" id="s6-n3"><div class="ic"><img src="assets/hauck-icon.png" alt="" /></div><div class="ti">Appointment booked</div><div class="bd">Sarah Miller, Thursday 10:00 AM</div><div class="tm">now</div></div>
            <div id="s6-lockbar"></div>
          </div>
        </div></div>

        <audio id="s6-a1" src="assets/sfx/notification.mp3" data-start="1.8" data-duration="1.2" data-track-index="21" data-volume="0.32"></audio>
        <audio id="s6-a2" src="assets/sfx/notification.mp3" data-start="2.55" data-duration="1.2" data-track-index="22" data-volume="0.32"></audio>
        <audio id="s6-a3" src="assets/sfx/notification.mp3" data-start="3.55" data-duration="1.2" data-track-index="21" data-volume="0.32"></audio>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const slot = 88;
          // held frame: the lock screen arrives and sits still while the line starts
          tl.fromTo("#s6-phone", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 0);
          tl.to("#s6-phone", { scale: 1.035, duration: 7, ease: "sine.inOut" }, 0.8);

          // newest on top, older ones slide down a slot
          const arrive = [1.8, 2.55, 3.55];
          const ids = ["#s6-n1", "#s6-n2", "#s6-n3"];
          ids.forEach((id, i) => {
            tl.fromTo(id, { y: -36, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, arrive[i]);
            for (let j = 0; j < i; j++) {
              tl.to(ids[j], { y: slot * (i - j), duration: 0.45, ease: "power3.out" }, arrive[i]);
            }
          });

          tl.fromTo("#s6-left .hl-block > *", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.1 }, 4.3);
          tl.fromTo("#s6-left .rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 4.55);

          tl.to(["#s6-phone", "#s6-left"], { opacity: 0, duration: 0.5, ease: "power2.in" }, 7.95);
          window.__timelines["s6"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
