      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(s);
          const scr = q("#s3-scr");
          function typed(container, text, t0, dur, mask) {
            const chars = [];
            for (const ch of text) {
              const s = document.createElement("span");
              s.className = "c";
              s.textContent = mask ? "•" : ch;
              container.appendChild(s);
              chars.push(s);
            }
            chars.forEach((s, i) => tl.set(s, { display: "inline" }, t0 + (dur * i) / chars.length));
          }
          // a finger press: dot lands, ring blooms, dot lifts
          function tap(x, y, t) {
            const f = document.createElement("div");
            f.className = "finger";
            f.style.left = x + "px";
            f.style.top = y + "px";
            const r = document.createElement("div");
            r.className = "tap";
            r.style.left = x + "px";
            r.style.top = y + "px";
            scr.appendChild(r);
            scr.appendChild(f);
            tl.fromTo(f, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, t - 0.16);
            tl.to(f, { opacity: 0, scale: 0.9, duration: 0.2, ease: "power2.in" }, t + 0.18);
            tl.fromTo(r, { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.7, duration: 0.55, ease: "power2.out", immediateRender: false }, t);
          }

          tl.fromTo("#s3-phone", { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.75, ease: "power3.out" }, 0);
          tl.fromTo("#s3-phone", { y: 0 }, { y: -8, duration: 4.5, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 0.8);
          tl.fromTo("#s3-bl", { x: -40, opacity: 0, scale: 0.96 }, { x: 0, opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.4)" }, 1.7);
          tl.fromTo("#s3-br", { x: 40, opacity: 0, scale: 0.96 }, { x: 0, opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.4)" }, 3.4);

          // same address
          tap(193, 753, 4.9);
          tl.to("#s3-pill .ring", { opacity: 1, duration: 0.15 }, 4.9);
          tl.to("#s3-pill .ph", { opacity: 0, duration: 0.1 }, 5.0);
          typed(q("#s3-pill .val"), "app.hauckmarketing.com", 5.1, 1.0, false);
          tl.to("#s3-pill .ring", { opacity: 0, duration: 0.15 }, 6.2);
          tl.to("#s3-start", { opacity: 0, duration: 0.3 }, 6.2);
          tl.fromTo("#s3-login", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 6.25);

          // same login
          tap(193, 348, 6.8);
          tl.to("#s3-em .fr", { opacity: 1, duration: 0.12 }, 6.8);
          tl.to("#s3-em .ph", { opacity: 0, duration: 0.1 }, 6.9);
          typed(q("#s3-em .val"), "you@yourcompany.com", 6.95, 0.55, false);
          tap(193, 438, 7.6);
          tl.to("#s3-em .fr", { opacity: 0, duration: 0.12 }, 7.6);
          tl.to("#s3-pw .fr", { opacity: 1, duration: 0.12 }, 7.6);
          tl.to("#s3-pw .ph", { opacity: 0, duration: 0.1 }, 7.68);
          typed(q("#s3-pw .val"), "xxxxxxxxxx", 7.7, 0.3, true);
          tl.to("#s3-btn", { backgroundColor: "#4f46e5", duration: 0.25 }, 8.0);
          tap(193, 502, 8.35);
          tl.to("#s3-btn", { scale: 0.96, duration: 0.09, yoyo: true, repeat: 1 }, 8.35);
          tl.to("#s3-login", { opacity: 0, duration: 0.3 }, 8.65);
          tl.fromTo("#s3-app", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 8.7);

          // exit
          tl.to(["#s3-phone", "#s3-bl", "#s3-br"], { x: -320, opacity: 0, duration: 0.5, ease: "power2.in", stagger: 0.04 }, 9.4);
          window.__timelines["s3"] = tl;
        })();
