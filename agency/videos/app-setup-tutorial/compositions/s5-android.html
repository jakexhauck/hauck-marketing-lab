      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(s);
          const scr = q("#s5-scr");
          function tap(x, y, t) {
            const f = document.createElement("div");
            f.className = "finger";
            f.style.left = x + "px";
            f.style.top = y + "px";
            const r = document.createElement("div");
            r.className = "tap";
            r.style.left = x + "px";
            r.style.top = y + "px";
            scr.appendChild(r);
            scr.appendChild(f);
            tl.fromTo(f, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, t - 0.16);
            tl.to(f, { opacity: 0, scale: 0.9, duration: 0.2, ease: "power2.in" }, t + 0.18);
            tl.fromTo(r, { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.7, duration: 0.55, ease: "power2.out", immediateRender: false }, t);
          }

            tl.to(s, { x: -10, duration: 0.3, ease: "power2.out" }, t);
          }
          function stepDone(i, t) {
            const s = steps[i];
            tl.to(s.querySelector(".hl"), { opacity: 0, duration: 0.3 }, t);
            tl.to(s, { x: 0, duration: 0.3, ease: "power2.inOut" }, t);
            tl.to(s.querySelector(".nf"), { opacity: 1, duration: 0.2 }, t);
            tl.to(s.querySelector(".d"), { opacity: 0, duration: 0.15 }, t);
            tl.fromTo(s.querySelector(".num svg"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, t + 0.05);
            tl.to(s.querySelector(".txt"), { color: "#b9d3c8", duration: 0.3 }, t);
          }

          // generic round home screen apps, no brands
          const apps = ["#ffffff", "#f5a524", "#8e8e93", "#3b9bff", "#ffd23f", "#34a853", "#ea4335", "#4fb3f6", "#30c48d", "#5f6368"];
          const names = ["Calendar", "Photos", "Camera", "Mail", "Notes", "Phone", "Clock", "Weather", "Maps", "Settings"];
          const cols = [31, 119, 207, 295], rows = [140, 240, 340];
          const grid = q("#s5-grid");
          apps.forEach((c, i) => {
            const x = cols[i % 4], y = rows[Math.floor(i / 4)];
            const ic = document.createElement("div");
            ic.className = "s5-ic"; ic.style.left = x + "px"; ic.style.top = y + "px"; ic.style.background = c;
            const lb = document.createElement("div");
            lb.className = "icon-l"; lb.style.left = x + "px"; lb.style.top = (y + 66) + "px"; lb.textContent = names[i];
            grid.appendChild(ic); grid.appendChild(lb);
          });

          gsap.set("#s5-home", { opacity: 0 });
          gsap.set("#s5-app", { opacity: 0, scale: 0.16 });

          // establish
          tl.fromTo("#s5-phone", { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.75, ease: "power3.out" }, 0);
          tl.fromTo("#s5-h1 > *", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.1 }, 0.35);
          tl.fromTo("#s5-h1 .rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.6);
          tl.fromTo("#s5-steps .step", { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.07 }, 0.6);

          // 1 three dots
          stepOn(0, 1.9);
          tap(362, 74, 2.5);
          tl.fromTo("#s5-menu", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 2.6);
          stepDone(0, 2.8);

          // 2 add to home screen
          stepOn(1, 4.2);
          tap(268, 413, 4.9);
          tl.to("#s5-ahs .hi", { opacity: 1, duration: 0.1 }, 4.9);
          tl.to("#s5-menu", { opacity: 0, duration: 0.2 }, 5.15);
          tl.to("#s5-sdim", { opacity: 1, duration: 0.25 }, 5.2);
          tl.fromTo("#s5-inst", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 5.25);
          stepDone(1, 5.2);
          tl.fromTo("#s5-note", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 5.9);

          // 3 install

          tap(287, 461, 7.9);
          stepDone(2, 8.1);

          tl.to("#s5-home", { opacity: 1, duration: 0.4 }, 8.3);
          tl.fromTo("#s5-hico", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(2)" }, 8.8);
          tl.fromTo("#s5-hlab", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 9.1);
          tl.fromTo("#s5-hring", { scale: 1, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.8, ease: "power2.out" }, 9.05);
          tl.to("#s5-note", { y: -10, opacity: 0, duration: 0.35, ease: "power2.in" }, 10.4);

          // headline swaps
          tl.to("#s5-h1", { y: -30, opacity: 0, duration: 0.4, ease: "power2.in" }, 10.9);
          tl.fromTo("#s5-h2", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 11.2);
          tl.fromTo("#s5-h2 .rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 11.35);

          // 4 open
          stepOn(3, 10.9);
          tap(237, 370, 11.4);
          tl.to("#s5-hico", { scale: 0.9, duration: 0.1, yoyo: true, repeat: 1 }, 11.4);
          tl.to("#s5-app", { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 11.55);
          stepDone(3, 11.6);
          tl.set("#s5-home", { opacity: 0 }, 12.05);

          // 5 turn on
          stepOn(4, 12.6);
          tap(143, 214, 13.3);
          tl.to("#s5-on", { scale: 0.96, duration: 0.09, yoyo: true, repeat: 1 }, 13.3);
          stepDone(4, 13.45);
          tl.to("#s5-pdim", { opacity: 1, duration: 0.25 }, 13.5);
