        (function () {
          const tl = gsap.timeline({ paused: true });

          // build typed text as hidden chars so every frame is seekable
          function typed(container, text, t0, dur, mask) {
            const chars = [];
            for (const ch of text) {
              const s = document.createElement("span");
              s.className = "c";
              s.textContent = mask ? "•" : ch;
              container.appendChild(s);
              chars.push(s);
            }
            chars.forEach((s, i) => tl.set(s, { display: "inline" }, t0 + (dur * i) / chars.length));
            return chars;
          }
          function caret(container) {
            const c = document.createElement("span");
            c.className = "s2-caret";
            container.appendChild(c);
            return c;
          }
          function ring(x, y, t) {
            const r = document.createElement("div");
            r.className = "s2-ring";
            r.style.left = x + "px";
            r.style.top = y + "px";
            br.appendChild(r);
            tl.fromTo(r, { scale: 0.4, opacity: 0.95 }, { scale: 1.7, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, t);
          }
          function click(x, y, t) {
            tl.fromTo("#s2-cur", { scale: 1 }, { scale: 0.82, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut", immediateRender: false }, t);
            ring(x, y, t);
          }
          // camera: origin 0 0, so x/y = target - s * point
          function cam(t, s, x, y, d) {

          }

          // establish: laptop slides in from the right

          gsap.set("#s2-cam", { scale: 1, x: 0, y: 0 });

          // address bar: caret blinks, cursor clicks, the address types in
          const urlBox = q("#s2-urltext");
          typed(urlBox, "app.hauckmarketing.com", 2.3, 2.2, false);
          const uc = caret(urlBox);
          tl.fromTo(uc, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.9);
          tl.to(uc, { opacity: 0, duration: 0.25, yoyo: true, repeat: 3, ease: "steps(1)" }, 0.95);
          tl.set(uc, { opacity: 1 }, 2.25);
          tl.set(uc, { opacity: 0 }, 4.75);
          cam(1.2, 2.1, -1037, 102);
          tl.fromTo("#s2-cur", { x: 820, y: 360, opacity: 0 }, { x: 640, y: 66, opacity: 1, duration: 0.65, ease: "power2.inOut" }, 1.4);

          tl.to("#s2-url .ring", { opacity: 1, duration: 0.15 }, 2.05);
          tl.to("#s2-cur", { x: 700, y: 120, opacity: 0, duration: 0.4, ease: "power2.in" }, 2.3);

          // enter: the login page loads
          tl.to("#s2-url .ring", { opacity: 0, duration: 0.2 }, 4.8);
          tl.to("#s2-lock", { opacity: 1, duration: 0.2 }, 4.85);
          tl.to("#s2-newtab", { opacity: 0, duration: 0.3 }, 4.85);
          tl.fromTo("#s2-login", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 4.9);
          tl.to("#s2-tt1", { opacity: 0, duration: 0.2 }, 4.9);
          tl.to("#s2-tt2", { opacity: 1, duration: 0.2 }, 5.0);
          cam(4.95, 1, 0, 0, 0.9);

          // sign in: push onto the card
          cam(6.4, 1.65, -1099, -335, 0.9);
          tl.fromTo("#s2-cur", { x: 1180, y: 560, opacity: 0 }, { x: 965, y: 392, opacity: 1, duration: 0.55, ease: "power2.inOut", immediateRender: false }, 6.95);
          click(960, 388, 7.5);
          tl.to("#s2-em .fr", { opacity: 1, duration: 0.15 }, 7.5);
          tl.to("#s2-em .ph", { opacity: 0, duration: 0.1 }, 7.65);
          typed(q("#s2-em .val"), "you@yourcompany.com", 7.7, 0.8, false);
          tl.to("#s2-cur", { y: 474, duration: 0.35, ease: "power2.inOut" }, 8.55);
          click(960, 470, 8.9);
          tl.to("#s2-em .fr", { opacity: 0, duration: 0.15 }, 8.9);
          tl.to("#s2-pw .fr", { opacity: 1, duration: 0.15 }, 8.9);
          tl.to("#s2-pw .ph", { opacity: 0, duration: 0.1 }, 8.98);
          typed(q("#s2-pw .val"), "xxxxxxxxxx", 9.0, 0.5, true);
          tl.to("#s2-btn", { backgroundColor: "#4f46e5", duration: 0.3 }, 9.45);
          tl.to("#s2-cur", { y: 534, duration: 0.3, ease: "power2.inOut" }, 9.55);
          click(960, 530, 9.9);
          tl.to("#s2-btn", { scale: 0.96, duration: 0.09, yoyo: true, repeat: 1, ease: "power1.inOut" }, 9.9);

          // signed in: the app opens, camera pulls back
          tl.to("#s2-login", { opacity: 0, duration: 0.35 }, 10.25);
          tl.fromTo("#s2-dash", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 10.3);
          tl.to("#s2-cur", { opacity: 0, duration: 0.2 }, 10.3);
          cam(10.3, 1, 0, 0, 0.85);

          tl.fromTo("#s2-cur", { x: 1020, y: 200, opacity: 0 }, { x: 1098, y: 66, opacity: 1, duration: 0.5, ease: "power2.inOut", immediateRender: false }, 11.65);
          click(1098, 64, 12.25);
