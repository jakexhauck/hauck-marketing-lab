      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0a1d19; }
      #main { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0a1d19; font-family: Inter, sans-serif; color: #eaf5ef; }

      /* ---------- shared scene parts (used by every sub-composition) ---------- */
      .scene { position: absolute; inset: 0; font-family: Inter, sans-serif; }
      .h-left { position: absolute; left: 120px; top: 170px; width: 540px; height: 600px; }
      .hl-block { position: absolute; left: 0; top: 0; width: 540px; height: 600px; display: flex; flex-direction: column; justify-content: center; }
      .kicker { font: 700 22px Inter, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #4dbb83; margin-bottom: 20px; }
      .headline { font: 700 66px/1.08 Poppins, sans-serif; color: #eaf5ef; letter-spacing: -0.01em; }
      .rule { width: 120px; height: 6px; border-radius: 3px; background: #4dbb83; margin-top: 34px; transform-origin: 0 50%; }

      .steps { position: absolute; left: 1290px; top: 170px; width: 530px; display: flex; flex-direction: column; gap: 14px; }
      .step { position: relative; display: flex; align-items: center; gap: 20px; height: 84px; padding: 0 24px; border-radius: 20px;
        border: 2px solid rgba(234, 245, 239, 0.10); background: rgba(16, 48, 42, 0.55); }
      .step .hl { position: absolute; inset: -2px; border-radius: 20px; border: 2px solid #4dbb83; background: rgba(77, 187, 131, 0.14); opacity: 0; }
      .step .num { position: relative; flex: none; width: 48px; height: 48px; border-radius: 50%; border: 2px solid rgba(143, 179, 164, 0.5);
        display: flex; align-items: center; justify-content: center; font: 700 22px Inter, sans-serif; color: #8fb3a4; }
      .step .num .nf { position: absolute; inset: -2px; border-radius: 50%; background: #4dbb83; opacity: 0; }
      .step .num svg { position: absolute; left: 11px; top: 11px; width: 22px; height: 22px; opacity: 0; }
      .step .num .d { position: relative; }
      .step .txt { position: relative; font: 700 29px Inter, sans-serif; color: #8fb3a4; }

      .callout { position: absolute; padding: 22px 28px; border-radius: 22px; background: #10302a; border: 2px solid rgba(77, 187, 131, 0.5);
        color: #eaf5ef; font: 700 28px/1.3 Inter, sans-serif; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35); }
      .callout b { color: #4dbb83; }

      .phone { position: absolute; left: 755px; top: 36px; width: 410px; height: 860px; border-radius: 66px; padding: 12px;
        background: linear-gradient(160deg, #26352f, #121a18); box-shadow: 0 50px 90px rgba(0, 0, 0, 0.5), inset 0 0 0 2px #3a5750; }
      .phone .screen { position: relative; width: 386px; height: 836px; border-radius: 54px; overflow: hidden; background: #ffffff; }
      .phone .island { position: absolute; top: 11px; left: 131px; width: 124px; height: 36px; border-radius: 20px; background: #000; z-index: 50; }
      .phone.android { border-radius: 50px; }
      .phone.android .screen { border-radius: 38px; }
      .phone .punch { position: absolute; top: 14px; left: 184px; width: 18px; height: 18px; border-radius: 50%; background: #000; z-index: 50; }
      .statusbar { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; justify-content: space-between; align-items: center;
        padding: 0 36px 0 46px; font: 700 16px Inter, sans-serif; color: #111; z-index: 40; }
      .statusbar.light { color: #fff; }
      .statusbar .sb-r { display: flex; gap: 6px; align-items: center; }
      .statusbar .bat { width: 26px; height: 13px; border-radius: 4px; border: 2px solid currentColor; position: relative; }
      .statusbar .bat::after { content: ""; position: absolute; left: 2px; top: 2px; width: 15px; height: 5px; border-radius: 1px; background: currentColor; }
      .statusbar .sig { width: 18px; height: 12px; background: linear-gradient(90deg, currentColor 0 22%, transparent 22% 26%, currentColor 26% 48%, transparent 48% 52%, currentColor 52% 74%, transparent 74% 78%, currentColor 78%);
        clip-path: polygon(0 100%, 100% 0, 100% 100%); }
      .layer { position: absolute; inset: 0; }

      .tap { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 4px solid #4dbb83; opacity: 0; z-index: 90; }
      .finger { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(77, 187, 131, 0.38);
        border: 3px solid rgba(255, 255, 255, 0.95); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3); opacity: 0; z-index: 91; }

      /* the client app (rebuilt from NotificationPrompt.tsx, no client data) */
      .app { position: absolute; inset: 0; background: #f6f7fb; }
      .app-top { position: absolute; left: 0; right: 0; top: 54px; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 22px; }
      .app-top .logo { width: 36px; height: 36px; border-radius: 10px; background: #4f46e5; }
      .app-top .t { font: 700 24px Poppins, sans-serif; color: #14161f; }
      .ncard { position: absolute; left: 22px; right: 22px; top: 136px; border-radius: 18px; border: 1px solid #e3e5ee; background: #fff; padding: 16px;
        box-shadow: 0 6px 18px rgba(20, 22, 31, 0.06); }
      .ncard .row { display: flex; align-items: center; gap: 12px; }
      .ncard .bell { width: 38px; height: 38px; border-radius: 12px; background: #4f46e5; display: flex; align-items: center; justify-content: center; }
      .ncard .ttl { font: 700 15px Poppins, sans-serif; color: #14161f; }
      .ncard .btns { display: flex; gap: 8px; margin-top: 12px; }
      .ncard .on { flex: 1; height: 44px; border-radius: 12px; background: #4f46e5; color: #fff; font: 700 14px Inter, sans-serif; display: flex; align-items: center; justify-content: center; }
      .ncard .off { height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #e3e5ee; color: #3f4350; font: 700 14px Inter, sans-serif; display: flex; align-items: center; justify-content: center; }
      .sk { position: absolute; left: 22px; right: 22px; border-radius: 18px; background: #fff; border: 1px solid #e9ebf2; }
      .sk i { position: absolute; left: 18px; height: 12px; border-radius: 6px; background: #e8eaf2; }

      .wall { position: absolute; inset: 0; background: radial-gradient(120% 80% at 20% 0%, #2f6b5f 0%, #163c47 45%, #0c1f2b 100%); }
      .icon { position: absolute; width: 62px; height: 62px; border-radius: 16px; }
      .icon-l { position: absolute; width: 90px; margin-left: -14px; text-align: center; font: 600 12px Inter, sans-serif; color: #fff; }
      .hicon { position: absolute; width: 62px; height: 62px; border-radius: 16px; overflow: hidden; box-shadow: 0 0 0 1px rgba(77, 187, 131, 0.35); }
