          <div class="step"><div class="hl"></div><div class="num"><div class="nf"></div><span class="d">3</span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#0a1d19" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="txt">Tap Allow</div></div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(s);
          const scr = q("#in-scr");
          function tap(x, y, t) {
            const f = document.createElement("div");
            f.className = "finger";
            f.style.left = x + "px";
            f.style.top = y + "px";
            const r = document.createElement("div");
            r.className = "tap";
            r.style.left = x + "px";
            r.style.top = y + "px";
            scr.appendChild(r);
            scr.appendChild(f);
            tl.fromTo(f, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, t - 0.16);
            tl.to(f, { opacity: 0, scale: 0.9, duration: 0.2, ease: "power2.in" }, t + 0.18);
            tl.fromTo(r, { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.7, duration: 0.55, ease: "power2.out", immediateRender: false }, t);
          }
          const steps = document.querySelectorAll("#in-steps .step");
          function stepOn(i, t) {
            const s = steps[i];
            tl.to(s.querySelector(".hl"), { opacity: 1, duration: 0.3, ease: "power2.out" }, t);
            tl.to(s.querySelector(".txt"), { color: "#eaf5ef", duration: 0.3 }, t);
            tl.to(s.querySelector(".num"), { borderColor: "#4dbb83", duration: 0.3 }, t);
            tl.to(s.querySelector(".d"), { color: "#4dbb83", duration: 0.3 }, t);
            tl.to(s, { x: -10, duration: 0.3, ease: "power2.out" }, t);
          }
          function stepDone(i, t) {
            const s = steps[i];
            tl.to(s.querySelector(".hl"), { opacity: 0, duration: 0.3 }, t);
            tl.to(s, { x: 0, duration: 0.3, ease: "power2.inOut" }, t);
            tl.to(s.querySelector(".nf"), { opacity: 1, duration: 0.2 }, t);
            tl.to(s.querySelector(".d"), { opacity: 0, duration: 0.15 }, t);
            tl.fromTo(s.querySelector(".num svg"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, t + 0.05);
            tl.to(s.querySelector(".txt"), { color: "#b9d3c8", duration: 0.3 }, t);
          }

          // generic home screen apps, no brands
          const apps = [["#ffffff","Calendar"],["#f5a524","Photos"],["#8e8e93","Camera"],["#3b9bff","Mail"],["#ffd23f","Notes"],["#ff9f0a","Reminders"],["#1c1c1e","Clock"],["#4fb3f6","Weather"],["#30c48d","Maps"],["#8e8e93","Settings"]];
          const cols = [30, 117, 204, 291], rows = [80, 180, 280];
          const grid = q("#in-grid");
          apps.forEach(([c, n], i) => {
            const x = cols[i % 4], y = rows[Math.floor(i / 4)];
            const ic = document.createElement("div");
            ic.className = "icon"; ic.style.left = x + "px"; ic.style.top = y + "px"; ic.style.background = c;
            const lb = document.createElement("div");
            lb.className = "icon-l"; lb.style.left = x + "px"; lb.style.top = (y + 68) + "px"; lb.textContent = n;
            grid.appendChild(ic); grid.appendChild(lb);
          });
          const dock = q("#in-dockicons");
          ["#34c759", "#3b9bff", "#30d158", "#ff375f"].forEach((c, i) => {
            const ic = document.createElement("div");
            ic.className = "icon"; ic.style.left = (34 + i * 87) + "px"; ic.style.top = "758px"; ic.style.background = c;
            dock.appendChild(ic);
          });

          gsap.set("#in-app", { opacity: 0, scale: 0.16 });

          tl.fromTo("#in-left .hl-block > *", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.1 }, 0.15);
          tl.fromTo("#in-left .rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.4);
          tl.fromTo("#in-steps .step", { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.08 }, 0.35);

          // 1 open the app from the home screen
          stepOn(0, 0.7);
          tl.fromTo("#in-hring", { scale: 1, opacity: 0.9 }, { scale: 1.6, opacity: 0, duration: 0.7, ease: "power2.out" }, 1.4);
          tl.fromTo("#in-hring", { scale: 1, opacity: 0.9 }, { scale: 1.6, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, 2.3);
          tap(235, 311, 3.3);
          tl.to("#in-hico", { scale: 0.9, duration: 0.1, yoyo: true, repeat: 1 }, 3.3);
          tl.to("#in-app", { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 3.45);
          tl.set("#in-home", { opacity: 0 }, 3.95);
          stepDone(0, 3.5);

          // 2 turn on
          stepOn(1, 4.0);
          tap(143, 224, 4.6);
          tl.to("#in-on", { scale: 0.96, duration: 0.09, yoyo: true, repeat: 1 }, 4.6);
          stepDone(1, 4.8);
          tl.to("#in-adim", { opacity: 1, duration: 0.25 }, 4.85);
          tl.fromTo("#in-alert", { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 4.85);

          // 3 allow
          stepOn(2, 5.1);
          tap(260, 460, 5.7);
          tl.to("#in-alert", { opacity: 0, scale: 0.96, duration: 0.2, ease: "power2.in" }, 5.8);
          tl.to("#in-adim", { opacity: 0, duration: 0.25 }, 5.8);
          tl.to("#in-ncard", { opacity: 0, scale: 0.94, duration: 0.3, ease: "power2.in" }, 6.05);
          tl.to(["#in-sk1", "#in-sk2"], { y: -142, duration: 0.5, ease: "power3.inOut" }, 6.2);
          stepDone(2, 5.9);

          // the iPhone rule
          tl.fromTo("#in-note2", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 6.4);
          tl.fromTo("#in-phone", { y: 0 }, { y: -10, duration: 3.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 6.6);

          tl.to(["#in-left", "#in-steps", "#in-note2"], { y: -20, opacity: 0, duration: 0.45, ease: "power2.in", stagger: 0.05 }, 13.9);
          window.__timelines["ios-notify"] = tl;
        })();
      </script>
