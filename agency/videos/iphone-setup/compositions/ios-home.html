      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(s);
          const scr = q("#ih-scr");
          function tap(x, y, t) {
            const f = document.createElement("div");
            f.className = "finger";
            f.style.left = x + "px";
            f.style.top = y + "px";
            const r = document.createElement("div");
            r.className = "tap";
            r.style.left = x + "px";
            r.style.top = y + "px";
            scr.appendChild(r);
            scr.appendChild(f);
            tl.fromTo(f, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, t - 0.16);
            tl.to(f, { opacity: 0, scale: 0.9, duration: 0.2, ease: "power2.in" }, t + 0.18);
            tl.fromTo(r, { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.7, duration: 0.55, ease: "power2.out", immediateRender: false }, t);
          }
          const steps = document.querySelectorAll("#ih-steps .step");
          function stepOn(i, t) {
            const s = steps[i];
            tl.to(s.querySelector(".hl"), { opacity: 1, duration: 0.3, ease: "power2.out" }, t);
            tl.to(s.querySelector(".txt"), { color: "#eaf5ef", duration: 0.3 }, t);
            tl.to(s.querySelector(".num"), { borderColor: "#4dbb83", duration: 0.3 }, t);
            tl.to(s.querySelector(".d"), { color: "#4dbb83", duration: 0.3 }, t);
            tl.to(s, { x: -10, duration: 0.3, ease: "power2.out" }, t);
          }
          function stepDone(i, t) {
            const s = steps[i];
            tl.to(s.querySelector(".hl"), { opacity: 0, duration: 0.3 }, t);
            tl.to(s, { x: 0, duration: 0.3, ease: "power2.inOut" }, t);
            tl.to(s.querySelector(".nf"), { opacity: 1, duration: 0.2 }, t);
            tl.to(s.querySelector(".d"), { opacity: 0, duration: 0.15 }, t);
            tl.fromTo(s.querySelector(".num svg"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, t + 0.05);
            tl.to(s.querySelector(".txt"), { color: "#b9d3c8", duration: 0.3 }, t);
          }

          // generic home screen apps, no brands
          const apps = [["#ffffff","Calendar"],["#f5a524","Photos"],["#8e8e93","Camera"],["#3b9bff","Mail"],["#ffd23f","Notes"],["#ff9f0a","Reminders"],["#1c1c1e","Clock"],["#4fb3f6","Weather"],["#30c48d","Maps"],["#8e8e93","Settings"]];
          const cols = [30, 117, 204, 291], rows = [80, 180, 280];
          const grid = q("#ih-grid");
          apps.forEach(([c, n], i) => {
            const x = cols[i % 4], y = rows[Math.floor(i / 4)];
            const ic = document.createElement("div");
            ic.className = "icon"; ic.style.left = x + "px"; ic.style.top = y + "px"; ic.style.background = c;
            const lb = document.createElement("div");
            lb.className = "icon-l"; lb.style.left = x + "px"; lb.style.top = (y + 68) + "px"; lb.textContent = n;
            grid.appendChild(ic); grid.appendChild(lb);
          });
          const dock = q("#ih-dockicons");
          ["#34c759", "#3b9bff", "#30d158", "#ff375f"].forEach((c, i) => {
            const ic = document.createElement("div");
            ic.className = "icon"; ic.style.left = (34 + i * 87) + "px"; ic.style.top = "758px"; ic.style.background = c;
            dock.appendChild(ic);
          });

          gsap.set("#ih-home", { opacity: 0 });
          gsap.set("#ih-share", { y: 560 });
          gsap.set("#ih-ahs", { y: 800 });

          // side copy arrives; the phone is already in place from the login step
          tl.fromTo("#ih-left .hl-block > *", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.1 }, 0.15);
          tl.fromTo("#ih-left .rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.4);
          tl.fromTo("#ih-steps .step", { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.08 }, 0.35);

          // 1 share
          stepOn(0, 3.2);
          tl.fromTo("#ih-shareic", { scale: 1 }, { scale: 1.2, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.inOut", transformOrigin: "50% 50%" }, 3.5);
          tap(193, 798, 4.3);
          tl.to("#ih-dim", { opacity: 1, duration: 0.3 }, 4.4);
          tl.to("#ih-share", { y: 0, duration: 0.5, ease: "power3.out" }, 4.4);
          stepDone(0, 4.6);

          // no share button? the three dots
          tl.fromTo("#ih-note", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 5.6);
          tl.to("#ih-note", { y: -10, opacity: 0, duration: 0.35, ease: "power2.in" }, 9.2);

          // 2 scroll, add to home screen
          stepOn(1, 7.4);
          tl.to("#ih-list", { y: -120, duration: 0.7, ease: "power2.inOut" }, 7.9);
          tap(193, 704, 9.5);
          tl.to("#ih-ahsrow .hi", { opacity: 1, duration: 0.1 }, 9.5);
          tl.to("#ih-ahs", { y: 0, duration: 0.5, ease: "power3.out" }, 9.75);
          stepDone(1, 9.7);
          tl.set(["#ih-safari .page", "#ih-share", "#ih-dim"], { opacity: 0 }, 10.3);

          // 3 add
          stepOn(2, 10.1);
          tap(352, 82, 11.0);
          stepDone(2, 11.2);
          tl.to("#ih-safari", { opacity: 0, scale: 0.94, duration: 0.4, ease: "power2.in" }, 11.2);
          tl.to("#ih-home", { opacity: 1, duration: 0.4 }, 11.4);
          tl.fromTo("#ih-hico", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(2)" }, 11.9);
          tl.fromTo("#ih-hlab", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 12.2);
          tl.fromTo("#ih-hring", { scale: 1, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.8, ease: "power2.out" }, 12.15);

          tl.to(["#ih-left", "#ih-steps"], { y: -20, opacity: 0, duration: 0.4, ease: "power2.in", stagger: 0.05 }, 12.55);
          window.__timelines["ios-home"] = tl;
        })();
