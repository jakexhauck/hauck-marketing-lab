<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #cap-root { position: absolute; inset: 0; }
        .cap { position: absolute; left: 0; right: 0; bottom: 56px; display: flex; justify-content: center; }
        .cap span { display: block; max-width: 1500px; padding: 14px 30px; border-radius: 18px; text-align: center;
          background: rgba(8, 24, 21, 0.86); border: 2px solid rgba(77, 187, 131, 0.3);
          font: 700 38px/1.25 Inter, sans-serif; color: #eaf5ef; }
      </style>
      <div id="cap-root" data-composition-id="captions" data-width="1920" data-height="1080">
      <div id="cap01" class="clip cap" data-start="0.50" data-duration="2.24" data-track-index="3"><span>Here's how to put the Hauck Marketing software</span></div>
      <div id="cap02" class="clip cap" data-start="2.74" data-duration="1.12" data-track-index="3"><span>on your iPhone</span></div>
      <div id="cap03" class="clip cap" data-start="3.86" data-duration="1.93" data-track-index="3"><span>so you never miss a new lead</span></div>
      <div id="cap04" class="clip cap" data-start="6.50" data-duration="2.00" data-track-index="3"><span>First, open Safari</span></div>
      <div id="cap05" class="clip cap" data-start="8.50" data-duration="4.40" data-track-index="3"><span>Tap the address bar and type app.hauckmarketing.com</span></div>
      <div id="cap06" class="clip cap" data-start="12.90" data-duration="1.76" data-track-index="3"><span>Then sign in with the email</span></div>
      <div id="cap07" class="clip cap" data-start="14.66" data-duration="1.69" data-track-index="3"><span>and password we sent you</span></div>
      <div id="cap08" class="clip cap" data-start="19.90" data-duration="2.08" data-track-index="3"><span>Next, add the Hauck Marketing software</span></div>
      <div id="cap09" class="clip cap" data-start="21.98" data-duration="1.28" data-track-index="3"><span>to your home screen</span></div>
      <div id="cap10" class="clip cap" data-start="23.26" data-duration="1.44" data-track-index="3"><span>Tap the Share button</span></div>
      <div id="cap11" class="clip cap" data-start="24.70" data-duration="1.04" data-track-index="3"><span>If you don't see it</span></div>
      <div id="cap12" class="clip cap" data-start="25.74" data-duration="1.60" data-track-index="3"><span>tap the three dots</span></div>
      <div id="cap13" class="clip cap" data-start="27.34" data-duration="2.56" data-track-index="3"><span>Scroll down, tap Add to Home Screen</span></div>
      <div id="cap14" class="clip cap" data-start="29.90" data-duration="1.13" data-track-index="3"><span>then tap Add</span></div>
      <div id="cap15" class="clip cap" data-start="32.90" data-duration="2.24" data-track-index="3"><span>Now open the Hauck Marketing software</span></div>
      <div id="cap16" class="clip cap" data-start="35.14" data-duration="1.28" data-track-index="3"><span>from your home screen</span></div>
      <div id="cap17" class="clip cap" data-start="36.42" data-duration="1.12" data-track-index="3"><span>Tap Turn on</span></div>
      <div id="cap18" class="clip cap" data-start="37.54" data-duration="1.20" data-track-index="3"><span>then Allow</span></div>
      <div id="cap19" class="clip cap" data-start="38.74" data-duration="2.16" data-track-index="3"><span>iPhone only sends notifications</span></div>
      <div id="cap20" class="clip cap" data-start="40.90" data-duration="1.44" data-track-index="3"><span>from the home screen app</span></div>
      <div id="cap21" class="clip cap" data-start="42.34" data-duration="1.93" data-track-index="3"><span>so don't skip the step before</span></div>
      <div id="cap22" class="clip cap" data-start="47.80" data-duration="1.68" data-track-index="3"><span>Now every new lead</span></div>
      <div id="cap23" class="clip cap" data-start="49.48" data-duration="1.84" data-track-index="3"><span>message, and booked appointment lands</span></div>
      <div id="cap24" class="clip cap" data-start="51.32" data-duration="2.17" data-track-index="3"><span>on your phone the moment it happens</span></div>
      <div id="cap25" class="clip cap" data-start="56.30" data-duration="1.13" data-track-index="3"><span>You're all set</span></div>
      </div>
      <script>
        (function () {
          // generated by .work/build-index.mjs from the voiceover word timings
          const tl = gsap.timeline({ paused: true });
          document.querySelectorAll("#cap-root .cap").forEach((c) => {
            const st = parseFloat(c.getAttribute("data-start"));
            tl.fromTo(c.querySelector("span"), { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.18, ease: "power2.out" }, st);
          });
          window.__timelines["captions"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
