<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #cap-root { position: absolute; inset: 0; }
        .cap { position: absolute; left: 0; right: 0; bottom: 56px; display: flex; justify-content: center; }
        .cap span { display: block; max-width: 1500px; padding: 14px 30px; border-radius: 18px; text-align: center;
          background: rgba(8, 24, 21, 0.86); border: 2px solid rgba(77, 187, 131, 0.3);
          font: 700 38px/1.25 Inter, sans-serif; color: #eaf5ef; }
      </style>
      <div id="cap-root" data-composition-id="captions" data-width="1920" data-height="1080">
      <div id="cap01" class="clip cap" data-start="0.50" data-duration="2.32" data-track-index="3"><span>Here's how to put the Hauck Marketing software</span></div>
      <div id="cap02" class="clip cap" data-start="2.82" data-duration="1.36" data-track-index="3"><span>on your Android phone</span></div>
      <div id="cap03" class="clip cap" data-start="4.18" data-duration="1.93" data-track-index="3"><span>so you never miss a new lead</span></div>
      <div id="cap04" class="clip cap" data-start="6.90" data-duration="1.84" data-track-index="3"><span>First, open Chrome</span></div>
      <div id="cap05" class="clip cap" data-start="8.74" data-duration="4.40" data-track-index="3"><span>Tap the address bar and type app.hauckmarketing.com</span></div>
      <div id="cap06" class="clip cap" data-start="13.14" data-duration="1.68" data-track-index="3"><span>Then sign in with the email</span></div>
      <div id="cap07" class="clip cap" data-start="14.82" data-duration="1.69" data-track-index="3"><span>and password we sent you</span></div>
      <div id="cap08" class="clip cap" data-start="20.00" data-duration="2.24" data-track-index="3"><span>Next, add the Hauck Marketing software</span></div>
      <div id="cap09" class="clip cap" data-start="22.24" data-duration="1.20" data-track-index="3"><span>to your home screen</span></div>
      <div id="cap10" class="clip cap" data-start="23.44" data-duration="2.56" data-track-index="3"><span>Tap the three dots in the top corner</span></div>
      <div id="cap11" class="clip cap" data-start="26.00" data-duration="2.96" data-track-index="3"><span>Tap Add to Home screen or Install app</span></div>
      <div id="cap12" class="clip cap" data-start="28.96" data-duration="1.53" data-track-index="3"><span>then tap Install</span></div>
      <div id="cap13" class="clip cap" data-start="32.40" data-duration="2.08" data-track-index="3"><span>Now open the Hauck Marketing software</span></div>
      <div id="cap14" class="clip cap" data-start="34.48" data-duration="1.20" data-track-index="3"><span>from your home screen</span></div>
      <div id="cap15" class="clip cap" data-start="35.68" data-duration="1.04" data-track-index="3"><span>Tap Turn on</span></div>
      <div id="cap16" class="clip cap" data-start="36.72" data-duration="1.05" data-track-index="3"><span>then Allow</span></div>
      <div id="cap17" class="clip cap" data-start="41.80" data-duration="1.68" data-track-index="3"><span>Now every new lead</span></div>
      <div id="cap18" class="clip cap" data-start="43.48" data-duration="1.84" data-track-index="3"><span>message, and booked appointment lands</span></div>
      <div id="cap19" class="clip cap" data-start="45.32" data-duration="2.17" data-track-index="3"><span>on your phone the moment it happens</span></div>
      <div id="cap20" class="clip cap" data-start="50.30" data-duration="1.13" data-track-index="3"><span>You're all set</span></div>
      </div>
      <script>
        (function () {
          // generated by .work/build-index.mjs from the voiceover word timings
          const tl = gsap.timeline({ paused: true });
          document.querySelectorAll("#cap-root .cap").forEach((c) => {
            const st = parseFloat(c.getAttribute("data-start"));
            tl.fromTo(c.querySelector("span"), { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.18, ease: "power2.out" }, st);
          });
          window.__timelines["captions"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
